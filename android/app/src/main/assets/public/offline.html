<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PwaniNet - Offline</title>
    <style>
        /* Theme variables matching base.html exactly */
        :root, [data-theme="light"] {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --text-dark: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #64748b;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --mobile-nav-bg: #fff;
        }

        /* Dark theme variables matching base.html exactly */
        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: #312e81;
            --text-dark: #e4e6eb;
            --background: #18191f;
            --card-bg: #242526;
            --border: #3a3b3c;
            --nav-bg: rgba(24, 25, 31, 0.9);
            --mobile-nav-bg: #242526;
            --text-secondary: #e4e6eb;
            --text-muted: #e4e6eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .offline-container {
            max-width: 400px;
            width: 100%;
            animation: fadeInUp 0.8s ease;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-icon svg {
            width: 120px;
            height: 120px;
            fill: var(--primary);
        }

        .offline-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        .offline-message {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .action-button {
            background: transparent;
            color: var(--text-secondary);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--border);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            width: 100%;
            max-width: 280px;
            justify-content: center;
        }

        .action-button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-button.primary {
            background: #2563eb;
            color: white;
            border: 2px solid #2563eb;
        }

        .action-button.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .offline-container {
                padding: 0 16px;
            }
            
            .offline-title {
                font-size: 24px;
            }
            
            .offline-message {
                font-size: 15px;
            }
            
            .offline-icon {
                width: 100px;
                height: 100px;
            }
            
            .offline-icon svg {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .offline-title {
                font-size: 20px;
            }
            
            .offline-icon {
                width: 80px;
                height: 80px;
            }
            
            .offline-icon svg {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
        </div>
        
        <h1 class="offline-title">YOU ARE OFFLINE</h1>
        
        <p class="offline-message">
            WE WILL RECONNECT WHEN YOU HAVE INTERNET ACCESS
        </p>
        
        <div class="action-buttons">
            <button class="action-button primary" onclick="window.location.reload()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                <span>RETRY CONNECTION</span>
            </button>
        </div>
    </div>

    <script>
        // Set theme immediately to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'system';
            
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                // System preference
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
        })();

        // Auto-reconnect when online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Listen for theme changes
        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') {
                applyTheme(e.newValue || 'system');
            }
        });

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const savedTheme = localStorage.getItem('theme') || 'system';
            if (savedTheme === 'system') {
                applyTheme('system');
            }
        });

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                // System preference
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
        }

        // Periodic connection check
        let checkInterval = setInterval(() => {
            if (navigator.onLine) {
                clearInterval(checkInterval);
                window.location.reload();
            }
        }, 5000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
        });
    </script>
</body>
</html>
