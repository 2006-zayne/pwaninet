{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PwaniNet | Command Center</title>
    
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    
    <style>
        :root { 
            --cmd-black: #0f172a; 
            --cmd-slate: #1e293b;
            --cmd-blue: #3b82f6; 
            --fb-gray: #f8fafc;
            --border-color: #e2e8f0; 
        }
        
        body { 
            background-color: var(--fb-gray) !important;
            color: var(--cmd-black); 
            font-family: 'Inter', sans-serif; 
            padding-top: 75px; 
            padding-bottom: 80px; 
        }

        .nav-brand-tactical {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--cmd-black);
            text-transform: uppercase;
            text-decoration: none;
            font-size: 1.4rem;
        }

        .brand-net { color: var(--cmd-blue); }

        .navbar-top { 
            background: rgba(255, 255, 255, 0.9) !important; 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); 
            height: 65px; 
        }

        .nav-chip {
            color: #64748b;
            padding: 10px 18px;
            border-radius: 12px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-chip.active { background: #eff6ff; color: var(--cmd-blue); }

        .mobile-bottom-nav { 
            background: #fff; 
            border-top: 1px solid var(--border-color); 
            height: 65px; 
            position: fixed; 
            bottom: 0; width: 100%; 
            display: flex; justify-content: space-around; align-items: center;
        }

        @media (min-width: 768px) { .mobile-bottom-nav { display: none; } }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    <nav class="navbar navbar-top fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="nav-brand-tactical" href="{% url 'home' %}">
                PWANI<span class="brand-net">NET</span>
            </a>
            
            <div class="d-none d-md-flex gap-2">
                <a href="{% url 'home' %}" class="nav-chip {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="bi bi-house-door-fill"></i>
                </a>
                <a href="{% url 'groups_dashboard' %}" class="nav-chip {% if request.resolver_match.url_name == 'groups_dashboard' %}active{% endif %}">
                    <i class="bi bi-shield-shaded"></i>
                </a>
                <a href="{% url 'notifications' %}" class="nav-chip">
                    <i class="bi bi-bell-fill"></i>
                </a>
            </div>

            <div class="d-flex align-items-center gap-3">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'profile' request.user.username %}">
                        <img src="{{ request.user.profile_pic.url }}" class="rounded-circle border" style="width: 35px; height: 35px; object-fit: cover;">
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-primary btn-sm rounded-pill px-3">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    <div class="modal fade" id="likersModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden" id="modal-content-target">
                <div class="p-5 text-center">
                    <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-bottom-nav d-md-none">
        <a href="{% url 'home' %}" class="nav-chip"><i class="bi bi-house-door-fill"></i></a>
        <a href="{% url 'groups_dashboard' %}" class="nav-chip"><i class="bi bi-people-fill"></i></a>
        {% if user.is_authenticated %}
            <a href="{% url 'create_post' %}" class="nav-chip"><i class="bi bi-plus-circle-fill"></i></a>
            <a href="{% url 'notifications' %}" 
                class="nav-chip position-relative"
                hx-get="{% url 'unread_notification_count' %}" 
                hx-trigger="every 30s"
                hx-swap="innerHTML"
                id="notification-badge-container">
                    
                    <i class="bi bi-bell-fill"></i>
                    
                    {% if unread_notifications_count > 0 %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light" 
                            style="font-size: 0.6rem; padding: 0.35em 0.5em;">
                            {{ unread_notifications_count }}
                            <span class="visually-hidden">unread messages</span>
                        </span>
                    {% endif %}
            </a>
            <a href="{% url 'profile' request.user.username %}" class="nav-chip"><i class="bi bi-person-circle"></i></a>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Protocol: Reset modal intel on close
        const likersModal = document.getElementById('likersModal');
        likersModal.addEventListener('hidden.bs.modal', function () {
            document.getElementById('modal-content-target').innerHTML = `
                <div class="p-5 text-center">
                    <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                </div>`;
        });
    </script>
</body>
</html>
