{% extends 'base.html' %}

{% block content %}
<style>
  :root, [data-theme="light"] {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #dbeafe;
    --search-bg: #f3f0ec;
    --search-bg-focus: #fff;
    --header-blur-bg: rgba(255, 255, 255, 0.88);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-soft: #e2e8f0;
    --avatar-ring: #2563eb;
    --radius-pill: 999px;
    --radius-lg: 16px;
    --transition-smooth: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="dark"] {
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-light: #312e81;
    --search-bg: #3a3b3c;
    --search-bg-focus: #4e4f50;
    --header-blur-bg: rgba(24, 25, 31, 0.88);
    --text-main: #e4e6eb;
    --text-muted: #e4e6eb;
    --border-soft: #3a3b3c;
    --avatar-ring: #6366f1;
  }

  * { font-family: 'Inter', 'Roboto', system-ui, -apple-system, sans-serif; }

  body { background-color: var(--background); color: var(--text-main); }

  /* ── Sticky Search Header ── */
  .search-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header-blur-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
    padding: 12px 16px 10px;
  }

  .search-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* ── Avatar ── */
  .avatar-link {
    flex-shrink: 0;
    display: block;
    position: relative;
    transition: transform var(--transition-smooth);
  }
  .avatar-link:hover { transform: scale(1.06); }
  .avatar-link::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid var(--avatar-ring);
    opacity: 0;
    transition: opacity var(--transition-smooth);
  }
  .avatar-link:hover::after { opacity: 1; }
  .avatar-img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  /* ── Search Form ── */
  .search-form {
    flex: 1;
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
    pointer-events: none;
    transition: color var(--transition-smooth);
    z-index: 2;
  }
  .search-input {
    width: 100%;
    background: var(--search-bg);
    border: 0;
    border-radius: var(--radius-pill);
    padding: 10px 42px 10px 40px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-main);
    outline: none;
    transition:
      background var(--transition-smooth),
      box-shadow var(--transition-smooth);
    line-height: 1.4;
  }
  .search-input::placeholder { color: var(--text-muted); font-weight: 400; }
  .search-input:focus {
    background: var(--search-bg-focus);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .search-input:focus ~ .search-icon,
  .search-form:focus-within .search-icon { color: var(--primary); }

  /* clear button shows when input has value */
  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--text-muted);
    border: none;
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    z-index: 2;
    transition: background var(--transition-smooth);
  }
  .search-clear:hover { background: var(--text-main); }
  .search-input:not(:placeholder-shown) ~ .search-clear { display: flex; }

  /* ── Loading Indicator ── */
  #search-indicator {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 10px 0 2px;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  #search-indicator.htmx-request { display: flex; }
  .search-dots {
    display: flex;
    gap: 4px;
  }
  .search-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    animation: bounce-dot 0.9s infinite ease-in-out;
  }
  .search-dots span:nth-child(2) { animation-delay: 0.15s; }
  .search-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes bounce-dot {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Main Content Area ── */
  .content-wrapper {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  @media (max-width: 767px) {
    .content-wrapper {
      max-width: 100% !important;
      padding: 20px 0 80px;
    }
    .container, .container-fluid {
      max-width: 100% !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
  }

  #main-content-area {
    animation: fade-in 0.3s ease;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* htmx swap animation */
  #main-content-area.htmx-swapping { opacity: 0; transition: opacity 0.15s ease; }
  #main-content-area.htmx-settling { animation: fade-in 0.3s ease; }

  /* ── Groups to Explore Section ── */
  .groups-explore-section {
    margin-bottom: 24px;
  }

  .groups-explore-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .groups-explore-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .groups-explore-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
  }

  .groups-explore-link:hover {
    text-decoration: underline;
  }

  .groups-explore-list {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
  }

  .groups-explore-list::-webkit-scrollbar {
    display: none;
  }

  .group-explore-item {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 70px;
  }

  .group-explore-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .group-explore-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-main);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
</style>

<div class="container-fluid p-0">

  <!-- Sticky Search Header -->
  <header class="search-header">
    <div class="search-inner">

      <!-- Avatar -->
      <a href="{% url 'users:profile' request.user.username %}" class="avatar-link">
        <img src="{{ request.user.profile_pic.url }}"
             class="avatar-img"
             alt="{{ request.user.username }}'s profile">
      </a>

      <!-- Search Form -->
      <form method="GET"
            action="{% url 'posts:search' %}"
            class="search-form"
            hx-get="{% url 'posts:search' %}"
            hx-target="#main-content-area"
            hx-trigger="submit"
            autocomplete="off">
        <i class="bi bi-search search-icon"></i>
        <input type="text"
               name="q"
               class="search-input"
               placeholder="Search friends &amp; groups…"
               value="{{ request.GET.q }}"
               hx-get="{% url 'posts:search' %}"
               hx-target="#main-content-area"
               hx-trigger="keyup changed delay:500ms, search"
               hx-indicator="#search-indicator"
               aria-label="Search friends and groups">
        <button type="button"
                class="search-clear"
                onclick="this.previousElementSibling.value=''; this.previousElementSibling.dispatchEvent(new Event('search'));"
                aria-label="Clear search">
          <i class="bi bi-x"></i>
        </button>
      </form>

    </div>

    <!-- Loading indicator (inside header, below search) -->
    <div class="content-wrapper" style="padding-top:0; padding-bottom:0;">
      <div id="search-indicator" class="htmx-indicator">
        <div class="search-dots">
          <span></span><span></span><span></span>
        </div>
        Searching…
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="content-wrapper">
      <div id="main-content-area"
           hx-swap-oob="true">
        {% include 'posts/partials/home_content.html' %}
      </div>
    </div>
  </main>

</div>
{% endblock %}
