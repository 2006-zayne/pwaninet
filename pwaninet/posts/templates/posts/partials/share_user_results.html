{% if users %}
    {% for user in users %}
    <div class="d-flex align-items-center p-2 border-bottom user-item" data-username="{{ user.username }}">
        <input type="checkbox" class="form-check-input me-3 user-checkbox" value="{{ user.username }}" id="user-{{ user.id }}">
        <label for="user-{{ user.id }}" class="d-flex align-items-center flex-grow-1 cursor-pointer" style="cursor: pointer;">
            <img src="{{ user.profile_pic.url }}" class="rounded-circle me-2" style="width: 40px; height: 40px; object-fit: cover;">
            <div>
                <div class="fw-bold small">{{ user.get_full_name|default:user.username }}</div>
                <div class="text-muted small">@{{ user.username }}</div>
            </div>
        </label>
    </div>
    {% endfor %}
{% else %}
    <div class="p-3 text-center text-muted">
        <small>No users found</small>
    </div>
{% endif %}
