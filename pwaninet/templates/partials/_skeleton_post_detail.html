<!-- Post Detail Skeleton -->
<div class="skeleton-container">
    <!-- Post Header -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px; border-bottom: 1px solid var(--border, #e2e8f0); margin-bottom: 8px;">
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
            <div class="skeleton-avatar"></div>
            <div style="flex: 1;">
                <div class="skeleton-line skeleton-name" style="width: 140px; margin-bottom: 6px;"></div>
                <div class="skeleton-line skeleton-time" style="width: 100px;"></div>
            </div>
        </div>
    </div>

    <!-- Post Content -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px; margin-bottom: 8px; border-bottom: 1px solid var(--border, #e2e8f0);">
        <div class="skeleton-post-body">
            <div class="skeleton-line skeleton-text-line"></div>
            <div class="skeleton-line skeleton-text-line"></div>
            <div class="skeleton-line skeleton-text-line"></div>
            <div class="skeleton-line" style="width: 70%; height: 14px;"></div>
        </div>
        <div class="skeleton-post-media" style="margin: 12px 0 0;"></div>
    </div>

    <!-- Post Stats -->
    <div style="background: var(--card-bg, #ffffff); padding: 12px 16px; border-bottom: 1px solid var(--border, #e2e8f0); display: flex; justify-content: space-around;">
        <div class="skeleton-line" style="width: 60px; height: 12px;"></div>
        <div class="skeleton-line" style="width: 60px; height: 12px;"></div>
        <div class="skeleton-line" style="width: 60px; height: 12px;"></div>
    </div>

    <!-- Post Actions -->
    <div style="background: var(--card-bg, #ffffff); padding: 12px; border-bottom: 1px solid var(--border, #e2e8f0); display: flex; justify-content: space-around;">
        <div class="skeleton-action"></div>
        <div class="skeleton-action"></div>
        <div class="skeleton-action"></div>
    </div>

    <!-- Comments Section -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px;">
        <div class="skeleton-line" style="width: 100px; height: 14px; margin-bottom: 12px;"></div>
        
        <!-- Comment 1 -->
        <div style="display: flex; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border, #e2e8f0);">
            <div class="skeleton-avatar-sm"></div>
            <div style="flex: 1;">
                <div class="skeleton-line" style="width: 100px; height: 12px; margin-bottom: 6px;"></div>
                <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 6px;"></div>
                <div class="skeleton-line" style="width: 80%; height: 12px;"></div>
            </div>
        </div>

        <!-- Comment 2 -->
        <div style="display: flex; gap: 12px; padding-bottom: 12px;">
            <div class="skeleton-avatar-sm"></div>
            <div style="flex: 1;">
                <div class="skeleton-line" style="width: 120px; height: 12px; margin-bottom: 6px;"></div>
                <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 6px;"></div>
                <div class="skeleton-line" style="width: 90%; height: 12px;"></div>
            </div>
        </div>
    </div>
</div>
