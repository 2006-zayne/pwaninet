<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaging Architecture Test - Message State System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .messages-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
        }
        .date-separator { text-align: center; margin: 10px 0; }
        .date-separator span {
            background: #e0e0e0;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .message-bubble {
            max-width: 70%;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 18px;
            position: relative;
        }
        .sent {
            background: #cfd8dc;
            margin-left: auto;
            text-align: right;
        }
        .received {
            background: white;
            border: 1px solid #ddd;
        }
        .consecutive-message {
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .status-indicator {
            display: inline-block;
            margin-left: 8px;
            font-size: 12px;
        }
        .check-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ccc;
        }
        .check-circle.blue { background: #2196F3; color: white; }
        .check-circle.grey { background: #9e9e9e; color: white; }
        .check-circle.pending { background: #ff9800; color: white; }
        .check-circle.error { background: #f44336; color: white; }
        .check-circle.retrying { background: #ff9800; color: white; }
        .check-circle.cancelled { background: #9e9e9e; color: white; }
        .spinner {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 8px;
            background: #e0e0e0;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
        }
        button:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>⚡ Messaging Architecture Test</h1>
    
    <div class="test-section">
        <h2>State-Driven Architecture Verification</h2>
        <div id="test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Live Messages Container</h2>
        <div id="messagesContainer" class="messages-container"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="testArchitecture()">Run Architecture Test</button>
        <button onclick="addTestMessage()">Add Test Message</button>
        <button onclick="addTestMessages()">Add Multiple Messages</button>
        <button onclick="clearMessages()">Clear Messages</button>
    </div>

    <div class="test-section">
        <h2>Message State Testing</h2>
        <div class="controls-grid">
            <button onclick="simulateState('draft')">Simulate DRAFT</button>
            <button onclick="simulateState('queued')">Simulate QUEUED</button>
            <button onclick="simulateState('processing')">Simulate PROCESSING</button>
            <button onclick="simulateState('uploading')">Simulate UPLOADING</button>
            <button onclick="simulateState('sending')">Simulate SENDING</button>
            <button onclick="simulateState('sent')">Simulate SENT</button>
            <button onclick="simulateState('delivered')">Simulate DELIVERED</button>
            <button onclick="simulateState('read')">Simulate READ</button>
            <button onclick="simulateState('failed_upload')">Simulate FAILED_UPLOAD</button>
            <button onclick="simulateState('failed_send')">Simulate FAILED_SEND</button>
            <button onclick="simulateState('retrying')">Simulate RETRYING</button>
            <button onclick="simulateState('cancelled')">Simulate CANCELLED</button>
        </div>
        <div style="margin-top: 15px;">
            <button onclick="simulateOffline()">Simulate Offline</button>
            <button onclick="simulateOnline()">Simulate Online</button>
            <button onclick="simulateUploadFailure()">Simulate Upload Failure</button>
            <button onclick="simulateWebSocketTimeout()">Simulate WebSocket Timeout</button>
        </div>
    </div>

    <div class="test-section">
        <h2>State Transition Testing</h2>
        <div>
            <label>Last Message ID: </label>
            <input type="text" id="stateMessageId" placeholder="Enter message ID" style="width: 200px; padding: 5px;">
            <select id="targetState" style="padding: 5px;">
                <option value="">Select target state...</option>
                <option value="draft">draft</option>
                <option value="queued">queued</option>
                <option value="processing">processing</option>
                <option value="uploading">uploading</option>
                <option value="sending">sending</option>
                <option value="sent">sent</option>
                <option value="delivered">delivered</option>
                <option value="read">read</option>
                <option value="failed_upload">failed_upload</option>
                <option value="failed_send">failed_send</option>
                <option value="retrying">retrying</option>
                <option value="cancelled">cancelled</option>
            </select>
            <button onclick="transitionMessageState()">Transition State</button>
        </div>
        <div id="transitionResult" style="margin-top: 10px;"></div>
    </div>

    <script>
        // Unified Message State Enum
        const MESSAGE_STATE = {
            DRAFT: 'draft',
            QUEUED: 'queued',
            PROCESSING: 'processing',
            UPLOADING: 'uploading',
            SENDING: 'sending',
            SENT: 'sent',
            DELIVERED: 'delivered',
            READ: 'read',
            FAILED_UPLOAD: 'failed_upload',
            FAILED_SEND: 'failed_send',
            RETRYING: 'retrying',
            CANCELLED: 'cancelled'
        };

        // Valid state transitions
        const MESSAGE_STATE_TRANSITIONS = {
            [MESSAGE_STATE.DRAFT]: [MESSAGE_STATE.QUEUED, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.QUEUED]: [MESSAGE_STATE.PROCESSING, MESSAGE_STATE.SENDING, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.PROCESSING]: [MESSAGE_STATE.UPLOADING, MESSAGE_STATE.SENDING, MESSAGE_STATE.FAILED_UPLOAD, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.UPLOADING]: [MESSAGE_STATE.SENDING, MESSAGE_STATE.FAILED_UPLOAD, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.SENDING]: [MESSAGE_STATE.SENT, MESSAGE_STATE.FAILED_SEND, MESSAGE_STATE.RETRYING],
            [MESSAGE_STATE.SENT]: [MESSAGE_STATE.DELIVERED, MESSAGE_STATE.READ, MESSAGE_STATE.FAILED_SEND],
            [MESSAGE_STATE.DELIVERED]: [MESSAGE_STATE.READ],
            [MESSAGE_STATE.READ]: [],
            [MESSAGE_STATE.FAILED_UPLOAD]: [MESSAGE_STATE.RETRYING, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.FAILED_SEND]: [MESSAGE_STATE.RETRYING, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.RETRYING]: [MESSAGE_STATE.SENDING, MESSAGE_STATE.FAILED_UPLOAD, MESSAGE_STATE.FAILED_SEND, MESSAGE_STATE.CANCELLED],
            [MESSAGE_STATE.CANCELLED]: []
        };

        function isValidStateTransition(fromState, toState) {
            if (!MESSAGE_STATE_TRANSITIONS[fromState]) {
                return false;
            }
            return MESSAGE_STATE_TRANSITIONS[fromState].includes(toState);
        }

        function getStatusIcon(state, messageId) {
            switch (state) {
                case MESSAGE_STATE.DRAFT:
                case MESSAGE_STATE.QUEUED:
                case MESSAGE_STATE.PROCESSING:
                    return '<span class="check-circle pending">🕐</span>';
                case MESSAGE_STATE.UPLOADING:
                    return '<span class="check-circle pending"><span class="spinner"></span></span>';
                case MESSAGE_STATE.SENDING:
                    return '<span class="check-circle pending">🕐</span>';
                case MESSAGE_STATE.SENT:
                    return '<span class="check-circle grey">✓</span>';
                case MESSAGE_STATE.DELIVERED:
                    return '<span class="check-circle blue">✓</span>';
                case MESSAGE_STATE.READ:
                    return '<span class="check-circle blue">✓</span>';
                case MESSAGE_STATE.FAILED_UPLOAD:
                case MESSAGE_STATE.FAILED_SEND:
                    return '<span class="check-circle error">✗</span>';
                case MESSAGE_STATE.RETRYING:
                    return '<span class="check-circle retrying"><span class="spinner"></span></span>';
                case MESSAGE_STATE.CANCELLED:
                    return '<span class="check-circle cancelled">✕</span>';
                default:
                    return '<span class="check-circle grey">✓</span>';
            }
        }

        // Simplified MessagingManager for testing
        class TestMessagingManager {
            constructor() {
                this.messages = [];
                this.isRendering = false;
                this.currentUserId = 'user1';
                this.messageIdCounter = 1;
            }

            // STATE LAYER
            addMessage(messageData) {
                // Add default state if not provided
                if (!messageData.state) {
                    messageData.state = MESSAGE_STATE.SENT;
                }
                this.messages.push(messageData);
                this.messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                this.render();
            }
            
            // VIEW MODEL LAYER
            buildView(messages) {
                const viewItems = [];
                let lastDate = null;
                let lastSenderId = null;
                
                for (const message of messages) {
                    const messageDate = new Date(message.created_at).toDateString();
                    const isOwn = message.sender_id === this.currentUserId;
                    
                    // Add date separator if needed
                    if (messageDate !== lastDate) {
                        viewItems.push({
                            type: 'date',
                            label: this.formatDateLabel(message.created_at)
                        });
                        lastDate = messageDate;
                    }
                    
                    // Determine if this is a consecutive message
                    const isConsecutive = lastSenderId === message.sender_id;
                    lastSenderId = message.sender_id;
                    
                    // Add message to view
                    viewItems.push({
                        type: 'message',
                        ...message,
                        isOwn,
                        isConsecutive,
                        isLastSent: isOwn && message === messages.filter(m => m.sender_id === this.currentUserId).pop()
                    });
                }
                
                return viewItems;
            }
            
            formatDateLabel(dateString) {
                const date = new Date(dateString);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (date.toDateString() === today.toDateString()) {
                    return 'Today';
                } else if (date.toDateString() === yesterday.toDateString()) {
                    return 'Yesterday';
                } else {
                    return date.toLocaleDateString('en-GB', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    }).replace(/\//g, '/');
                }
            }
            
            // RENDER LAYER
            render() {
                if (this.isRendering) return;
                this.isRendering = true;
                
                try {
                    const container = document.getElementById('messagesContainer');
                    if (!container) return;
                    
                    container.innerHTML = '';
                    const viewItems = this.buildView(this.messages);
                    
                    viewItems.forEach(item => {
                        if (item.type === 'date') {
                            const dateElement = document.createElement('div');
                            dateElement.className = 'date-separator';
                            dateElement.innerHTML = `<span>${item.label}</span>`;
                            container.appendChild(dateElement);
                        } else if (item.type === 'message') {
                            const messageElement = this.createMessageElement(item);
                            container.appendChild(messageElement);
                        }
                    });
                    
                    container.scrollTop = container.scrollHeight;
                    
                } finally {
                    this.isRendering = false;
                }
            }
            
            createMessageElement(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message-bubble ${message.isOwn ? 'sent' : 'received'} ${message.isConsecutive ? 'consecutive-message' : 'first-in-group'} ${message.isLastSent ? 'last-sent' : ''}`;
                messageDiv.setAttribute('data-message-id', message.id);
                messageDiv.setAttribute('data-sender-id', message.sender_id);

                const statusIcon = message.isOwn ? getStatusIcon(message.state, message.id) : '';
                const stateBadge = message.isOwn ? `<span class="state-badge">${message.state}</span>` : '';

                messageDiv.innerHTML = `
                    <p class="message-content">${message.content || ''}</p>
                    <div class="message-time">
                        ${new Date(message.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        ${statusIcon}
                        ${stateBadge}
                    </div>
                `;

                return messageDiv;
            }
        }
        
        const testManager = new TestMessagingManager();
        
        function testArchitecture() {
            const results = document.getElementById('test-results');
            let output = '<h3>Architecture Test Results:</h3>';
            
            // Test 1: State Layer
            try {
                testManager.messages = [];
                testManager.addMessage({
                    id: testManager.messageIdCounter++,
                    sender_id: 'user1',
                    content: 'Test message 1',
                    created_at: new Date().toISOString()
                });
                
                if (testManager.messages.length === 1) {
                    output += '<div class="success">✅ State Layer: Messages array works correctly</div>';
                } else {
                    output += '<div class="error">❌ State Layer: Messages array failed</div>';
                }
            } catch (error) {
                output += `<div class="error">❌ State Layer: ${error.message}</div>`;
            }
            
            // Test 2: View Model Layer
            try {
                const viewItems = testManager.buildView(testManager.messages);
                if (viewItems.length > 0 && viewItems[0].type === 'message') {
                    output += '<div class="success">✅ View Model Layer: buildView() works correctly</div>';
                } else {
                    output += '<div class="error">❌ View Model Layer: buildView() failed</div>';
                }
            } catch (error) {
                output += `<div class="error">❌ View Model Layer: ${error.message}</div>`;
            }
            
            // Test 3: Render Layer
            try {
                const container = document.getElementById('messagesContainer');
                const beforeCount = container.children.length;
                testManager.render();
                const afterCount = container.children.length;
                
                if (afterCount > beforeCount) {
                    output += '<div class="success">✅ Render Layer: render() works correctly</div>';
                } else {
                    output += '<div class="error">❌ Render Layer: render() failed</div>';
                }
            } catch (error) {
                output += `<div class="error">❌ Render Layer: ${error.message}</div>`;
            }
            
            // Test 4: Date Separators
            try {
                testManager.messages = [];
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                testManager.addMessage({
                    id: testManager.messageIdCounter++,
                    sender_id: 'user2',
                    content: 'Yesterday message',
                    created_at: yesterday.toISOString()
                });
                
                testManager.addMessage({
                    id: testManager.messageIdCounter++,
                    sender_id: 'user1',
                    content: 'Today message',
                    created_at: today.toISOString()
                });
                
                const container = document.getElementById('messagesContainer');
                const dateSeparators = container.querySelectorAll('.date-separator');
                
                if (dateSeparators.length >= 1) {
                    output += '<div class="success">✅ Date Separators: Working correctly</div>';
                } else {
                    output += '<div class="error">❌ Date Separators: Not working</div>';
                }
            } catch (error) {
                output += `<div class="error">❌ Date Separators: ${error.message}</div>`;
            }
            
            // Test 5: Message Alignment
            try {
                const sentMessages = document.querySelectorAll('.message-bubble.sent');
                const receivedMessages = document.querySelectorAll('.message-bubble.received');
                
                if (sentMessages.length > 0 && receivedMessages.length > 0) {
                    output += '<div class="success">✅ Message Alignment: Both sent and received messages render correctly</div>';
                } else {
                    output += '<div class="error">❌ Message Alignment: Missing sent or received messages</div>';
                }
            } catch (error) {
                output += `<div class="error">❌ Message Alignment: ${error.message}</div>`;
            }
            
            results.innerHTML = output;
        }
        
        function addTestMessage() {
            testManager.addMessage({
                id: testManager.messageIdCounter++,
                sender_id: Math.random() > 0.5 ? 'user1' : 'user2',
                content: `Test message ${testManager.messageIdCounter - 1}`,
                created_at: new Date().toISOString()
            });
        }
        
        function addTestMessages() {
            const messages = [
                { sender_id: 'user2', content: 'Hello there!', delay: 0 },
                { sender_id: 'user1', content: 'Hi! How are you?', delay: 100 },
                { sender_id: 'user2', content: "I'm doing great, thanks!", delay: 200 },
                { sender_id: 'user2', content: 'How about you?', delay: 300 },
                { sender_id: 'user1', content: "I'm good too!", delay: 400 },
                { sender_id: 'user1', content: 'Want to grab coffee?', delay: 500 }

            ];
            
            messages.forEach(msg => {
                setTimeout(() => {
                    testManager.addMessage({
                        id: testManager.messageIdCounter++,
                        sender_id: msg.sender_id,
                        content: msg.content,
                        created_at: new Date().toISOString()
                    });
                }, msg.delay);
            });
        }
        
        function clearMessages() {
            testManager.messages = [];
            testManager.render();
        }

        // Message State Testing Functions
        function simulateState(state) {
            const lastMessage = testManager.messages[testManager.messages.length - 1];
            if (lastMessage) {
                const oldState = lastMessage.state;
                if (isValidStateTransition(oldState, state)) {
                    lastMessage.state = state;
                    testManager.render();
                    console.log(`State transition: ${oldState} -> ${state}`);
                } else {
                    console.error(`Invalid transition: ${oldState} -> ${state}`);
                    alert(`Invalid transition: ${oldState} -> ${state}`);
                }
            } else {
                // Add a new message with the specified state
                testManager.addMessage({
                    id: testManager.messageIdCounter++,
                    sender_id: 'user1',
                    content: `Test message in ${state} state`,
                    created_at: new Date().toISOString(),
                    state: state
                });
            }
        }

        function transitionMessageState() {
            const messageId = document.getElementById('stateMessageId').value;
            const targetState = document.getElementById('targetState').value;
            const resultDiv = document.getElementById('transitionResult');

            if (!messageId || !targetState) {
                resultDiv.innerHTML = '<span class="error">Please enter message ID and select target state</span>';
                return;
            }

            const message = testManager.messages.find(m => m.id == messageId);
            if (!message) {
                resultDiv.innerHTML = '<span class="error">Message not found</span>';
                return;
            }

            const oldState = message.state;
            if (isValidStateTransition(oldState, targetState)) {
                message.state = targetState;
                testManager.render();
                resultDiv.innerHTML = `<span class="success">Transition successful: ${oldState} -> ${targetState}</span>`;
            } else {
                resultDiv.innerHTML = `<span class="error">Invalid transition: ${oldState} -> ${targetState}</span>`;
            }
        }

        function simulateOffline() {
            console.log('Simulating offline mode');
            window.dispatchEvent(new Event('offline'));
            alert('Offline mode simulated. Network requests will fail.');
        }

        function simulateOnline() {
            console.log('Simulating online mode');
            window.dispatchEvent(new Event('online'));
            alert('Online mode simulated. Network requests will succeed.');
        }

        function simulateUploadFailure() {
            console.log('Simulating upload failure');
            const uploadingMessages = testManager.messages.filter(m => m.state === MESSAGE_STATE.UPLOADING);
            if (uploadingMessages.length > 0) {
                uploadingMessages.forEach(m => {
                    m.state = MESSAGE_STATE.FAILED_UPLOAD;
                });
                testManager.render();
                alert(`Upload failure simulated for ${uploadingMessages.length} message(s)`);
            } else {
                // Add a message and fail it
                testManager.addMessage({
                    id: testManager.messageIdCounter++,
                    sender_id: 'user1',
                    content: 'Test message with failed upload',
                    created_at: new Date().toISOString(),
                    state: MESSAGE_STATE.FAILED_UPLOAD
                });
                alert('Upload failure simulated (added new failed message)');
            }
        }

        function simulateWebSocketTimeout() {
            console.log('Simulating WebSocket timeout');
            const sendingMessages = testManager.messages.filter(m => m.state === MESSAGE_STATE.SENDING);
            if (sendingMessages.length > 0) {
                sendingMessages.forEach(m => {
                    m.state = MESSAGE_STATE.FAILED_SEND;
                });
                testManager.render();
                alert(`WebSocket timeout simulated for ${sendingMessages.length} message(s)`);
            } else {
                // Add a message and fail it
                testManager.addMessage({
                    id: testManager.messageIdCounter++,
                    sender_id: 'user1',
                    content: 'Test message with failed send',
                    created_at: new Date().toISOString(),
                    state: MESSAGE_STATE.FAILED_SEND
                });
                alert('WebSocket timeout simulated (added new failed message)');
            }
        }

        // Run test on page load
        window.addEventListener('load', () => {
            testArchitecture();
            // Add initial messages with different states for testing
            testManager.addMessage({
                id: testManager.messageIdCounter++,
                sender_id: 'user2',
                content: 'Hello! This is a received message',
                created_at: new Date().toISOString(),
                state: MESSAGE_STATE.READ
            });
            testManager.addMessage({
                id: testManager.messageIdCounter++,
                sender_id: 'user1',
                content: 'This message is in SENT state',
                created_at: new Date().toISOString(),
                state: MESSAGE_STATE.SENT
            });
        });
    </script>
</body>
</html>
