{% extends 'base.html' %}

{% block content %}
<div class="container-fluid p-0">
    <div class="bg-white">
        <div class="container py-4 px-3">
            <form method="POST" enctype="multipart/form-data" id="postForm">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Target Group</label>
                    {{ form.unit }}
                    <small class="form-text text-muted">Leave as "General" to post to the entire university feed.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Message</label>
                    {{ form.content }}
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Media</label>
                    <div class="d-flex gap-2">
                        <div class="media-upload-box text-center p-2 border rounded-2 bg-light flex-fill">
                            <label for="id_images" class="mb-0 cursor-pointer d-block">
                                <i class="bi bi-images text-primary d-block fs-5"></i>
                                <span class="x-small fw-bold">Images (Max 15)</span>
                            </label>
                            <input type="file" id="id_images" name="images" accept="image/*" multiple class="visually-hidden">
                        </div>
                        <div class="media-upload-box text-center p-2 border rounded-2 bg-light flex-fill">
                            <label for="{{ form.video.id_for_label }}" class="mb-0 cursor-pointer d-block">
                                <i class="bi bi-play-btn text-danger d-block fs-5"></i>
                                <span class="x-small fw-bold">Video</span>
                            </label>
                            <div class="visually-hidden">{{ form.video }}</div>
                        </div>
                        <div class="media-upload-box text-center p-2 border rounded-2 bg-light flex-fill">
                            <label for="{{ form.docs.id_for_label }}" class="mb-0 cursor-pointer d-block">
                                <i class="bi bi-file-earmark-pdf text-info d-block fs-5"></i>
                                <span class="x-small fw-bold">Docs</span>
                            </label>
                            <div class="visually-hidden">{{ form.docs }}</div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted text-uppercase">Gradient</label>
                    {{ form.gradient_class }}
                    <div class="mt-2 p-3 rounded-2 border preview-box bg-light" id="previewBox">
                        <p class="text-center text-muted small mb-0">Preview</p>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1 fw-bold">
                        <i class="bi bi-send-fill me-2"></i>Post
                    </button>
                    <a href="{% url 'home' %}" class="btn btn-link text-muted text-decoration-none fw-bold">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
        <hr class="m-0 opacity-25" style="border-top: 1px solid #dee2e6;">
    </div>
</div>

<style>
    .fw-black { font-weight: 900; }
    .x-small { font-size: 0.7rem; }
    .cursor-pointer { cursor: pointer; }
    .italic { font-style: italic; }

    /* Custom Form Styling */
    #postForm textarea {
        border: 1px solid #dee2e6 !important;
        border-radius: 8px !important;
        background-color: #f8f9fa !important;
        transition: all 0.3s ease;
        padding: 10px 12px;
    }
    #postForm textarea:focus {
        background-color: #fff !important;
        border-color: var(--bs-primary) !important;
        box-shadow: none !important;
    }
    #postForm select {
        border-radius: 8px !important;
        border: 1px solid #dee2e6 !important;
        background-color: #f8f9fa !important;
    }

    .media-upload-box {
        transition: all 0.2s ease;
        cursor: pointer;
        border: 1px solid #dee2e6 !important;
    }
    .media-upload-box:hover {
        background-color: #e9ecef !important;
        border-color: var(--bs-primary) !important;
    }

    /* Gradient Classes */
    .grad-ocean {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white;
    }
    .grad-forest {
        background: linear-gradient(135deg, #134e5e 0%, #71b280 100%) !important;
        color: white;
    }
    .grad-magma {
        background: linear-gradient(135deg, #f12711 0%, #f5af19 100%) !important;
        color: white;
    }
    .grad-midnight {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important;
        color: white;
    }

    .preview-box {
        min-height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
</style>

<script>
    document.getElementById('gradientPreview').addEventListener('change', function() {
        const previewBox = document.getElementById('previewBox');
        const selectedValue = this.value;

        // Remove all gradient classes
        previewBox.classList.remove('grad-ocean', 'grad-forest', 'grad-magma', 'grad-midnight');
        previewBox.classList.remove('bg-light');

        // Add the selected gradient class
        if (selectedValue && selectedValue !== 'none') {
            previewBox.classList.add(selectedValue);
            previewBox.innerHTML = '<p class="text-center mb-0" style="font-weight: bold;">✨ Preview ✨</p>';
        } else {
            previewBox.classList.add('bg-light');
            previewBox.innerHTML = '<p class="text-center text-muted small mb-0">Standard (No Gradient)</p>';
        }
    });

    // Trigger preview on page load
    window.addEventListener('load', function() {
        document.getElementById('gradientPreview').dispatchEvent(new Event('change'));
    });
</script>
{% endblock %}
