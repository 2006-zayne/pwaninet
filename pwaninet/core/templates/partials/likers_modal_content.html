<div class="modal-header border-0 pb-0">
    <h6 class="modal-title fw-bold text-uppercase letter-spacing-1" style="font-size: 0.85rem;">
        <i class="bi bi-shield-check me-2 text-primary"></i>Comrades who liked:
    </h6>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body pt-3">
    <div class="list-group list-group-flush">
        {% for operative in likers %}
        <div class="list-group-item border-0 px-0 d-flex align-items-center justify-content-between bg-transparent mb-2">
            <div class="d-flex align-items-center gap-3">
                <a href="{% url 'users:profile' operative.username %}">
                    <img src="{{ operative.profile_pic.url }}" 
                         class="rounded-circle border border-2 border-light shadow-sm" 
                         style="width: 42px; height: 42px; object-fit: cover;">
                </a>
                <div>
                    <h6 class="mb-0 fw-bold small text-dark">
                        {{ operative.get_full_name|default:operative.username }}
                    </h6>
                    <small class="text-muted" style="font-size: 0.75rem;">@{{ operative.username }}</small>
                </div>
            </div>
            <a href="{% url 'users:profile' operative.username %}" 
               class="btn btn-outline-primary btn-sm rounded-pill px-3 py-1 fw-bold" 
               style="font-size: 0.65rem; border-width: 2px;">
                VIEW PROFILE
            </a>
        </div>
        {% empty %}
        <div class="text-center py-5">
            <i class="bi bi-radar text-muted fs-1 mb-3 d-block"></i>
            <p class="small fw-bold text-uppercase text-muted letter-spacing-1">Zero Signals Detected</p>
            <p class="text-muted x-small">No comrades have interacted with this post yet.</p>
        </div>
        {% endfor %}
    </div>
</div>
