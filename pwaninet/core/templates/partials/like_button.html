<button class="btn {% if is_liked %}btn-liked{% else %}btn-outline-primary{% endif %} btn-sm border-0"
        hx-post="{% url 'toggle_like' post.id %}"
        hx-target="this"
        hx-swap="outerHTML">
    
    <i class="bi {% if is_liked %}bi-heart-fill{% else %}bi-heart{% endif %}"></i>
    
    <span class="ms-1 fw-bold">{{ like_count }}</span>
</button>
