{% extends 'base.html' %}

{% block content %}
<h2>Your Notifications</h2>
<hr>

{% for n in notifications %}
   <div style="padding: 10px; border-bottom: 1px solid white; ">
    {% if not n.is_read %}
    
    {% endif %}
        <strong>{{ n.sender.get_full_name }}</strong> {{ n.msg }}
        <br>
        <small class="text-muted">{{ n.timestamp|timesince }} ago</small>
    </div>
{% empty %}
    <p>No new notification !</p>
{% endfor %}

{% endblock %}
