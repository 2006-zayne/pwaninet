<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PwaniNet | Command Center</title>
    
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>

    .nav-brand-tactical {
        font-family: 'Syncopate', sans-serif; /* Futuristic wide font */
        font-weight: 700;
        letter-spacing: 2px; /* Spacing for that tech look */
        color: var(--cmd-black);
        text-transform: uppercase;
        font-size: 1.4rem;
        transition: all 0.3s ease;
    }

    .nav-brand-tactical:hover {
        letter-spacing: 4px; /* Subtle expansion on hover */
        color: var(--cmd-blue);
    }

    .brand-net {
        color: var(--cmd-blue);
        text-shadow: 0 0 8px rgba(59, 130, 246, 0.3); /* Soft blue glow */
    }

        :root { 
            --cmd-black: #0f172a; 
            --cmd-slate: #1e293b;
            --cmd-blue: #3b82f6; 
            --fb-gray: #f8fafc;
            --border-color: #e2e8f0; 
        }
        
        body { 
            background-color: var(--fb-gray) !important; 
            color: var(--cmd-black); 
            font-family: 'Inter', -apple-system, sans-serif; 
            padding-top: 70px; /* Space for Top Nav */
            padding-bottom: 70px; 
        }

        /* COMMAND NAVBAR (TOP) */
        .navbar-top { 
            background: rgba(255, 255, 255, 0.95) !important; 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); 
            height: 65px; 
            z-index: 1050; 
        }

        .nav-brand-tactical {
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--cmd-black);
            text-transform: uppercase;
        }

        /* TACTICAL NAVIGATION CHIPS */
        .nav-chip {
            color: #64748b;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 1.2rem;
            text-decoration: none;
        }
        .nav-chip:hover {
            background: #f1f5f9;
            color: var(--cmd-blue);
        }
        .nav-chip.active {
            background: #eff6ff;
            color: var(--cmd-blue);
        }

        /* MOBILE BOTTOM NAV - REDESIGNED */
        .mobile-bottom-nav { 
            background: #fff; 
            border-top: 1px solid var(--border-color); 
            height: 65px; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            z-index: 2000; 
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* POST CARDS */
        .post-card { 
            background: #fff; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            transition: transform 0.2s ease;
        }
        
        /* THE "WHAT'S ON YOUR MIND" TRIGGER BOX */
        .mind-trigger {
            background: #f1f5f9;
            border-radius: 100px;
            padding: 12px 20px;
            color: #64748b;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            width: 100%;
            text-align: left;
        }
        .mind-trigger:hover { background: #e2e8f0; }

        @media (min-width: 768px) { .mobile-bottom-nav { display: none; } }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    <nav class="navbar navbar-top fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand nav-brand-tactical" href="{% url 'home' %}">
                PWANI<span class="brand-net">NET</span>
            </a>
            
            <div class="d-none d-md-flex gap-2">
                <a href="{% url 'home' %}" class="nav-chip {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="bi bi-house-door-fill"></i>
                </a>
                <a href="{% url 'groups_dashboard' %}" class="nav-chip {% if request.resolver_match.url_name == 'groups_dashboard' %}active{% endif %}">
                    <i class="bi bi-shield-shaded"></i>
                </a>
                <a href="{% url 'notifications' %}" class="nav-chip">
                    <i class="bi bi-bell-fill"></i>
                </a>
            </div>

            <div class="d-flex align-items-center gap-3">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'profile' request.user.username %}" class="text-dark">
                        <img src="{{ request.user.profile_pic.url }}" class="rounded-circle border" style="width: 35px; height: 35px; object-fit: cover;">
                    </a>
                    

                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-primary btn-sm rounded-pill px-3">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-4 shadow-sm border-0 mb-4" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    <div class="mobile-bottom-nav d-md-none border-top">
    <a href="{% url 'home' %}" class="nav-chip"><i class="bi bi-house-door-fill"></i></a>
    <a href="{% url 'groups_dashboard' %}" class="nav-chip"><i class="bi bi-people-fill"></i></a>
    
    {% if user.is_authenticated %}
        <a href="{% url 'create_post' %}" class="nav-chip"><i class="bi bi-plus-circle-fill"></i></a>
        <a href="{% url 'notifications' %}" class="nav-chip"><i class="bi bi-bell-fill"></i></a>
        <a href="{% url 'profile' request.user.username %}" class="nav-chip"><i class="bi bi-person-circle"></i></a>
    {% else %}
        <a href="{% url 'login' %}" class="nav-chip"><i class="bi bi-box-arrow-in-right"></i></a>
    {% endif %}
    </div>

    <div class="modal fade" id="likersModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg rounded-4" id="modal-content-target"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
