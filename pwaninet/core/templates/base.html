<!DOCTYPE html>
<html>
<head>
    <title>PwaniNet.</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>{# This the HTMX link we talked about earlier in the forms so read on it. #}
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Feed</a> | 
        <a href="{% url 'create_post' %}">Create Post</a> | 
        {% if user.is_authenticated %}
            <span>
               <em> Student:</em> <strong>{{ user.first_name }} {{ user.second_name }}</strong> | 
                <em>Course:</em> <strong>{{ user.course.name }}</strong>
            </span>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
    <hr>
    
    {% block content %}
    {% endblock %}
</body>
</html>
