{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 75vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden;">
                <div class="row g-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-dark">Logged Out Successfully</h2>
                            <p class="text-muted">You have been disconnected from your account.</p>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <a href="{% url 'login' %}" class="btn btn-dark btn-lg shadow-sm text-decoration-none" style="border-radius: 10px;">
                                Back to Login
                            </a>
                        </div>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0 text-muted">Want to explore?</p>
                            <a href="{% url 'home' %}" class="fw-bold text-primary text-decoration-none">View Public Feed</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="/" class="text-secondary small text-decoration-none">← Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
