{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-6 col-lg-4 text-center">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <span style="font-size: 4rem;">🔒</span>
                    </div>
                    <h2 class="fw-bold mb-3">Logged Out</h2>
                    <p class="text-muted mb-4">
                        You have successfully disconnected from the PwaniNet sector. Your session is now secure.
                    </p>
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg shadow-sm">
                            Return to Base (Login)
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                            View Public Feed
                        </a>
                    </div>
                </div>
            </div>
            
            <p class="mt-4 text-secondary small">
                © 2026 PwaniNet. | Secure Student Network
            </p>
        </div>
    </div>
</div>
{% endblock %}
