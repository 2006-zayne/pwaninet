<style>
  [data-theme="dark"] .list-group-item {
    background-color: var(--card-bg) !important;
    border-color: var(--border) !important;
    color: var(--text-primary) !important;
  }
  [data-theme="dark] .list-group-item:hover {
    background-color: var(--border-hover) !important;
  }
  [data-theme="dark"] .text-muted {
    color: var(--text-secondary) !important;
  }
</style>
{% for user in users %}
<div class="list-group-item d-flex align-items-center gap-3" style="border: none; color: var(--text-primary);">
  <img src="{{ user.profile_pic.url }}" class="rounded-circle" style="width: 48px; height: 48px; object-fit: cover;">
  <div style="flex: 1;">
    <div class="fw-bold">{{ user.username }}</div>
    <small class="text-muted">@{{ user.username }}</small>
  </div>
  <button class="btn btn-sm btn-primary start-conversation" data-user-id="{{ user.id }}">
    <i class="bi bi-chat-dots"></i> Message
  </button>
</div>
{% empty %}
<div class="list-group-item" style="border: none; color: var(--text-secondary); text-align: center; padding: 1rem;">
  <i class="bi bi-search" style="font-size: 1.5rem; margin-bottom: 0.5rem; display: block;"></i>
  No users found
</div>
{% endfor %}
