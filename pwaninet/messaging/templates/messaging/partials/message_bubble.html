<div class="message-bubble {% if message.sender == request.user %}sent{% else %}received{% endif %} {% if first_in_group %}first-in-group{% else %}consecutive-message{% endif %}
  {% if message.sender == request.user and forloop.last %}last-sent{% endif %}"
  data-message-id="{{ message.id }}"
  data-sender-id="{{ message.sender.id }}"
  data-read-status="{% if message.is_read %}read{% elif message.is_delivered %}delivered{% else %}sent{% endif %}">
  <p class="message-content">{{ message.content }}</p>
  <div class="message-time">
    {{ message.created_at|date:"H:i" }}
  </div>
  {% if message.sender == request.user and forloop.last %}
  <div class="read-receipt-indicator" data-status="sent">
    <div class="read-receipt-circle">
      <span class="read-receipt-icon">&#10003;</span>
    </div>
  </div>
  {% endif %}
</div>
