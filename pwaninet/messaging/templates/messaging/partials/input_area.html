<div class="input-area">
  <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.mp4,.mp3,.wav" style="display: none;">
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
  <div class="voice-btn-container">
    <button class="icon-btn" id="voiceBtn" title="Voice message">
      <i class="bi bi-mic"></i>
    </button>
  </div>
  <div class="input-field-container">
    <button class="icon-btn" id="emojiBtn" title="Emoji">
      <i class="bi bi-emoji-smile"></i>
    </button>
    <textarea class="message-input" placeholder="Message..." id="messageInput" rows="1"></textarea>
    <button class="icon-btn" id="attachBtn" title="Attach file">
      <i class="bi bi-paperclip"></i>
    </button>
    <button class="icon-btn" id="cameraBtn" title="Camera">
      <i class="bi bi-camera"></i>
    </button>
  </div>
  <button class="send-btn" id="sendBtn" title="Send">
    <i class="bi bi-send-fill"></i>
  </button>
</div>
