<div class="suggestions-grid">
  {% for user in suggested_users %}
    <div class="suggestion-card">
      <div class="suggestion-card-header">
        <a href="{% url 'users:profile' user.username %}" class="suggestion-avatar-link">
          <img src="{{ user.profile_pic.url }}" class="suggestion-avatar" alt="{{ user.username }}">
        </a>
        <div class="suggestion-info">
          <a href="{% url 'users:profile' user.username %}" class="suggestion-name-link">
            <h3 class="suggestion-name">{{ user.username }}</h3>
          </a>
          <p class="suggestion-username">@{{ user.username }}</p>
        </div>
      </div>
      <div class="suggestion-card-body">
        <p class="small text-muted mb-0" style="font-size: 0.8rem;">
          <i class="bi bi-person-plus me-1"></i>
          Suggested for you
        </p>
      </div>
      <div class="suggestion-card-footer">
        {% if user.id in following_ids %}
          <button class="btn btn-sm btn-primary start-conversation" data-user-id="{{ user.id }}">
            <i class="bi bi-chat-dots me-1"></i> Message
          </button>
        {% else %}
          <button class="btn btn-sm btn-outline-primary btn-follow" data-user-id="{{ user.id }}">
            <i class="bi bi-person-plus me-1"></i> Follow
          </button>
        {% endif %}
      </div>
    </div>
  {% empty %}
    <div class="empty-state">
      <div class="empty-icon"><i class="bi bi-person-plus"></i></div>
      <div class="empty-title">No suggestions yet</div>
      <p class="empty-sub">Check back later for new friend suggestions.</p>
    </div>
  {% endfor %}
</div>
