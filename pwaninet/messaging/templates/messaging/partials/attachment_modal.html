<!-- Attachment Options Modal -->
<div class="attachment-modal" id="attachmentModal">
  <div class="attachment-modal-header">
    <span class="attachment-modal-title">Attach</span>
    <button class="attachment-close-btn" id="closeAttachmentModal">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div class="attachment-options">
    <div class="attachment-option" data-type="photos">
      <div class="attachment-option-icon photos">
        <i class="bi bi-image"></i>
      </div>
      <span class="attachment-option-label">Photos</span>
    </div>
    <div class="attachment-option" data-type="videos">
      <div class="attachment-option-icon videos">
        <i class="bi bi-camera-video"></i>
      </div>
      <span class="attachment-option-label">Videos</span>
    </div>
    <div class="attachment-option" data-type="documents">
      <div class="attachment-option-icon documents">
        <i class="bi bi-file-earmark"></i>
      </div>
      <span class="attachment-option-label">Documents</span>
    </div>
    <div class="attachment-option" data-type="audio">
      <div class="attachment-option-icon audio">
        <i class="bi bi-music-note"></i>
      </div>
      <span class="attachment-option-label">Audio</span>
    </div>
  </div>
</div>
