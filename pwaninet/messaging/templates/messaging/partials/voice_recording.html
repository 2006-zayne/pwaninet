<!-- Voice Recording Preview -->
<div class="voice-recording-preview" id="voiceRecordingPreview">
  <div class="voice-recording-waveform-container" id="voiceWaveformContainer">
    <!-- Waveform bars will be generated dynamically -->
  </div>
  <div class="voice-recording-timer" id="voiceTimer">0:00</div>
  <div class="voice-recording-actions">
    <button class="voice-recording-btn send" id="voiceSend" title="Send">
      <i class="bi bi-send-fill"></i>
    </button>
    <button class="voice-recording-btn play-pause" id="voicePlayPause" title="Play/Pause">
      <i class="bi bi-play-fill"></i>
    </button>
    <button class="voice-recording-btn discard" id="voiceDelete" title="Discard">
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>
