<!-- Emoji Picker Modal -->
<div class="overlay" id="overlay"></div>
<div class="emoji-picker-modal" id="emojiPicker">
  <div class="emoji-picker-header">
    <span class="emoji-picker-title">Emoji</span>
    <div class="emoji-picker-actions">
      <button class="icon-btn" id="keyboardBtn" title="Keyboard">
        <i class="bi bi-keyboard"></i>
      </button>
      <button class="icon-btn" id="closeEmojiPicker">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
  <div class="emoji-picker-tabs">
    <button class="emoji-picker-tab active" data-tab="emojis">😀</button>
    <button class="emoji-picker-tab" data-tab="gifs">GIF</button>
    <button class="emoji-picker-tab" data-tab="stickers">Stickers</button>
  </div>
  <div class="emoji-picker-content" id="emojiContent">
    <!-- Emojis will be loaded here -->
  </div>
  <div class="gif-search-container" id="gifSearchContainer" style="display: none;">
    <input type="text" class="gif-search-input" id="gifSearchInput" placeholder="Search GIFs...">
  </div>
  <div class="gif-content" id="gifContent" style="display: none;">
    <!-- GIFs will be loaded here -->
  </div>
  <div class="sticker-content" id="stickerContent" style="display: none;">
    <!-- Stickers will be loaded here -->
  </div>
</div>
