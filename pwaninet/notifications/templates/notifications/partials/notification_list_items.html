<style>
  [data-theme="dark"] .bg-white {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .bg-light {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .text-dark {
    color: #ffffff !important;
  }
  [data-theme="dark"] .text-muted {
    color: #d1d5db !important;
  }
  [data-theme="dark"] .card {
    background-color: var(--card-bg) !important;
    border-color: var(--border) !important;
  }
  [data-theme="dark"] a {
    color: #818cf8 !important;
  }
  [data-theme="dark"] .border {
    border-color: var(--border) !important;
  }
  [data-theme="dark"] .border-bottom {
    border-color: var(--border) !important;
  }
</style>
{% for n in notifications %}
    <div class="list-group-item list-group-item-action border-bottom p-3 transition-all {% if not n.is_read %}border-start border-4 border-primary bg-aliceblue{% endif %}" 
         id="notification-{{ n.id }}">
        
        <div class="d-flex align-items-start gap-3">
            <img src="{{ n.sender.profile_pic.url }}" class="rounded-circle border" style="width: 45px; height: 45px; object-fit: cover;">
            
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-center">
                    <h6 class="mb-1 fw-bold text-dark">
                        {{ n.sender.username }}
                        </h6>
                    
                    <div class="d-flex align-items-center gap-2">
                        <small class="text-muted"><i class="bi bi-clock-history"></i> {{ n.timestamp|timesince }}</small>
                        
                        {% if not n.is_read %}
                            <button class="btn btn-sm btn-outline-success border-0 rounded-circle p-1"
                                    title="Mark as read"
                                    hx-post="{% url 'notifications:mark_notification_as_read' n.id %}"
                                    hx-target="#notification-{{ n.id }}"
                                    hx-swap="outerHTML">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        {% endif %}
                    </div>
                </div>
                
                <p class="mb-0 text-secondary" style="font-size: 0.95rem;">
                    {{ n.msg }}
                    {% if n.post %}
                        <a href="{% url 'posts:post_details' n.post.id %}" class="text-primary text-decoration-none fw-bold">"{{ n.post.content|truncatechars:30 }}"</a>
                        <a href="{% url 'groups:groups_detail' group.id %}" class="text-primary text-decoration-none fw-bold">"{{ group.name }}"</a>
                    {% endif %}
                </p>
                </div>
        </div>
    </div>
{% empty %}
    {% endfor %}
