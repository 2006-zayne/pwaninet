<div class="modal fade comments-modal" id="commentsModal" tabindex="-1" aria-hidden="true" role="dialog" aria-labelledby="commentsModalTitle" data-bs-backdrop="true" data-bs-keyboard="true">
  <style>
    [data-theme="dark"] .comments-modal .modal-content {
      background-color: var(--card-bg) !important;
      border-color: var(--border) !important;
    }
    [data-theme="dark"] .comments-modal .modal-title {
      color: #ffffff !important;
    }
    [data-theme="dark"] .comments-modal .comment-text {
      color: #e4e6eb !important;
    }
    [data-theme="dark"] .comments-modal .comment-meta {
      color: #b0b3b8 !important;
    }
  </style>
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
      <!-- Sticky Header -->
      <div class="modal-header comments-modal-header border-0 pb-0 sticky-top" style="position: relative;">
        <div class="comments-modal-handle d-md-none" aria-hidden="true"></div>

        <button type="button" class="btn-close comments-modal-close" data-bs-dismiss="modal" aria-label="Close" style="position: absolute; right: 12px; top: 8px; z-index: 10; font-size: 1.25rem; opacity: 1; background-image: none;">✕</button>
      </div>

      <!-- Scrollable Content -->
      <div class="modal-body comments-modal-body pt-2" id="commentsModalBody">
        <div class="comment-stream" id="commentsModalList">
          <!-- Comments will be loaded here -->
          <div id="commentsEmptyState" class="comments-empty" style="display: none;">
            <i class="bi bi-chat-dots"></i>
            <p>No comments yet. Be the first to comment.</p>
          </div>
        </div>
      </div>

      <!-- View All Comments Link -->
      <div class="modal-footer comments-modal-footer border-0" id="commentsModalFooter" style="display: none;">
        <a href="#" class="view-all-comments-link w-100 text-center py-2" style="color: var(--primary); text-decoration: none; font-weight: 600;">
          View all <span id="totalCommentsCount">0</span> comments
        </a>
      </div>

      <!-- Comment Input at Bottom -->
      <div class="modal-footer comments-modal-input-footer border-0 pt-0 pb-3">
        <form id="commentForm" class="d-flex align-items-center gap-2 w-100">

               class="comment-input-avatar rounded-circle"

                   class="form-control comment-input-field"
                   placeholder="Add comment..."
                   aria-label="Add a comment"
                   style="border-radius: 20px; padding: 10px 45px 10px 15px;">
            <button type="submit" 
                    class="comment-send-btn position-absolute"
                    style="right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--primary); padding: 4px 8px;">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .comments-modal .modal-content {
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  
  .comments-modal .btn-close {
    position: absolute !important;
    right: 12px !important;
    top: 8px !important;
    z-index: 10 !important;
    font-size: 1.25rem !important;
    opacity: 1 !important;
    background: rgba(0, 0, 0, 0.1) !important;
    border-radius: 50% !important;
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
  }
  
  .comments-modal .btn-close:hover {
    background: rgba(0, 0, 0, 0.2) !important;
  }
  
  /* Mobile Sheet Handle */
  .comments-modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 2px;
    margin: 0 auto 0.75rem;
    cursor: grab;
  }

  [data-theme="dark"] .comments-modal-handle {
    background: rgba(255, 255, 255, 0.2);
  }

  /* Modal Body - Scrollable */
  .comments-modal-body {
    padding: 0;
    overflow-y: auto;
    max-height: calc(90vh - 140px);
    -webkit-overflow-scrolling: touch;
  }

  .comments-modal-body::-webkit-scrollbar {
    width: 6px;
  }

  .comments-modal-body::-webkit-scrollbar-track {
    background: transparent;
  }

  .comments-modal-body::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 3px;
  }

  .comments-modal-body::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.3);
  }

  [data-theme="dark"] .comments-modal-body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
  }

  [data-theme="dark"] .comments-modal-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  /* Comment Row */
  .comment-row {
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    margin: 0.25rem 1rem;
    transition: all 0.2s ease;
  }

  .comment-row:hover {
    background: rgba(0, 0, 0, 0.03);
  }

  [data-theme="dark"] .comment-row:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  /* Comment Text */
  .comment-text {
    font-size: 0.9rem;
    line-height: 1.4;
    color: #0f172a;
  }

  /* Comment Meta */
  .comment-meta {
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 0.25rem;
  }

  /* Mobile Sheet Behavior */
  @media (max-width: 576px) {
    .comments-modal .modal-dialog {
      margin: 0;
      max-height: 100vh;
    }

    .comments-modal .modal-content {
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      margin-top: auto;
    }

    .comments-modal-handle {
      display: block;
    }

    .comment-row {
      padding: 0.75rem 1rem;
      margin: 0.25rem 0.5rem;
    }
  }

  /* Animations */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .comment-row {
    animation: fadeIn 0.3s ease forwards;
  }

  .comment-row:nth-child(1) { animation-delay: 0.05s; }
  .comment-row:nth-child(2) { animation-delay: 0.1s; }
  .comment-row:nth-child(3) { animation-delay: 0.15s; }

  /* Comment Input Styles */
  .comment-input-field {
    background: var(--card-bg, #f8f9fa);
    border: 1px solid var(--border, #e2e8f0);
    color: var(--text-color, #1a202c);
    font-size: 0.9rem;
  }

  .comment-input-field:focus {
    background: var(--card-bg, #ffffff);
    border-color: var(--primary, #3b82f6);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    outline: none;
  }

  .comment-input-field::placeholder {
    color: var(--text-muted, #64748b);
  }

  [data-theme="dark"] .comment-input-field {
    background: var(--card-bg, #1f2937);
    border-color: var(--border, #374151);
    color: var(--text-color, #f3f4f6);
  }

  [data-theme="dark"] .comment-input-field:focus {
    background: var(--card-bg, #1f2937);
    border-color: var(--primary, #3b82f6);
  }

  .comment-send-btn {
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .comment-send-btn:hover {
    transform: translateY(-50%) scale(1.1);
  }

  .comment-send-btn:active {
    transform: translateY(-50%) scale(0.95);
  }

  .comment-input-avatar {
    border: 2px solid var(--border, #e2e8f0);
  }

  [data-theme="dark"] .comment-input-avatar {
    border-color: var(--border, #374151);
  }

  /* Comment Stream Styles - Match post comment section */
  .comment-stream {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 16px;
  }

  .comment-item {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease forwards;
    padding: 8px 0;
  }

  .comment-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: none;
    background: var(--border, #e2e8f0);
  }

  .comment-content {
    flex: 1;
    min-width: 0;
  }

  .comment-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }

  .comment-author-link {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-color, #1a202c);
    text-decoration: none;
  }

  .comment-author-link:hover {
    text-decoration: underline;
  }

  .comment-timestamp {
    font-size: 0.75rem;
    color: var(--text-muted, #64748b);
  }

  .comment-body {
    font-size: 0.9rem;
    color: var(--text-color, #1a202c);
    line-height: 1.4;
    word-wrap: break-word;
  }

  .comment-actions {
    display: flex;
    gap: 12px;
    margin-top: 6px;
  }

  .comment-action {
    background: none;
    border: none;
    color: var(--text-muted, #64748b);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
    transition: color 0.2s ease;
  }

  .comment-action:hover {
    color: var(--primary, #3b82f6);
  }

  .comment-action.liked {
    color: #ef4444;
  }

  .comment-action i {
    font-size: 1rem;
  }

  .comments-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted, #64748b);
  }

  .comments-empty i {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
  }

  .comments-empty p {
    margin: 0;
    font-size: 0.95rem;
  }

  [data-theme="dark"] .comment-author-link {
    color: var(--text-color, #f3f4f6);
  }

  [data-theme="dark"] .comment-body {
    color: var(--text-color, #f3f4f6);
  }

  [data-theme="dark"] .comment-action {
    color: var(--text-muted, #9ca3af);
  }

  [data-theme="dark"] .comment-action:hover {
    color: var(--primary, #3b82f6);
  }
</style>
