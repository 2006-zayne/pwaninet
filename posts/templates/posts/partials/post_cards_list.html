{% for post in posts %}
    {% include 'posts/partials/post_card.html' %}
{% endfor %}

{% if has_more_posts %}
<div id="load-more-trigger" class="text-center py-4" hx-get="{% url 'users:profile' profile_user.username %}?page={{ posts.next_page_number }}" hx-trigger="revealed" hx-target="#posts-container" hx-swap="beforeend" hx-on::before-request="this.remove()">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
{% endif %}
