{% load static %}
{% load i18n %}

<style>
  /* Post Detail Specific Layout & Sticky Composer Rules */
  @media (max-width: 767px) {
    body:has(.post-detail-container),
    body.post-detail-active {
      padding-bottom: 0 !important;
    }
  }
  .post-detail-container .dropdown-menu {
    z-index: 10010 !important;
  }
  .post-detail-container .post-card:has(.dropdown-menu.show) {
    overflow: visible !important;
    z-index: 10010 !important;
  }
  .post-detail-container .comment-item:has(.comment-menu-dropdown),
  .post-detail-container .comment-item.menu-open {
    z-index: 10010 !important;
    position: relative;
  }
  .post-detail-container .comment-menu-dropdown {
    z-index: 10010 !important;
  }
  /* Hide sticky composer when any modal is open so it cannot overlap */
  body.modal-open .fixed-bottom,
  body.modal-open .post-detail-composer-bar,
  body.modal-open .main-composer {
    display: none !important;
    pointer-events: none !important;
  }
</style>

<div class="post-detail-container" data-post-id="{{ post.share_id }}">
  <div class="container mt-3" style="padding-bottom: 80px;">
    <!-- Back Button Row -->
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <a href="{% if is_new_post or 'service-worker' in previous_page or '.js' in previous_page %}{% url 'posts:home' %}{% else %}{{ previous_page }}{% endif %}"
               hx-get="{% if is_new_post or 'service-worker' in previous_page or '.js' in previous_page %}{% url 'posts:home' %}{% else %}{{ previous_page }}{% endif %}"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="btn btn-sm btn-outline-secondary rounded-pill fw-bold text-uppercase mb-3 px-3"
               onclick="if (document.referrer && document.referrer.startsWith(window.location.origin) && window.history.length > 1) { window.history.back(); return false; }">
                <i class="bi bi-arrow-left me-1"></i> {% trans "Back" %}
            </a>
        </div>
    </div>

    <!-- Main Post & Comments Row -->
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <!-- Unified Post Card -->
            {% include 'posts/partials/post_card.html' with post=post is_detail=True %}

            <!-- Comments Section -->
            {% include 'posts/partials/comments_section.html' %}
        </div>
    </div>
  </div>

  <!-- Sticky Comment Input at Bottom -->
  {% if request.user.is_authenticated %}
  <div class="fixed-bottom post-detail-composer-bar" style="z-index: 1000; background-color: transparent; border-top: none;">
    <div class="container py-3" style="background-color: transparent;">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <form hx-post="{% url 'posts:add_comment' post.share_id %}"
                      hx-target="#comments-section"
                      hx-swap="outerHTML"
                      class="main-composer"
                      hx-on::after-request="if(event.detail.successful) this.reset();">
                    {% csrf_token %}
                    <img src="{{ request.user.profile_pic.url|default:'/static/images/default-avatar.png' }}" 
                         alt="{{ request.user.username }}" 
                         class="main-composer-avatar">
                    <div class="main-composer-input-wrapper">
                        <input type="text" 
                               name="content" 
                               class="main-composer-input" 
                               placeholder="{% trans 'Add comment...' %}" 
                               aria-label="{% trans 'Add a comment' %}"
                               required>
                        <button type="submit" 
                                class="main-composer-send" 
                                aria-label="{% trans 'Send comment' %}">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
  </div>
  {% endif %}
</div>
