{% load i18n %}
<div class="landscape-video-wrapper position-relative">
    <button class="media-download-btn"
            data-post-id="{{ post.share_id }}"
            data-media-type="video"
            data-url="{{ post.get_video_for_feed.url }}"
            data-thumbnail="{{ post.get_video_poster|default:post.thumbnail_url|default:'' }}"
            title="{% trans 'Download' %}">
        <i class="bi bi-download"></i>
    </button>
    <button type="button"
            class="reel-stage-overlay-btn reel-expand-btn text-white position-absolute top-0 end-0 m-2"
            data-action="fullscreen"
            data-post-id="{{ post.share_id }}"
            title="{% trans 'Watch Fullscreen' %}"
            aria-label="{% trans 'Expand to fullscreen' %}"
            style="z-index: 4; width: 34px; height: 34px; font-size: 13px;">
        <i class="bi bi-arrows-fullscreen"></i>
    </button>
    <div class="landscape-video-container bg-black position-relative"
         data-media-type="video"
         data-post-id="{{ post.share_id }}"
         style="width: 100%; aspect-ratio: {% if post.video_width and post.video_height and post.video_height <= post.video_width %}{{ post.video_width }} / {{ post.video_height }}{% else %}16 / 9{% endif %}; max-height: 520px; overflow: hidden; background: #000000; display: flex; align-items: center; justify-content: center;">
        <video id="video-{{ post.share_id }}"
               preload="metadata"
               class="w-100 h-100 {% if not disable_autoplay and not in_search %}feed-video{% endif %}"
               style="width: 100%; height: 100%; object-fit: contain; background-color: #000000;"
               muted loop playsinline controls
               data-post-id="{{ post.share_id }}"
               data-autoplay="false"
               poster="{{ post.get_video_poster|default:'' }}"
               {% if post.hls_playlist %}
               data-hls-url="{{ post.get_hls_url }}"
               {% endif %}
               data-video-url="{{ post.get_video_for_feed.url }}">
            <source src="{{ post.get_video_for_feed.url }}" type="video/mp4">
        </video>
        {% if post.video and post.video_status != 'ready' %}
        <div class="position-absolute bottom-0 start-0 m-2" style="z-index: 3;">
            <span class="badge bg-dark bg-opacity-75 text-white small">
                {% if post.video_status == 'transcoding' %}
                <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>{% trans "HD processing…" %}
                {% elif post.video_status == 'failed' %}
                <i class="bi bi-exclamation-triangle me-1"></i>{% trans "Processing failed" %}
                {% else %}
                <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>{% trans "Preparing…" %}
                {% endif %}
            </span>
        </div>
        {% endif %}
    </div>
</div>
