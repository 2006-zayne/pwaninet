{% spaceless %}
{% load post_filters %}
{% with tc=text_color|default:"#ffffff" c1=color1|default:"#141E30" c2=color2|default:"#243B55" pattern_id="textPattern_"|add:author_name %}
<svg class="post-pattern-svg" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="{{ pattern_id }}" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <g fill="{{ tc|hex_to_rgba:"0.06" }}" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="2">
        <text x="20" y="50" transform="rotate(-15 20 50)" font-size="32">{{ author_name }}</text>
        <text x="160" y="90" transform="rotate(25 160 90)" font-size="24">{{ author_name }}</text>
        <text x="50" y="200" transform="rotate(45 50 200)" font-size="40">{{ author_name }}</text>
        <text x="220" y="240" transform="rotate(-25 220 240)" font-size="28">{{ author_name }}</text>
        <text x="120" y="280" transform="rotate(10 120 280)" font-size="20">{{ author_name }}</text>
        <text x="260" y="50" transform="rotate(-50 260 50)" font-size="26">{{ author_name }}</text>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#{{ pattern_id }})" />
</svg>
{% endwith %}
{% endspaceless %}
