<style>
  [data-theme="dark"] .text-dark {
    color: #ffffff !important;
  }
  [data-theme="dark"] .text-muted {
    color: #d1d5db !important;
  }
</style>
<div class="d-flex gap-2 p-3 border-bottom" id="comment-{{ comment.id }}">
    <a href="{% url 'users:profile' comment.author.username %}">
        <img src="{{ comment.author.profile_pic.url }}" class="rounded-circle border flex-shrink-0" style="width: 34px; height: 34px; object-fit: cover;">
    </a>
    <div>
        <a href="{% url 'users:profile' comment.author.username %}" class="fw-bold small text-dark text-decoration-none">
            {{ comment.author.get_full_name|default:comment.author.username }}
        </a>
        <p class="mb-0 small comment-text" style="font-size: 14px; line-height: 1.5;" data-full-text="{{ comment.content }}" data-truncated-length="100">{{ comment.content }}</p>
            <button class="btn btn-sm border-0 p-0 {% if comment.id in liked_comment_ids %}text-danger{% else %}text-muted{% endif %}"
                    hx-post="{% url 'posts:toggle_comment_like' comment.id %}"
                    hx-target="#comment-{{ comment.id }}"
                    hx-swap="outerHTML"
                    style="font-size: 12px;">
                <i class="bi {% if comment.id in liked_comment_ids %}bi-heart-fill{% else %}bi-heart{% endif %}"></i>
                <span class="ms-1">{{ comment.likes.count }}</span>
            </button>
        </div>
    </div>
</div>
