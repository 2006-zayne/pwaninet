{% load static %}

<!-- Post Skeleton Loader - Updated to match real home.html structure -->
<div class="post-card shadow-sm mb-2 bg-white rounded-3 overflow-hidden border-0 skeleton-post">
    <div class="d-flex align-items-center p-3 border-bottom">
        <div class="skeleton-post-avatar"></div>
        <div class="flex-grow-1 ms-3">
            <div class="skeleton-post-username"></div>
            <div class="skeleton-post-time"></div>
        </div>
        <div class="skeleton-post-menu"></div>
    </div>
    <div class="px-3 pb-3">
        <div class="skeleton-post-text"></div>
        <div class="skeleton-post-text"></div>
        <div class="skeleton-post-text short"></div>
    </div>
    <div class="skeleton-post-media"></div>
    <div class="d-flex align-items-center justify-content-between px-3 py-2 border-top">
        <div class="d-flex align-items-center gap-4">
            <div class="skeleton-action"></div>
            <div class="skeleton-action"></div>
            <div class="skeleton-action"></div>
            <div class="skeleton-action"></div>
        </div>
    </div>
    <div class="px-3 pb-3 pt-1 border-top bg-white">
        <div class="d-flex align-items-center gap-2">
            <div class="skeleton-comment-avatar"></div>
            <div class="flex-grow-1">
                <div class="skeleton-comment-input"></div>
            </div>
        </div>
    </div>
</div>

<style>
/* Post Skeleton Loader Styles - Using skeleton-loader.js classes */
.skeleton-post-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--border, #e2e8f0);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}

.skeleton-post-username {
    width: 120px;
    height: 16px;
    background: var(--border, #e2e8f0);
    border-radius: 4px;
    margin-bottom: 6px;
    position: relative;
    overflow: hidden;
}

.skeleton-post-time {
    width: 80px;
    height: 12px;
    background: var(--border, #e2e8f0);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
}

.skeleton-post-menu {
    width: 32px;
    height: 32px;
    background: var(--border, #e2e8f0);
    border-radius: 4px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}

.skeleton-post-text {
    width: 100%;
    height: 16px;
    background: var(--border, #e2e8f0);
    border-radius: 4px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
}

.skeleton-post-text.short {
    width: 60%;
}

.skeleton-post-media {
    width: 100%;
    height: 300px;
    background: var(--border, #e2e8f0);
    border-radius: 8px;
    border-top: 1px solid var(--border, #e2e8f0);
    border-bottom: 1px solid var(--border, #e2e8f0);
    position: relative;
    overflow: hidden;
}

.skeleton-action {
    width: 60px;
    height: 20px;
    background: var(--border, #e2e8f0);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
}

.skeleton-comment-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--border, #e2e8f0);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}

.skeleton-comment-input {
    width: 100%;
    height: 42px;
    background: var(--border, #e2e8f0);
    border-radius: 21px;
    position: relative;
    overflow: hidden;
}

/* Shimmer Animation */
.skeleton-post-avatar::after,
.skeleton-post-username::after,
.skeleton-post-time::after,
.skeleton-post-menu::after,
.skeleton-post-text::after,
.skeleton-post-media::after,
.skeleton-action::after,
.skeleton-comment-avatar::after,
.skeleton-comment-input::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
    );
    animation: shimmer 1.5s infinite;
}

[data-theme="dark"] .skeleton-post-avatar::after,
[data-theme="dark"] .skeleton-post-username::after,
[data-theme="dark"] .skeleton-post-time::after,
[data-theme="dark"] .skeleton-post-menu::after,
[data-theme="dark"] .skeleton-post-text::after,
[data-theme="dark"] .skeleton-post-media::after,
[data-theme="dark"] .skeleton-action::after,
[data-theme="dark"] .skeleton-comment-avatar::after,
[data-theme="dark"] .skeleton-comment-input::after {
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 100%
    );
}

@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* Dark theme support */
[data-theme="dark"] .skeleton-post-avatar,
[data-theme="dark"] .skeleton-post-menu,
[data-theme="dark"] .skeleton-comment-avatar {
    background: var(--border, #374151);
}

[data-theme="dark"] .skeleton-post-username,
[data-theme="dark"] .skeleton-post-time,
[data-theme="dark"] .skeleton-post-text,
[data-theme="dark"] .skeleton-action {
    background: var(--border, #374151);
}

[data-theme="dark"] .skeleton-post-media {
    background: var(--border, #374151);
    border-color: var(--border, #374151);
}

[data-theme="dark"] .skeleton-comment-input {
    background: var(--border, #374151);
}

/* Mobile responsiveness */
@media (max-width: 767px) {
    .skeleton-post-media {
        height: 250px;
    }
    
    .skeleton-post-username {
        width: 100px;
    }
    
    .skeleton-post-time {
        width: 60px;
    }
    
    .skeleton-action {
        width: 50px;
        height: 18px;
    }
}

/* Fade-in animation for skeleton cards */
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.skeleton-post {
    animation: fadeIn 0.3s ease forwards;
}

/* Multiple skeleton cards with staggered animation */
.skeleton-post:nth-child(1) { animation-delay: 0.1s; }
.skeleton-post:nth-child(2) { animation-delay: 0.2s; }
.skeleton-post:nth-child(3) { animation-delay: 0.3s; }
</style>
