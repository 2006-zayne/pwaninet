{% for post in posts %}
    {% include 'posts/partials/post_card.html' %}

{% empty %}
    {% if not cursor %}
        <div class="text-center py-5">
            <i class="bi bi-broadcast text-muted fs-1"></i>
            <p class="text-muted mt-2">No posts yet. Be the first one to post.</p>
            <a href="{% url 'posts:create_post' %}"
               hx-get="{% url 'posts:create_post' %}"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="btn btn-primary rounded-pill px-4">Create a post</a>
        </div>
    {% endif %}
{% endfor %}

{% if has_more %}
<div id="feed-load-trigger"
     hx-get="{% url 'posts:home' %}?cursor={{ next_cursor }}"
     hx-trigger="revealed"
     hx-swap="outerHTML"
     class="d-flex justify-content-center py-3">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading…</span>
  </div>
</div>
{% else %}
<div class="text-center py-3 text-muted small">You're all caught up 🎉</div>
{% endif %}
