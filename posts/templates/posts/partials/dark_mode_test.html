<!-- Dark Mode Test Component - For Development Testing -->
<div class="dark-mode-test-container">
    <h6 class="text-muted small text-uppercase mb-3">Dark Mode Test Components</h6>
    
    <!-- Friend Suggestions Test -->

            <h6 class="fw-bold text-muted small text-uppercase mb-0">
                <i class="bi bi-person-plus-fill me-2 text-primary"></i>Friend Suggestions Test
            </h6>
        </div>
        <div class="friend-suggestions-container">
            <div class="d-flex gap-3 overflow-auto pb-2 friend-suggestions-scroll">
                <!-- Test Friend Card -->
                <div class="friend-suggestion-card" style="min-width: 160px;">
                    <div class="friend-card-image-container">
                        <div class="friend-card-image-placeholder">

                    </div>
                    <div class="friend-card-info">
                        <p class="friend-card-name mb-1">Test User</p>
                        <p class="friend-card-details mb-2">Computer Science • Year 3</p>
                        <div class="friend-card-actions">
                            <button class="btn btn-primary btn-sm friend-btn-primary w-100">

                            </button>

    </div>

    <!-- Skeleton Loaders Test -->
    <div class="mb-4">
        <h6 class="text-muted small text-uppercase mb-3">Skeleton Loaders Test</h6>
        
        <!-- Friend Skeleton -->
        <div class="friend-suggestions-skeleton mb-3">
            <div class="d-flex gap-3 overflow-auto pb-2">

                    <div class="friend-skeleton-image">

                    <div class="friend-skeleton-info">

        <!-- Post Skeleton -->
        <div class="post-skeleton-card shadow-sm mb-2 bg-white rounded-3 overflow-hidden border-0">
            <div class="d-flex align-items-center p-3 border-bottom">
                <div class="post-skeleton-avatar">
                    <div class="skeleton-shimmer"></div>
                </div>
                <div class="flex-grow-1 ms-3">

                    <div class="post-skeleton-timestamp">

            </div>
            <div class="px-3 pb-3">

                </div>
                <div class="post-skeleton-text short">
                    <div class="skeleton-shimmer"></div>
                </div>
            </div>

    </div>

    <!-- Interactive Elements Test -->
    <div class="mb-4">
        <h6 class="text-muted small text-uppercase mb-3">Interactive Elements Test</h6>
        <div class="post-card shadow-sm mb-2 bg-white rounded-3 overflow-hidden border-0">
            <div class="d-flex align-items-center p-3">
                <div class="post-skeleton-avatar me-3">
                    <div class="skeleton-shimmer"></div>
                </div>
                <div class="flex-grow-1">
                    <h6 class="mb-0 fw-bold small text-dark">Test Post</h6>
                    <small class="text-muted">2 hours ago</small>
                </div>
            </div>
            <div class="px-3 pb-3">
                <p class="mb-2 text-dark">Test content for dark mode verification</p>
            </div>
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-top">
                <div class="d-flex align-items-center gap-4">
                    <button class="btn btn-sm border-0 text-muted">
                        <i class="bi bi-heart fs-5"></i>
                        <span class="fw-bold">Like</span>
                    </button>
                    <button class="btn btn-sm border-0 text-muted">
                        <i class="bi bi-chat-dots fs-5"></i>
                        <span class="fw-bold">Comment</span>
                    </button>
                    <button class="btn btn-sm border-0 text-muted">
                        <i class="bi bi-share fs-5"></i>
                        <span class="fw-bold">Share</span>
                    </button>
                </div>
            </div>
            <div class="px-3 pb-3 pt-1 border-top bg-white">
                <div class="d-flex align-items-center gap-2">
                    <div class="post-skeleton-comment-avatar">
                        <div class="skeleton-shimmer"></div>
                    </div>
                    <div class="flex-grow-1">
                        <input type="text" class="form-control border-0 rounded-pill" placeholder="Write a comment...">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Test container styles */
.dark-mode-test-container {
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
}

/* Include all enhanced styles for testing */
@import url('./friend_skeleton_loader.html');
@import url('./post_skeleton_loader.html');

/* Test indicators */
.test-indicator {
    position: absolute;
    top: 5px;
    right: 5px;
    background: #ef4444;
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    z-index: 1000;
}

[data-theme="dark"] .test-indicator {
    background: #3b82f6;
}
</style>

<script>
// Dark mode test utilities
document.addEventListener('DOMContentLoaded', function() {
    // Add test indicators to components
    const components = document.querySelectorAll('.friend-suggestion-card, .post-skeleton-card, .post-card');
    components.forEach((component, index) => {
        const indicator = document.createElement('div');
        indicator.className = 'test-indicator';
        indicator.textContent = `TEST ${index + 1}`;
        component.style.position = 'relative';
        component.appendChild(indicator);
    });

    // Log theme changes
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                console.log('Theme changed to:', document.documentElement.getAttribute('data-theme'));
                testDarkModeElements();
            }
        });
    });

    observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
    });

    // Initial test
    testDarkModeElements();
});

function testDarkModeElements() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    console.log(`Testing ${isDark ? 'DARK' : 'LIGHT'} mode elements...`);
    
    // Test friend suggestions
    const friendCards = document.querySelectorAll('.friend-suggestion-card');
    friendCards.forEach(card => {
        const computedStyle = window.getComputedStyle(card);
        console.log('Friend card background:', computedStyle.backgroundColor);
    });
    
    // Test skeletons
    const skeletons = document.querySelectorAll('.skeleton-shimmer');
    skeletons.forEach(skeleton => {
        const computedStyle = window.getComputedStyle(skeleton);
        console.log('Skeleton shimmer background:', computedStyle.background);
    });
}
</script>
