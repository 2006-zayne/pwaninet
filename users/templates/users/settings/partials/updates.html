<style>
  .update-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .update-info-item {
    background: var(--brand-light);
    border-radius: var(--radius-md);
    padding: 1.25rem;
  }

  .update-info-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
  }

  .update-info-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .update-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem;
    background: var(--brand-light);
    border-radius: var(--radius-md);
    margin-bottom: 1.5rem;
  }

  .update-status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .update-status-text {
    font-weight: 600;
    color: var(--text-primary);
  }

  .btn-check-updates {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0.75rem 1.5rem;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-check-updates:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }

  .btn-check-updates:disabled {
    background: var(--text-secondary);
    cursor: not-allowed;
    transform: none;
  }

  .update-links {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .update-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--brand);
    text-decoration: none;
    font-weight: 600;
    margin-bottom: 0.75rem;
    transition: color 0.2s ease;
  }

  .update-link:hover {
    color: #1d4ed8;
  }

  .update-link:last-child {
    margin-bottom: 0;
  }

  /* Dark Theme */
  [data-theme="dark"] .update-info-item,
  [data-theme="dark"] .update-status {
    background: var(--card-bg, #242526);
    border: 1px solid var(--border, #3a3b3c);
  }

  [data-theme="dark"] .update-info-label {
    color: var(--text-secondary, #94a3b8);
  }

  [data-theme="dark"] .update-info-value,
  [data-theme="dark"] .update-status-text {
    color: var(--text-dark, #e4e6eb);
  }

  [data-theme="dark"] .update-link {
    color: var(--primary, #818cf8);
  }

  [data-theme="dark"] .update-link:hover {
    color: #a5b4fc;
  }

  [data-theme="dark"] .btn-check-updates {
    background: var(--primary, #6366f1);
  }

  [data-theme="dark"] .btn-check-updates:hover {
    background: var(--primary-hover, #818cf8);
  }
</style>

<div class="update-info">
  <div class="update-info-item">
    <div class="update-info-label">Current Version</div>
    <div class="update-info-value" id="current-version">{{ app_version }}</div>
  </div>
  <div class="update-info-item">
    <div class="update-info-label">Build</div>
    <div class="update-info-value">{{ app_build }}</div>
  </div>
  <div class="update-info-item">
    <div class="update-info-label">Channel</div>
    <div class="update-info-value">{{ app_release_channel|default:"Unknown" }}</div>
  </div>
  <div class="update-info-item">
    <div class="update-info-label">Latest Version</div>
    <div class="update-info-value" id="latest-version">{{ latest_app_version|default:app_version }}</div>
  </div>
</div>

<div class="update-status">
  <div class="update-status-dot" id="update-status-dot"></div>
  <div class="update-status-text" id="update-status-text">Up to date</div>
</div>

<button type="button" class="btn-check-updates" id="check-updates-btn">
  <i class="bi bi-arrow-clockwise"></i> Check for Updates
</button>

<div class="update-links">
  <a href="/system/releases/" class="update-link">
    <i class="bi bi-box-seam"></i> Release Center
  </a>
  {% if current_release %}
  <a href="/system/releases/{{ current_release.id }}/" class="update-link">
    <i class="bi bi-info-circle"></i> Current Release Details
  </a>
  {% endif %}
</div>

<script>
  // Auto-check for updates on page load
  document.addEventListener('DOMContentLoaded', async function() {
    await checkForUpdates();
  });

  // Check for updates button
  document.getElementById('check-updates-btn').addEventListener('click', async function() {
    await checkForUpdates();
  });

  async function checkForUpdates() {
    const btn = document.getElementById('check-updates-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Checking...';

    try {
      let query = '';
      if (typeof window.getInstalledAppVersion === 'function') {
        const inst = await window.getInstalledAppVersion();
        if (inst && inst.version) {
          query = '?installed_version=' + encodeURIComponent(inst.version) + '&installed_build=' + encodeURIComponent(inst.build);
        }
      } else {
        const cachedVer = localStorage.getItem('pwaninet_installed_apk_version');
        const cachedBuild = localStorage.getItem('pwaninet_installed_apk_build');
        if (cachedVer) {
          query = '?installed_version=' + encodeURIComponent(cachedVer) + '&installed_build=' + encodeURIComponent(cachedBuild || 1);
        }
      }

      const response = await fetch('/api/releases/version_check/' + query);
      const data = await response.json();

      // Update current and latest version displays
      const curVerEl = document.getElementById('current-version');
      if (curVerEl && data.running_version) {
        curVerEl.textContent = data.running_version;
      }
      const latestVerEl = document.getElementById('latest-version');
      if (latestVerEl && data.latest_version) {
        latestVerEl.textContent = data.latest_version;
      }

      // Update status
      const statusDot = document.getElementById('update-status-dot');
      const statusText = document.getElementById('update-status-text');

      if (data.update_available) {
        statusDot.style.background = '#f59e0b';
        statusText.textContent = 'Update available (v' + (data.latest_apk_version || data.latest_version) + ')';
        statusText.style.color = '#f59e0b';

        // Show update notification
        if (data.mandatory_update) {
          alert(`MANDATORY UPDATE: Version ${data.latest_version} is available. You must update to continue using the app.`);
          window.location.href = data.apk_url || '/download/app/latest/';
        } else if (confirm(`New version ${data.latest_version} is available. Would you like to download the update?`)) {
          if (typeof window.triggerNativeApkDownload === 'function') {
            window.triggerNativeApkDownload(data.apk_url || '/download/app/latest/');
          } else {
            window.location.href = data.apk_url || '/download/app/latest/';
          }
        }
      } else {
        statusDot.style.background = '#22c55e';
        statusText.textContent = 'Up to date';
        statusText.style.color = 'var(--text-primary)';
      }
    } catch (error) {
      console.error('Failed to check for updates:', error);
      const statusText = document.getElementById('update-status-text');
      statusText.textContent = 'Check failed';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Check for Updates';
    }
  }
</script>
