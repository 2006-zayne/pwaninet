{% load i18n %}
<a href="{% url url_name %}" class="settings-category-item" {% if is_htmx %}hx-get="{% url url_name %}" hx-target="#page-content-target" hx-swap="innerHTML" hx-push-url="true" hx-history="true"{% else %}data-bypass-htmx="true" hx-boost="false"{% endif %}>
  <div class="settings-category-icon">
    <i class="bi {{ icon_class }}"></i>
  </div>
  <div class="settings-category-content">
    <div class="settings-category-title">{% trans title %}</div>
    <div class="settings-category-subtitle">{% trans subtitle %}</div>
  </div>
  <div class="settings-category-chevron">
    <i class="bi bi-chevron-right"></i>
  </div>
</a>
