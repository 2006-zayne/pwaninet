<!-- Onboarding Tour Prompt Modal -->
<div class="modal fade" id="onboardingTourModal" tabindex="-1" aria-labelledby="onboardingTourModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center p-4">
        <div class="mb-3">
          <i class="bi bi-compass text-primary" style="font-size: 3rem;"></i>
        </div>
        <h5 class="modal-title fw-bold mb-3" id="onboardingTourModalLabel">Wanna take a quick tour around PwaniNet?</h5>
        <p class="text-muted mb-4">Discover how to connect with classmates, join academic groups, and make the most of your campus network.</p>
        
        <div class="d-flex gap-2 justify-content-center">
          <button type="button" class="btn btn-outline-secondary px-4" id="skipTourBtn">Skip for now</button>
          <button type="button" class="btn btn-primary px-4" id="startTourBtn">Start Tour</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const promptEl = document.getElementById('onboardingTourModal');
  if (!promptEl || typeof bootstrap === 'undefined') return;

  const tourModal = bootstrap.Modal.getOrCreateInstance(promptEl);
  const hasCompletedOnboarding = {% if request.user.has_completed_onboarding %}true{% else %}false{% endif %};
  
  if (!hasCompletedOnboarding) {
    setTimeout(function() {
      tourModal.show();
    }, 1500);
  }
  
  document.getElementById('skipTourBtn').addEventListener('click', function() {
    tourModal.hide();
    if (typeof window.markOnboardingCompleted === 'function') {
      window.markOnboardingCompleted();
    }
    promptEl.addEventListener('hidden.bs.modal', function onHidden() {
      promptEl.removeEventListener('hidden.bs.modal', onHidden);
      if (typeof window.showProfileCompletionPrompt === 'function') {
        window.showProfileCompletionPrompt();
      }
    }, { once: true });
  });
  
  document.getElementById('startTourBtn').addEventListener('click', function() {
    tourModal.hide();
    promptEl.addEventListener('hidden.bs.modal', function onHidden() {
      promptEl.removeEventListener('hidden.bs.modal', onHidden);
      if (typeof window.startOnboardingTour === 'function') {
        window.startOnboardingTour();
      } else {
        console.error('startOnboardingTour is not defined — ensure tour.html is included after tour_prompt.html');
      }
    }, { once: true });
  });
});
</script>
