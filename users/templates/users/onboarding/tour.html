<!-- Interactive PwaniNet Spotlight Tour -->
<style>
  /* ── Tour Overlay & Spotlight ── */
  #pwaninet-tour-overlay {
    position: fixed;
    inset: 0;
    z-index: 10050;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #pwaninet-tour-overlay.tour-active {
    opacity: 1;
  }

  /* Spotlight Cutout Frame */
  #pwaninet-tour-spotlight {
    position: fixed;
    z-index: 10051;
    pointer-events: none;
    border-radius: 16px;
    box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.78),
                0 0 0 3px rgba(37, 99, 235, 0.9),
                0 0 24px rgba(37, 99, 235, 0.45);
    transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                left 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                width 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                height 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                border-radius 0.35s ease;
    animation: tourPulse 2.2s infinite ease-in-out;
  }

  @keyframes tourPulse {
    0%, 100% {
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.78),
                  0 0 0 3px rgba(37, 99, 235, 0.9),
                  0 0 16px rgba(37, 99, 235, 0.4);
    }
    50% {
      box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.82),
                  0 0 0 4px rgba(59, 130, 246, 1),
                  0 0 28px rgba(59, 130, 246, 0.75);
    }
  }

  /* ── Interactive Tour Popover Card ── */
  #pwaninet-tour-card {
    position: fixed;
    z-index: 10055;
    background: #ffffff;
    color: #0f172a;
    border-radius: 20px;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(0, 0, 0, 0.08);
    width: 380px;
    max-width: calc(100vw - 32px);
    padding: 20px 18px 16px;
    opacity: 0;
    transform: translateY(8px) scale(0.97);
    transition: opacity 0.28s ease,
                transform 0.28s ease,
                top 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: auto;
  }
  #pwaninet-tour-card.card-visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  [data-theme="dark"] #pwaninet-tour-card {
    background: #1e293b;
    color: #f8fafc;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.1);
  }

  .tour-badge-pill {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #2563eb;
    background: rgba(37, 99, 235, 0.1);
    padding: 4px 10px;
    border-radius: 999px;
  }
  [data-theme="dark"] .tour-badge-pill {
    color: #818cf8;
    background: rgba(129, 140, 248, 0.15);
  }

  .tour-tip-box {
    background: #f8fafc;
    border-left: 3px solid #2563eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: #475569;
    margin-top: 10px;
  }
  [data-theme="dark"] .tour-tip-box {
    background: #0f172a;
    border-color: #818cf8;
    color: #94a3b8;
  }

  /* Step dots indicator */
  .tour-step-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .tour-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #cbd5e1;
    transition: all 0.25s ease;
  }
  [data-theme="dark"] .tour-dot {
    background: #475569;
  }
  .tour-dot.active-dot {
    width: 20px;
    border-radius: 999px;
    background: #2563eb;
  }
  [data-theme="dark"] .tour-dot.active-dot {
    background: #818cf8;
  }

  /* Responsive positioning on mobile: Lifted cleanly above mobile bottom nav */
  @media (max-width: 767px) {
    #pwaninet-tour-card {
      width: calc(100vw - 24px) !important;
      left: 12px !important;
      right: 12px !important;
      max-width: none !important;
      border-radius: 20px;
      padding: 16px 14px 12px;
    }
  }
</style>

<!-- Tour Markup Container (Hidden by default) -->
<div id="pwaninet-tour-overlay" class="d-none" aria-live="polite" role="dialog" aria-modal="true">
  <!-- Dynamic Spotlight Frame -->
  <div id="pwaninet-tour-spotlight"></div>

  <!-- Interactive Popover Card -->
  <div id="pwaninet-tour-card">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <div class="d-flex align-items-center gap-2">
        <span class="tour-badge-pill" id="tourStepBadge">Step 1 of 5</span>
      </div>
      <button type="button"
              class="btn-close btn-close-sm"
              onclick="window.exitTour()"
              aria-label="Close tour"
              style="font-size: 0.75rem;"></button>
    </div>

    <div class="d-flex align-items-start gap-3 mt-2">
      <div class="rounded-circle bg-primary bg-opacity-10 text-primary p-2 d-flex align-items-center justify-content-center flex-shrink-0"
           style="width: 42px; height: 42px;" id="tourStepIconBox">
        <i class="bi bi-compass-fill fs-4" id="tourStepIcon"></i>
      </div>
      <div class="flex-grow-1 min-w-0">
        <h6 class="fw-bold mb-1" id="tourStepTitle" style="font-size: 1rem;">Campus Feed & Search</h6>
        <p class="small text-muted mb-0" id="tourStepBody" style="line-height: 1.4; font-size: 0.83rem;">
          Your personalized feed brings together classmate posts, campus announcements, and group discussions.
        </p>
      </div>
    </div>

    <!-- Pro Tip Callout -->
    <div class="tour-tip-box" id="tourStepTipContainer">
      <strong class="text-primary me-1"><i class="bi bi-lightbulb-fill"></i> Tip:</strong>
      <span id="tourStepTip">Use the search bar above to look up classmates or unit codes.</span>
    </div>

    <!-- Card Navigation Footer -->
    <div class="d-flex align-items-center justify-content-between mt-3 pt-2 border-top">
      <div class="tour-step-dots" id="tourStepDots">
        <span class="tour-dot active-dot"></span>
        <span class="tour-dot"></span>
        <span class="tour-dot"></span>
        <span class="tour-dot"></span>
        <span class="tour-dot"></span>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button type="button"
                class="btn btn-sm btn-link text-muted text-decoration-none px-2 py-1 fw-semibold"
                id="tourPrevBtn"
                onclick="window.prevTourStep()">
          <i class="bi bi-arrow-left"></i> Back
        </button>
        <button type="button"
                class="btn btn-sm btn-primary rounded-pill px-3 py-1 fw-bold shadow-xs d-flex align-items-center gap-1"
                id="tourNextBtn"
                onclick="window.nextTourStep()">
          <span>Next</span> <i class="bi bi-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<input type="hidden" name="csrfmiddlewaretoken" id="onboarding-csrf-token" value="{{ csrf_token }}">

<script>
(function() {
  'use strict';

  const PROFILE_URL = "{% url 'users:profile' request.user.username %}";
  const HOME_URL = "{% url 'posts:home' %}";

  const TOUR_STEPS = [
    {
      title: "Campus Feed & Search",
      icon: "bi-search",
      body: "Your home feed displays real-time posts, questions, and course updates from your classmates and academic groups. Use the search bar anytime to find friends, notes, or groups.",
      tip: "Search for unit codes like CSC101 or classmate names to find discussions instantly.",
      targets: ['.search-header', '.search-inner', '#main-content-area'],
      isProfileTarget: false
    },
    {
      title: "Academic Groups & Cohorts",
      icon: "bi-people-fill",
      body: "Tap the Groups icon to explore course cohorts, revision squads, and campus societies. You are automatically enrolled in your official class group based on your year and degree!",
      tip: "Check your group chats for exam tips, timetable updates, and shared study materials.",
      targets: [
        '.mobile-bottom-nav a[aria-label="Groups"]',
        '.mobile-bottom-nav a[href*="groups_dashboard"]',
        '.navbar-top a[href*="groups_dashboard"]',
        '.navbar-top a[href*="groups"]',
        '.groups-explore-section'
      ],
      isProfileTarget: false
    },
    {
      title: "Document Repository Shortcut",
      icon: "bi-folder-fill",
      body: "We've navigated to your profile! Tap this floating Documents button anytime to access lecture notes, summaries, and past papers tailored to your semester curriculum.",
      tip: "Notes matching your active units have a 'Matches Unit' badge and can be saved for offline study.",
      targets: ['#documents-btn', '.floating-btn[href*="documents"]', '#profile-floating-actions'],
      isProfileTarget: true
    },
    {
      title: "Ask & Share (Create Post)",
      icon: "bi-plus-circle-fill",
      body: "Got an assignment question or campus update? Tap the Post button to share with your classmates. You can attach images, PDFs, links, and poll the community.",
      tip: "Tag your specific course group so classmates in the same unit get notified right away.",
      targets: [
        '.mobile-bottom-nav a[aria-label="Create Post"]',
        '.mobile-bottom-nav a[href*="create_post"]',
        '.navbar-top a[href*="create_post"]',
        'a[href*="create_post"]'
      ],
      isProfileTarget: false
    },
    {
      title: "Notifications & Alerts",
      icon: "bi-bell-fill",
      body: "Keep track of assignment replies, likes, mentions, and course announcements right here in Notifications. You're ready to make the most of PwaniNet!",
      tip: "Check your notification settings in your profile to customize alert sounds and push updates.",
      targets: [
        '#notification-badge-container',
        '.mobile-bottom-nav a[aria-label="Notifications"]',
        '#notification-badge-container-desktop',
        '.navbar-top a[href*="notifications"]'
      ],
      isProfileTarget: false
    }
  ];

  let currentStepIndex = 0;
  let activeTargetElement = null;
  let isTourRunning = false;
  let repositionRaf = null;

  function getCsrfToken() {
    const el = document.querySelector('[name=csrfmiddlewaretoken]');
    return el ? el.value : '';
  }

  function resolveTarget(step) {
    for (const sel of step.targets) {
      const el = document.querySelector(sel);
      if (el && el.offsetParent !== null) {
        return el;
      }
    }
    return document.querySelector('#main-content-area') || document.body;
  }

  function updateDots() {
    const dotsContainer = document.getElementById('tourStepDots');
    if (!dotsContainer) return;
    const dots = dotsContainer.querySelectorAll('.tour-dot');
    dots.forEach((dot, idx) => {
      if (idx === currentStepIndex) {
        dot.classList.add('active-dot');
      } else {
        dot.classList.remove('active-dot');
      }
    });
  }

  function renderStep(index) {
    const step = TOUR_STEPS[index];
    if (!step) return;

    currentStepIndex = index;

    // Handle profile page navigation for Document Repository step
    if (step.isProfileTarget) {
      const existingBtn = document.getElementById('documents-btn');
      if (!existingBtn || existingBtn.offsetParent === null) {
        // Navigate to profile using HTMX or window.location
        if (window.htmx) {
          htmx.ajax('GET', PROFILE_URL, { target: '#page-content-target', swap: 'innerHTML' });
        } else {
          const profileChip = document.querySelector('a.nav-chip[aria-label="Profile"]') || document.querySelector('a[href*="/profile/"]');
          if (profileChip) profileChip.click();
        }

        // Wait for profile content and documents button to mount
        let attempts = 0;
        const checkInterval = setInterval(() => {
          attempts++;
          const btn = document.getElementById('documents-btn');
          if (btn && btn.offsetParent !== null) {
            clearInterval(checkInterval);
            proceedWithTarget(step, index, btn);
          } else if (attempts > 30) {
            clearInterval(checkInterval);
            proceedWithTarget(step, index, resolveTarget(step));
          }
        }, 80);
        return;
      } else {
        proceedWithTarget(step, index, existingBtn);
        return;
      }
    } else if (index === 0) {
      // If moving back to Step 1 and we're still on profile, navigate back to feed
      const searchHeader = document.querySelector('.search-header');
      if (!searchHeader && window.htmx) {
        htmx.ajax('GET', HOME_URL, { target: '#page-content-target', swap: 'innerHTML' });
        setTimeout(() => {
          proceedWithTarget(step, index, resolveTarget(step));
        }, 150);
        return;
      }
    }

    proceedWithTarget(step, index, resolveTarget(step));
  }

  function proceedWithTarget(step, index, target) {
    // Reset previous target styling
    if (activeTargetElement) {
      if (activeTargetElement.id === 'documents-btn') {
        activeTargetElement.classList.remove('expanded');
        activeTargetElement.style.removeProperty('z-index');
      }
    }

    activeTargetElement = target;

    // Handle Documents floating button expansion
    if (target && target.id === 'documents-btn') {
      target.classList.add('expanded');
      target.style.zIndex = '10053';
    }

    // Handle Mobile Bottom Nav elevation when targeting nav chips
    const mobileNav = document.querySelector('.mobile-bottom-nav');
    if (mobileNav) {
      if (target && target.closest('.mobile-bottom-nav')) {
        mobileNav.style.zIndex = '10053';
      } else {
        mobileNav.style.removeProperty('z-index');
      }
    }

    // Update UI text & icons
    const badge = document.getElementById('tourStepBadge');
    const title = document.getElementById('tourStepTitle');
    const body = document.getElementById('tourStepBody');
    const tip = document.getElementById('tourStepTip');
    const icon = document.getElementById('tourStepIcon');
    const prevBtn = document.getElementById('tourPrevBtn');
    const nextBtn = document.getElementById('tourNextBtn');

    if (badge) badge.textContent = `Step ${index + 1} of ${TOUR_STEPS.length}`;
    if (title) title.textContent = step.title;
    if (body) body.textContent = step.body;
    if (tip) tip.textContent = step.tip;
    if (icon) {
      icon.className = `bi ${step.icon} fs-4`;
    }

    // Prev button state
    if (prevBtn) {
      prevBtn.style.visibility = index === 0 ? 'hidden' : 'visible';
    }

    // Next button state
    if (nextBtn) {
      if (index === TOUR_STEPS.length - 1) {
        nextBtn.innerHTML = '<span>Finish</span> <i class="bi bi-check2-circle"></i>';
        nextBtn.classList.remove('btn-primary');
        nextBtn.classList.add('btn-success');
      } else {
        nextBtn.innerHTML = '<span>Next</span> <i class="bi bi-arrow-right"></i>';
        nextBtn.classList.remove('btn-success');
        nextBtn.classList.add('btn-primary');
      }
    }

    updateDots();

    // Smooth scroll if element is not visible
    if (target && target !== document.body && !target.closest('.mobile-bottom-nav')) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
    }

    setTimeout(repositionSpotlight, 120);
  }

  function repositionSpotlight() {
    if (!isTourRunning || !activeTargetElement) return;

    const spotlight = document.getElementById('pwaninet-tour-spotlight');
    const card = document.getElementById('pwaninet-tour-card');
    if (!spotlight || !card) return;

    const rect = activeTargetElement.getBoundingClientRect();
    const isMobile = window.innerWidth < 768;
    const padding = 8;

    // Clamp spotlight inside viewport
    const left = Math.max(4, rect.left - padding);
    const top = Math.max(4, rect.top - padding);
    const width = Math.min(window.innerWidth - left - 4, rect.width + padding * 2);
    const height = Math.min(window.innerHeight - top - 4, rect.height + padding * 2);

    spotlight.style.left = `${left}px`;
    spotlight.style.top = `${top}px`;
    spotlight.style.width = `${width}px`;
    spotlight.style.height = `${height}px`;

    // Position Card
    if (isMobile) {
      // On mobile: if target is near bottom (e.g. floating documents button at bottom 110px),
      // place dialogue at top to avoid covering it!
      const isNearBottomAction = activeTargetElement.id === 'documents-btn' ||
                                (rect.top > window.innerHeight * 0.48 && rect.bottom < window.innerHeight - 80);

      if (isNearBottomAction) {
        card.style.top = 'calc(24px + var(--pwaninet-safe-area-top, 0px))';
        card.style.bottom = 'auto';
      } else {
        // Otherwise lift card cleanly ABOVE the mobile bottom nav bar (60px + 12px = 72px)
        card.style.top = 'auto';
        card.style.bottom = 'calc(88px + var(--pwaninet-safe-area-bottom, env(safe-area-inset-bottom, 0px)))';
      }
      card.style.left = '12px';
      card.style.right = '12px';
    } else {
      // On desktop: intelligently place card next to element
      card.style.right = 'auto';
      card.style.bottom = 'auto';

      const cardHeight = card.offsetHeight || 220;
      const cardWidth = 380;

      let cardTop = rect.bottom + 16;
      let cardLeft = rect.left;

      // If bottom placement overflows viewport, place above
      if (cardTop + cardHeight > window.innerHeight - 20) {
        cardTop = Math.max(20, rect.top - cardHeight - 16);
      }

      // Clamp horizontal position
      if (cardLeft + cardWidth > window.innerWidth - 20) {
        cardLeft = window.innerWidth - cardWidth - 20;
      }
      cardLeft = Math.max(20, cardLeft);

      card.style.top = `${cardTop}px`;
      card.style.left = `${cardLeft}px`;
    }

    card.classList.add('card-visible');
  }

  function handleResizeOrScroll() {
    if (!isTourRunning) return;
    if (repositionRaf) cancelAnimationFrame(repositionRaf);
    repositionRaf = requestAnimationFrame(repositionSpotlight);
  }

  function handleKeydown(e) {
    if (!isTourRunning) return;
    if (e.key === 'Escape') {
      window.exitTour();
    } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
      window.nextTourStep();
    } else if (e.key === 'ArrowLeft') {
      window.prevTourStep();
    }
  }

  window.startOnboardingTour = function() {
    const overlay = document.getElementById('pwaninet-tour-overlay');
    if (!overlay) return;

    isTourRunning = true;
    overlay.classList.remove('d-none');
    requestAnimationFrame(() => {
      overlay.classList.add('tour-active');
    });

    currentStepIndex = 0;
    renderStep(0);

    window.addEventListener('resize', handleResizeOrScroll);
    window.addEventListener('scroll', handleResizeOrScroll, { passive: true });
    window.addEventListener('keydown', handleKeydown);
  };

  window.nextTourStep = function() {
    if (currentStepIndex < TOUR_STEPS.length - 1) {
      renderStep(currentStepIndex + 1);
    } else {
      window.finishTour();
    }
  };

  window.prevTourStep = function() {
    if (currentStepIndex > 0) {
      renderStep(currentStepIndex - 1);
    }
  };

  window.finishTour = function() {
    closeTour();
    window.markOnboardingCompleted();
    if (typeof window.showProfileCompletionPrompt === 'function') {
      window.showProfileCompletionPrompt();
    }
  };

  window.exitTour = function() {
    closeTour();
    window.markOnboardingCompleted();
  };

  function closeTour() {
    isTourRunning = false;
    const overlay = document.getElementById('pwaninet-tour-overlay');
    const card = document.getElementById('pwaninet-tour-card');
    const mobileNav = document.querySelector('.mobile-bottom-nav');
    const docsBtn = document.getElementById('documents-btn');

    if (docsBtn) {
      docsBtn.classList.remove('expanded');
      docsBtn.style.removeProperty('z-index');
    }
    if (mobileNav) {
      mobileNav.style.removeProperty('z-index');
    }

    if (card) card.classList.remove('card-visible');
    if (overlay) {
      overlay.classList.remove('tour-active');
      setTimeout(() => {
        overlay.classList.add('d-none');
      }, 300);
    }

    window.removeEventListener('resize', handleResizeOrScroll);
    window.removeEventListener('scroll', handleResizeOrScroll);
    window.removeEventListener('keydown', handleKeydown);

    if (typeof window.dismissWelcomeBanner === 'function') {
      window.dismissWelcomeBanner();
    }
  }

  window.markOnboardingCompleted = function() {
    fetch('/users/mark-onboarding-complete/', {
      method: 'POST',
      headers: {
        'X-CSRFToken': getCsrfToken(),
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({}),
    }).catch(function(err) {
      console.warn('Could not persist tour completion:', err);
    });
  };

  window.showProfileCompletionPrompt = function() {
    const profileModal = document.getElementById('profileCompletionModal');
    if (profileModal && typeof bootstrap !== 'undefined') {
      bootstrap.Modal.getOrCreateInstance(profileModal).show();
    }
  };

})();
</script>
