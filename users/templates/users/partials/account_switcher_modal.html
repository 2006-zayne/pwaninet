<!-- Account Switcher Modal -->
<div class="modal fade" id="accountSwitcherModal" tabindex="-1" aria-hidden="true">
    <style>
  [data-theme="dark"] .bg-white {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .bg-light {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .text-dark {
    color: #ffffff !important;
  }
  [data-theme="dark"] .text-muted {
    color: #d1d5db !important;
  }
  [data-theme="dark"] .modal-content {
    background-color: var(--card-bg) !important;
    border-color: var(--border) !important;
  }
  [data-theme="dark"] .modal-title {
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-body {
    color: #ffffff !important;
  }
  [data-theme="dark"] .border {
    border-color: var(--border) !important;
  }
</style>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Switch Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="account-list-container">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <form action="{% url 'users:logout' %}" method="POST" class="m-0 w-100">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-plus-circle me-2"></i>Add New Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const DEVICE_ID_KEY = 'pwaninet_device_id';

    function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem(DEVICE_ID_KEY);
        if (!deviceId) {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            deviceId = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            localStorage.setItem(DEVICE_ID_KEY, deviceId);
        }
        return deviceId;
    }

    function getCsrfToken() {
        const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
        if (cookie) return cookie.split('=')[1];
        const input = document.querySelector('[name=csrfmiddlewaretoken]');
        return input ? input.value : '';
    }

    function switchAccount(userId, btn) {
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span>';
        }

        // Hide modal cleanly
        const modalEl = document.getElementById('accountSwitcherModal');
        if (modalEl && window.bootstrap && window.bootstrap.Modal) {
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            if (modalInstance) {
                modalInstance.hide();
            }
        }
        // Defensive cleanup of any remaining modal artifacts
        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
        document.body.classList.remove('modal-open');
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('padding-right');

        // Clean client-side cache and user-specific session storage
        try {
            localStorage.removeItem('htmx-history-cache');
        } catch (e) {}

        try {
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('profileCompletionDismissed');
            sessionStorage.removeItem('home_feed_scroll_y');
        } catch (e) {}

        // Full window navigation to switch endpoint ensures clean session & layout reload
        const deviceId = getOrCreateDeviceId();
        window.location.href = `/users/accounts/switch/${userId}/?device_id=${encodeURIComponent(deviceId)}`;
    }

    async function removeAccount(userId, username, btn) {
        if (!confirm(`Remove @${username} from this device?`)) {
            return;
        }

        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm text-danger" role="status"></span>';
        }

        const deviceId = getOrCreateDeviceId();
        const csrfToken = getCsrfToken();
        const removeUrl = `/users/accounts/remove/${userId}/?device_id=${encodeURIComponent(deviceId)}`;

        try {
            const response = await fetch(removeUrl, {
                method: 'POST',
                headers: {
                    'X-Device-ID': deviceId,
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                },
                credentials: 'same-origin'
            });

            const modal = document.getElementById('accountSwitcherModal');
            if (modal) {
                loadAccounts(modal);
            }
        } catch (error) {
            console.error('[Account Switcher] Error removing account:', error);
            alert('Failed to remove account. Please try again.');
            const modal = document.getElementById('accountSwitcherModal');
            if (modal) {
                loadAccounts(modal);
            }
        }
    }

    async function loadAccounts(modalElement) {
        const container = modalElement ? modalElement.querySelector('#account-list-container') : document.getElementById('account-list-container');
        if (!container) return;

        // Reset spinner on each open
        container.innerHTML = `
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="small text-muted mt-2">Loading accounts…</div>
            </div>
        `;

        const deviceId = getOrCreateDeviceId();
        const baseUrl = '{% url "users:device_accounts" %}';
        const fetchUrl = `${baseUrl}?device_id=${encodeURIComponent(deviceId)}`;

        try {
            const response = await fetch(fetchUrl, {
                method: 'GET',
                headers: {
                    'X-Device-ID': deviceId,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                },
                credentials: 'same-origin'
            });

            if (!response.ok) {
                if (response.status === 401 || response.status === 403 || response.status === 302) {
                    throw new Error('Authentication required. Please refresh the page.');
                }
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            if (data.accounts && data.accounts.length > 0) {
                container.innerHTML = data.accounts.map(account => `
                    <div class="account-item d-flex align-items-center p-3 mb-2 rounded-3 ${account.is_current ? 'bg-primary bg-opacity-10 border border-primary' : 'bg-light'}">
                        <img src="${account.profile_pic || '/static/images/default_pic1.jpg'}" 
                             class="rounded-circle me-3" 
                             style="width: 48px; height: 48px; object-fit: cover;"
                             onerror="this.src='/static/images/default_pic1.jpg'">
                        <div class="flex-grow-1 min-w-0 me-2">
                            <div class="fw-bold text-truncate">${account.full_name || account.username}</div>
                            <div class="text-muted small text-truncate">@${account.username}</div>
                        </div>
                        ${account.is_current 
                            ? '<span class="badge bg-primary flex-shrink-0">Current</span>'
                            : `<button type="button" 
                                       class="btn btn-sm btn-primary rounded-pill px-3 switch-account-btn flex-shrink-0" 
                                       data-user-id="${account.id}">Switch</button>`
                        }
                        ${!account.is_current 
                            ? `<button type="button" 
                                       class="btn btn-sm btn-link text-muted ms-2 remove-account-btn flex-shrink-0" 
                                       data-user-id="${account.id}" 
                                       data-username="${account.username}" 
                                       title="Remove from device">
                                   <i class="bi bi-x-circle"></i>
                               </button>`
                            : ''
                        }
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div class="text-center py-4">
                        <i class="bi bi-person-circle display-4 text-muted mb-3"></i>
                        <p class="text-muted mb-1">No other accounts on this device</p>
                        <p class="text-muted small">Log out and log in with another account to add it here</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('[Account Switcher] Error loading accounts:', error);
            container.innerHTML = `
                <div class="text-center py-4 text-danger">
                    <i class="bi bi-exclamation-circle display-4 mb-3"></i>
                    <p class="mb-1 fw-semibold">Failed to load accounts</p>
                    <p class="small text-muted mb-3">${error.message || 'Unknown error'}</p>
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 retry-load-accounts-btn">
                        <i class="bi bi-arrow-clockwise me-1"></i>Retry
                    </button>
                </div>
            `;
            container.querySelector('.retry-load-accounts-btn')?.addEventListener('click', () => loadAccounts(modalElement));
        }
    }

    // Delegated click handlers for Switch and Remove buttons
    document.addEventListener('click', function(e) {
        const switchBtn = e.target.closest('.switch-account-btn');
        if (switchBtn && switchBtn.dataset.userId) {
            e.preventDefault();
            switchAccount(switchBtn.dataset.userId, switchBtn);
            return;
        }

        const removeBtn = e.target.closest('.remove-account-btn');
        if (removeBtn && removeBtn.dataset.userId) {
            e.preventDefault();
            removeAccount(removeBtn.dataset.userId, removeBtn.dataset.username || '', removeBtn);
            return;
        }

        const trigger = e.target.closest('[data-bs-target="#accountSwitcherModal"]');
        if (trigger) {
            const modal = document.getElementById('accountSwitcherModal');
            if (modal) {
                loadAccounts(modal);
            }
        }
    });

    // Document-level listener handles modals opened via full page load or Bootstrap events
    document.addEventListener('show.bs.modal', function(e) {
        if (e.target && e.target.id === 'accountSwitcherModal') {
            loadAccounts(e.target);
        }
    });
})();
</script>
