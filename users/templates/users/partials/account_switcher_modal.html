<!-- Account Switcher Modal -->
<div class="modal fade" id="accountSwitcherModal" tabindex="-1" aria-hidden="true">
    <style>
  [data-theme="dark"] .bg-white {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .bg-light {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .text-dark {
    color: #ffffff !important;
  }
  [data-theme="dark"] .text-muted {
    color: #d1d5db !important;
  }
  [data-theme="dark"] .modal-content {
    background-color: var(--card-bg) !important;
    border-color: var(--border) !important;
  }
  [data-theme="dark"] .modal-title {
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-body {
    color: #ffffff !important;
  }
  [data-theme="dark"] .border {
    border-color: var(--border) !important;
  }
</style>
<div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Switch Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="account-list-container">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <form action="{% url 'users:logout' %}" method="POST" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-plus-circle me-2"></i>Add New Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Helper function to get CSRF token from cookies
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('accountSwitcherModal');
    const container = document.getElementById('account-list-container');
    const DEVICE_ID_KEY = 'pwaninet_device_id';
    
    modal.addEventListener('show.bs.modal', function() {
        console.log('[Account Switcher] Modal opening');
        
        // Get device ID from localStorage (same as device_manager.js)
        let deviceId = localStorage.getItem(DEVICE_ID_KEY);
        console.log('[Account Switcher] Device ID from localStorage:', deviceId ? deviceId.substring(0, 8) + '...' : 'null');
        
        // If device_manager.js hasn't run yet, create it
        if (!deviceId) {
            console.log('[Account Switcher] No device ID found, generating new one');
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            deviceId = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            localStorage.setItem(DEVICE_ID_KEY, deviceId);
            console.log('[Account Switcher] Generated new device ID:', deviceId.substring(0, 8) + '...');
        }
        
        // Load accounts when modal opens
        const deviceAccountsUrl = '{% url "users:device_accounts" %}';
        console.log('[Account Switcher] Fetching accounts from:', deviceAccountsUrl);
        
        // Get CSRF token
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                         getCookie('csrftoken');
        
        fetch(deviceAccountsUrl, {
            method: 'GET',
            headers: {
                'X-Device-ID': deviceId,
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json'
            },
            credentials: 'same-origin'
        })
            .then(response => {
                console.log('[Account Switcher] Response status:', response.status);
                console.log('[Account Switcher] Response headers:', response.headers);
                return response.json().then(data => {
                    console.log('[Account Switcher] Response data:', data);
                    return { response, data };
                });
            })
            .then(({ response, data }) => {
                if (!response.ok) {
                    if (response.status === 302 || response.status === 401 || response.status === 403) {
                        throw new Error('Authentication required. Please refresh the page.');
                    }
                    throw new Error(`HTTP ${response.status}: ${data.error || 'Unknown error'}`);
                }
                
                if (data.accounts && data.accounts.length > 0) {
                    console.log('[Account Switcher] Found', data.accounts.length, 'accounts');
                    container.innerHTML = data.accounts.map(account => `
                        <div class="account-item d-flex align-items-center p-3 mb-2 rounded-3 ${account.is_current ? 'bg-primary bg-opacity-10 border border-primary' : 'bg-light'}">
                            <img src="${account.profile_pic || '/static/images/default_pic1.jpg'}" 
                                 class="rounded-circle me-3" 
                                 style="width: 48px; height: 48px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <div class="fw-bold">${account.full_name || account.username}</div>
                                <div class="text-muted small">@${account.username}</div>
                            </div>
                            ${account.is_current 
                                ? '<span class="badge bg-primary">Current</span>'
                                : `<a href="/users/accounts/switch/${account.id}/?device_id=${deviceId}" 
                                      class="btn btn-sm btn-primary rounded-pill px-3">Switch</a>`
                            }
                            ${!account.is_current 
                                ? `<a href="/users/accounts/remove/${account.id}/?device_id=${deviceId}" 
                                      class="btn btn-sm btn-link text-muted ms-2" title="Remove from device">
                                      <i class="bi bi-x-circle"></i></a>`
                                : ''
                            }
                        </div>
                    `).join('');
                } else {
                    console.log('[Account Switcher] No accounts found');
                    container.innerHTML = `
                        <div class="text-center py-4">
                            <i class="bi bi-person-circle display-4 text-muted mb-3"></i>
                            <p class="text-muted">No other accounts on this device</p>
                            <p class="text-muted small">Log out and log in with another account to add it here</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('[Account Switcher] Error loading accounts:', error);
                container.innerHTML = `
                    <div class="text-center py-4 text-danger">
                        <i class="bi bi-exclamation-circle display-4 mb-3"></i>
                        <p>Failed to load accounts</p>
                        <p class="small text-muted">${error.message}</p>
                    </div>
                `;
            });
    });
});
</script>
