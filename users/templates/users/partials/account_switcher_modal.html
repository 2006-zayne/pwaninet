<!-- Account Switcher Modal -->
<div class="modal fade" id="accountSwitcherModal" tabindex="-1" aria-hidden="true">
    <style>
  [data-theme="dark"] .bg-white {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .bg-light {
    background-color: var(--card-bg) !important;
  }
  [data-theme="dark"] .text-dark {
    color: #ffffff !important;
  }
  [data-theme="dark"] .text-muted {
    color: #d1d5db !important;
  }
  [data-theme="dark"] .modal-content {
    background-color: var(--card-bg) !important;
    border-color: var(--border) !important;
  }
  [data-theme="dark"] .modal-title {
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-body {
    color: #ffffff !important;
  }
  [data-theme="dark"] .border {
    border-color: var(--border) !important;
  }
</style>
<div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Switch Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="account-list-container">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <form action="{% url 'users:logout' %}" method="POST" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-plus-circle me-2"></i>Add New Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const DEVICE_ID_KEY = 'pwaninet_device_id';

    function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem(DEVICE_ID_KEY);
        if (!deviceId) {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            deviceId = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            localStorage.setItem(DEVICE_ID_KEY, deviceId);
        }
        return deviceId;
    }

    async function loadAccounts(modalElement) {
        const container = modalElement ? modalElement.querySelector('#account-list-container') : document.getElementById('account-list-container');
        if (!container) return;

        // Reset spinner on each open
        container.innerHTML = `
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="small text-muted mt-2">Loading accounts…</div>
            </div>
        `;

        const deviceId = getOrCreateDeviceId();
        const baseUrl = '{% url "users:device_accounts" %}';
        const fetchUrl = `${baseUrl}?device_id=${encodeURIComponent(deviceId)}`;

        try {
            const response = await fetch(fetchUrl, {
                method: 'GET',
                headers: {
                    'X-Device-ID': deviceId,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                },
                credentials: 'same-origin'
            });

            if (!response.ok) {
                if (response.status === 401 || response.status === 403 || response.status === 302) {
                    throw new Error('Authentication required. Please refresh the page.');
                }
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            if (data.accounts && data.accounts.length > 0) {
                container.innerHTML = data.accounts.map(account => `
                    <div class="account-item d-flex align-items-center p-3 mb-2 rounded-3 ${account.is_current ? 'bg-primary bg-opacity-10 border border-primary' : 'bg-light'}">
                        <img src="${account.profile_pic || '/static/images/default_pic1.jpg'}" 
                             class="rounded-circle me-3" 
                             style="width: 48px; height: 48px; object-fit: cover;"
                             onerror="this.src='/static/images/default_pic1.jpg'">
                        <div class="flex-grow-1">
                            <div class="fw-bold">${account.full_name || account.username}</div>
                            <div class="text-muted small">@${account.username}</div>
                        </div>
                        ${account.is_current 
                            ? '<span class="badge bg-primary">Current</span>'
                            : `<a href="/users/accounts/switch/${account.id}/?device_id=${encodeURIComponent(deviceId)}" 
                                  class="btn btn-sm btn-primary rounded-pill px-3">Switch</a>`
                        }
                        ${!account.is_current 
                            ? `<a href="/users/accounts/remove/${account.id}/?device_id=${encodeURIComponent(deviceId)}" 
                                  class="btn btn-sm btn-link text-muted ms-2" title="Remove from device">
                                  <i class="bi bi-x-circle"></i></a>`
                            : ''
                        }
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div class="text-center py-4">
                        <i class="bi bi-person-circle display-4 text-muted mb-3"></i>
                        <p class="text-muted mb-1">No other accounts on this device</p>
                        <p class="text-muted small">Log out and log in with another account to add it here</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('[Account Switcher] Error loading accounts:', error);
            container.innerHTML = `
                <div class="text-center py-4 text-danger">
                    <i class="bi bi-exclamation-circle display-4 mb-3"></i>
                    <p class="mb-1 fw-semibold">Failed to load accounts</p>
                    <p class="small text-muted mb-3">${error.message || 'Unknown error'}</p>
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 retry-load-accounts-btn">
                        <i class="bi bi-arrow-clockwise me-1"></i>Retry
                    </button>
                </div>
            `;
            container.querySelector('.retry-load-accounts-btn')?.addEventListener('click', () => loadAccounts(modalElement));
        }
    }

    // Document-level listener handles modals opened via full page load, HTMX navigation, or dynamic insert
    document.addEventListener('show.bs.modal', function(e) {
        if (e.target && e.target.id === 'accountSwitcherModal') {
            loadAccounts(e.target);
        }
    });

    // Also listen for button clicks to immediately start loading without waiting for modal transition
    document.addEventListener('click', function(e) {
        const trigger = e.target.closest('[data-bs-target="#accountSwitcherModal"]');
        if (trigger) {
            const modal = document.getElementById('accountSwitcherModal');
            if (modal) {
                loadAccounts(modal);
            }
        }
    });
})();
</script>
