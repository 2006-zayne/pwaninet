{% if is_following %}
    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold onboarding-follow-btn"
            id="onboarding-follow-btn-{{ recruit.id }}"
            hx-post="{% url 'users:toggle_follow' recruit.username %}?source=onboarding"
            hx-target="#onboarding-follow-btn-{{ recruit.id }}"
            hx-swap="outerHTML">
        <i class="bi bi-check2"></i> Following
    </button>
{% else %}
    <button class="btn btn-sm btn-primary rounded-pill px-3 fw-bold onboarding-follow-btn"
            id="onboarding-follow-btn-{{ recruit.id }}"
            hx-post="{% url 'users:toggle_follow' recruit.username %}?source=onboarding"
            hx-target="#onboarding-follow-btn-{{ recruit.id }}"
            hx-swap="outerHTML">
        <i class="bi bi-person-plus-fill"></i> Follow
    </button>
{% endif %}
