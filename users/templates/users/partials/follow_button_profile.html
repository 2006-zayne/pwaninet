<form class="m-0"
      hx-post="{% url 'users:toggle_follow' profile_user.username %}"
      hx-target="#follow-btn-container"
      hx-swap="innerHTML">
    {% csrf_token %}
    <button type="submit"
            class="btn {% if is_following %}btn-outline-secondary{% else %}btn-primary{% endif %} w-100 rounded-pill fw-bold mb-2">
        {% if is_following %}Unfollow{% else %}Follow{% endif %}
    </button>
</form>

{% if is_following %}
{# Messaging button - FROZEN FOR MVP #}
{% endif %}

<h6 id="follower-count" class="fw-bold mb-0 count-number" hx-swap-oob="true">{{ follower_count }}</h6>
