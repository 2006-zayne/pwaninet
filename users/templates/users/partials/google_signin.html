{# Google sign-in button (website only). Rendered only when the Web Client ID is configured. #}
{% if google_login_enabled %}
<div class="google-signin-wrap" data-google-signin>
    <style>
        /* Match the official GIS outline/large button beside it. */
        .google-native-btn {
            width: 100%;
            height: 40px;
            background: #fff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            color: #3c4043;
            font-family: Roboto, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            padding: 0 12px;
        }
        .google-native-btn:hover { background: #f8f9fa; }
        .google-native-btn:disabled { opacity: 0.6; cursor: default; }
        .google-native-btn svg { flex-shrink: 0; }
    </style>
    <div class="d-flex align-items-center my-3" aria-hidden="true">
        <hr class="flex-grow-1">
        <span class="px-2 text-muted small">or</span>
        <hr class="flex-grow-1">
    </div>
    <div id="google-signin-button" class="d-flex justify-content-center"></div>
    <div id="google-native-button" class="d-grid gap-2 d-none">
        <button type="button" class="google-native-btn" id="googleNativeBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
            <span>Continue with Google</span>
        </button>
    </div>
    <div class="google-signin-error text-danger small text-center mt-2" role="alert" hidden></div>
    <div class="google-link-form mt-3" hidden>
        <div class="alert alert-warning small" role="alert">
            <span class="google-link-message"></span>
        </div>
        <form class="google-link-actual-form" novalidate>
            <div class="mb-2">
                <label class="form-label fw-semibold small" for="google-link-username">Username or email</label>
                <input type="text" class="form-control tactical-form-input" id="google-link-username"
                       name="username" autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>
            <div class="mb-2">
                <label class="form-label fw-semibold small" for="google-link-password">Password</label>
                <input type="password" class="form-control tactical-form-input" id="google-link-password"
                       name="password" autocomplete="current-password">
            </div>
            <div class="mb-2 google-link-code-row" hidden>
                <label class="form-label fw-semibold small" for="google-link-code">2FA code</label>
                <input type="text" class="form-control tactical-form-input" id="google-link-code"
                       name="code" autocomplete="one-time-code" inputmode="numeric">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-outline-primary">Link Google to my account</button>
            </div>
        </form>
    </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function() {
    var CLIENT_ID = "{{ google_web_client_id|escapejs }}";
    var COMPLETE_URL = "{% url 'users:google_complete' %}";
    var LINK_URL = "{% url 'users:google_link' %}";
    var LOGIN_URI = "{{ google_login_uri|escapejs }}";

    // Inside the Capacitor native shell, web Google OAuth is unsupported
    // (Google blocks OAuth in embedded WebViews). Use the native
    // Credential Manager plugin instead, then complete sign-in against the
    // same backend endpoint with the returned ID token.
    // NOTE: window.Capacitor may exist as a stub on web builds; only treat
    // as native when it reports a native platform.
    var isNative = window.Capacitor !== undefined
        && typeof window.Capacitor.isNativePlatform === 'function'
        && window.Capacitor.isNativePlatform();
    if (isNative) {
        var gisButton = document.getElementById('google-signin-button');
        if (gisButton) { gisButton.style.display = 'none'; }
        var nativeWrap = document.getElementById('google-native-button');
        if (nativeWrap) { nativeWrap.classList.remove('d-none'); }
        initNativeGoogleButton();
        initLinkForm();
        return;
    }

    function getCsrfToken() {
        var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : '';
    }

    function showError(message) {
        var el = document.querySelector('.google-signin-error');
        if (el) {
            el.textContent = message;
            el.hidden = false;
        }
    }

    function showLinkForm(message) {
        var form = document.querySelector('.google-link-form');
        var msg = document.querySelector('.google-link-message');
        if (msg && message) { msg.textContent = message; }
        if (form) { form.hidden = false; }
    }

    // Shared by the native button: same backend contract as web
    // ({status: ok|link_required|error} + redirect/message).
    function handleComplete(data) {
        var btn = document.getElementById('googleNativeBtn');
        if (!data) {
            showError('Google sign-in failed. Please try again.');
            if (btn) { btn.disabled = false; }
            return;
        }
        if (data.status === 'ok' && data.redirect) {
            window.location.href = data.redirect;
            return;
        }
        if (data.status === 'link_required') {
            showLinkForm(data.message || 'Sign in with your password to link Google sign-in.');
            if (btn) { btn.disabled = false; }
            return;
        }
        showError(data.message || 'Google sign-in failed. Please try again.');
        if (btn) { btn.disabled = false; }
    }

    function getDeviceId() {
        try {
            var key = 'vasto_device_id';
            var value = localStorage.getItem(key);
            if (!value) {
                var bytes = new Uint8Array(32);
                crypto.getRandomValues(bytes);
                value = Array.from(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
                localStorage.setItem(key, value);
            }
            return value;
        } catch (e) { return ''; }
    }

    function postJson(url, payload) {
        return fetch(url, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken(),
                'X-Requested-With': 'XMLHttpRequest',
                'X-Device-ID': getDeviceId()
            },
            body: JSON.stringify(payload)
        }).then(function(response) {
            return response.json().then(function(data) {
                data._httpStatus = response.status;
                return data;
            });
        });
    }

    // Redirect mode: Google navigates the whole page to LOGIN_URI with the
    // credential (no popup, no postMessage). Reveal the link form when the
    // backend bounced an email collision back to the login page.
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('google_link') === '1') {
        showLinkForm('');
    }

    function renderButton() {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
            setTimeout(renderButton, 300);
            return;
        }
        // HTMX swaps re-execute this partial: never render twice into the
        // same container (that stacks two "Sign in with Google" buttons).
        var container = document.getElementById('google-signin-button');
        if (!container || container.dataset.gsiRendered === 'true') return;
        try {
            window.google.accounts.id.initialize({
                client_id: CLIENT_ID,
                login_uri: LOGIN_URI,
                ux_mode: 'redirect',
                auto_select: false
            });
            window.google.accounts.id.renderButton(
                document.getElementById('google-signin-button'),
                // Match the form inputs: full container width (GSI caps at 400).
                { theme: 'outline', size: 'large', width: Math.min(Math.max(container.offsetWidth || 320, 240), 400) }
            );
            container.dataset.gsiRendered = 'true';
        } catch (error) {
            showError('Google sign-in is unavailable right now.');
        }
    }

    function initNativeGoogleButton() {
        var plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
        var SocialLogin = plugins.SocialLogin;
        var btn = document.getElementById('googleNativeBtn');
        if (!SocialLogin || !btn) {
            showError('Google sign-in is unavailable in this app version. Please update the app.');
            return;
        }
        if (btn.dataset.nativeBound === 'true') return;
        btn.dataset.nativeBound = 'true';
        SocialLogin.initialize({
            google: { webClientId: CLIENT_ID, mode: 'online' }
        }).catch(function() {
            showError('Google sign-in is unavailable right now.');
        });
        btn.addEventListener('click', function() {
            btn.disabled = true;
            var loginPromise = SocialLogin.login({
                provider: 'google',
                options: { scopes: ['openid', 'email', 'profile'] }
            });
            // Guard against plugins that return no thenable or never settle
            // on a device without a Google account / Play Services: never
            // leave the button dead.
            var p = loginPromise && typeof loginPromise.then === 'function'
                ? loginPromise
                : Promise.reject(new Error('native_login_not_available'));
            Promise.race([p, new Promise(function(_, rej) {
                setTimeout(function() { rej(new Error('native_login_timed_out')); }, 60000);
            })]).then(function(response) {
                console.log('[NativeGoogle] Raw login response:', (function(v) { try { return JSON.stringify(v); } catch (err) { return String(v); } })(response));
                // The plugin may return the token under result.idToken,
                // top-level idToken, token, credential, or as a raw string.
                // Some versions resolve with {credential: {idToken}} or
                // {idToken: ...} at various nesting levels.
                var idToken = null;
                if (typeof response === 'string') {
                    idToken = response;
                } else if (response) {
                    idToken = response.idToken || response.token || response.credential ||
                        (response.result && (response.result.idToken || response.result.token || response.result.credential)) ||
                        (response.credential && response.credential.idToken) ||
                        (response.data && response.data.idToken) ||
                        (response.accessToken && response.accessToken.idToken);
                }
                if (!idToken) {
                    console.error('[NativeGoogle] No idToken in response:', response);
                    showError('Google sign-in failed: plugin returned no token. Raw: ' + JSON.stringify(response).slice(0, 300));
                    btn.disabled = false;
                    return;
                }
                console.log('[NativeGoogle] Sending idToken to backend, length:', idToken.length);
                postJson(COMPLETE_URL, { credential: idToken })
                    .then(function(data) {
                        console.log('[NativeGoogle] Backend response:', JSON.stringify(data).slice(0, 500));
                        if (data && data.status === 'ok' && data.redirect) {
                            window.location.href = data.redirect;
                            return;
                        }
                        if (data && data.status === 'link_required') {
                            showLinkForm(data.message || 'Sign in with your password to link Google sign-in.');
                            btn.disabled = false;
                            return;
                        }
                        showError((data && data.message) || 'Google sign-in failed. Please try again.');
                        btn.disabled = false;
                    })
                    .catch(function(err) {
                        console.error('[NativeGoogle] Backend POST failed:', err);
                        showError('Google sign-in failed: server error (' + (err && err.message ? err.message : 'network') + '). Please try again.');
                        btn.disabled = false;
                    });
            }).catch(function(e) {
                var msg = e && e.message ? e.message : String(e);
                console.error('[NativeGoogle] Login rejected:', msg, 'code:', e && e.code, 'raw:', (function(v) { try { return JSON.stringify(v); } catch (err) { return String(v); } })(e));
                if (msg === 'native_login_timed_out') {
                    showError('Google sign-in timed out waiting for you to pick an account. Please try again.');
                } else if (msg === 'native_login_not_available') {
                    showError('Google sign-in is unavailable in this app version.');
                } else {
                    showError('Google sign-in failed: ' + msg);
                }
                btn.disabled = false;
            });
        });
    }

    function initLinkForm() {
    var linkForm = document.querySelector('.google-link-actual-form');
    if (linkForm) {
        linkForm.addEventListener('submit', function(event) {
            event.preventDefault();
            var payload = {
                username: document.getElementById('google-link-username').value,
                password: document.getElementById('google-link-password').value,
                code: document.getElementById('google-link-code').value
            };
            postJson(LINK_URL, payload).then(function(data) {
                if (data.status === 'ok' && data.redirect) {
                    window.location.href = data.redirect;
                    return;
                }
                if (data.status === 'two_factor_required') {
                    var row = document.querySelector('.google-link-code-row');
                    if (row) { row.hidden = false; }
                    showError(data.message);
                    return;
                }
                showError(data.message || 'Linking failed. Please try again.');
            }).catch(function() {
                showError('Linking failed. Please check your connection and try again.');
            });
        });
    }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { renderButton(); initLinkForm(); });
    } else {
        renderButton();
        initLinkForm();
    }
})();
</script>
{% endif %}
