<div class="modal fade people-modal" id="peopleModal" tabindex="-1" aria-hidden="true" role="dialog" aria-labelledby="peopleModalTitle" data-bs-backdrop="true" data-bs-keyboard="true">
  <style>
    [data-theme="dark"] .people-modal .modal-content {
      background-color: var(--card-bg) !important;
      border-color: var(--border) !important;
    }
    [data-theme="dark"] .people-modal .modal-title {
      color: #ffffff !important;
    }
    [data-theme="dark"] .people-modal .search-input {
      background: var(--card-bg) !important;
      color: #e4e6eb !important;
    }
    [data-theme="dark"] .people-modal .search-input::placeholder {
      color: #b0b3b8 !important;
    }
    [data-theme="dark"] .people-modal .search-input:focus {
      background: #3a3b3c !important;
    }
    [data-theme="dark"] .people-modal .search-icon {
      color: #b0b3b8 !important;
    }
    [data-theme="dark"] .people-modal .search-clear {
      background: #b0b3b8 !important;
    }
    [data-theme="dark"] .people-modal .search-clear:hover {
      background: #e4e6eb !important;
    }
  </style>
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
      <!-- Sticky Header -->
      <div class="modal-header people-modal-header border-0 pb-0 sticky-top" style="position: relative;">
        <div class="people-modal-handle d-md-none" aria-hidden="true"></div>
        <h5 class="modal-title fw-bold w-100 text-center pt-2" id="peopleModalTitle">People</h5>
        <button type="button" class="btn-close people-modal-close" data-bs-dismiss="modal" aria-label="Close" style="position: absolute; right: 12px; top: 8px; z-index: 10; font-size: 1.25rem; opacity: 1; background-image: none;">✕</button>
      </div>

      <!-- Sticky Search Bar -->
      <div class="modal-body people-modal-search pt-2 pb-0 sticky-top" id="peopleModalSearchContainer">
        <div class="search-form position-relative">
          <i class="bi bi-search search-icon"></i>
          <input type="text" 
                 class="form-control search-input" 
                 id="peopleSearchInput"
                 name="q"
                 placeholder="Search people, courses, years..."
                 hx-get="{% url 'users:people_search' %}"
                 hx-target="#peopleModalList"
                 hx-trigger="keyup changed delay:300ms, search"
                 hx-indicator="#peopleSearchSpinner"
                 hx-include="#peopleModalParams">
          <button type="button" class="search-clear" id="peopleSearchClear" style="display: none;">✕</button>
        </div>
        <!-- Hidden parameters for HTMX -->
        <div id="peopleModalParams" style="display: none;">
          <input type="hidden" name="connection_type" id="peopleConnectionType" value="">
          <input type="hidden" name="profile_username" id="peopleProfileUsername" value="">
        </div>
      </div>

      <!-- Scrollable Content -->
      <div class="modal-body people-modal-body pt-2" id="peopleModalBody">
        <div id="peopleModalList">
          <div class="text-center py-4">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .people-modal .modal-content {
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  
  .people-modal .btn-close {
    position: absolute !important;
    right: 12px !important;
    top: 8px !important;
    z-index: 10 !important;
    font-size: 1.25rem !important;
    opacity: 1 !important;
    background: rgba(0, 0, 0, 0.1) !important;
    border-radius: 50% !important;
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
  }
  
  .people-modal .btn-close:hover {
    background: rgba(0, 0, 0, 0.2) !important;
  }
  
  .people-modal .search-input {
    background: var(--search-bg, #e9ecef);
    border: 0;
    border-radius: 999px;
    padding: 10px 42px 10px 40px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-main, #0f172a);
    outline: none;
    transition: background 0.22s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    line-height: 1.4;
  }
  
  .people-modal .search-input::placeholder {
    color: var(--text-muted, #64748b);
    font-weight: 400;
  }
  
  .people-modal .search-input:focus {
    background: var(--search-bg-focus, #fff);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  
  .people-modal .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted, #64748b);
    font-size: 15px;
    pointer-events: none;
    transition: color 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }
  
  .people-modal .search-input:focus ~ .search-icon,
  .people-modal .search-form:focus-within .search-icon {
    color: var(--primary, #2563eb);
  }
  
  .people-modal .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--text-muted, #64748b);
    border: none;
    color: #fff;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    z-index: 2;
    transition: background 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .people-modal .search-clear:hover {
    background: var(--text-main, #0f172a);
  }
  
  .people-modal .search-input:not(:placeholder-shown) ~ .search-clear {
    display: flex !important;
  }
  
  .htmx-indicator {
    display: none !important;
  }
  
  .htmx-request .htmx-indicator {
    display: inline-block !important;
  }
  
  /* Ensure modal body has proper scrolling */
  .people-modal-body {
    overflow-y: auto;
    max-height: 60vh;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('peopleSearchInput');
  const searchClear = document.getElementById('peopleSearchClear');
  
  if (searchInput && searchClear) {
    searchClear.addEventListener('click', function() {
      searchInput.value = '';
      searchClear.style.display = 'none';
      searchInput.focus();
      // Trigger HTMX request with empty query to reset list
      htmx.trigger(searchInput, 'keyup');
    });
  }
  
  // Intersection Observer for infinite scroll in people modal
  const setupIntersectionObserver = function() {
    const modalBody = document.querySelector('#peopleModal .people-modal-body');
    const trigger = document.getElementById('people-load-more-trigger');
    
    if (modalBody && trigger) {
      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            // Trigger is visible, remove observer and trigger HTMX
            observer.unobserve(trigger);
            htmx.trigger(trigger, 'load');
          }
        });
      }, {
        root: modalBody,
        rootMargin: '100px',
        threshold: 0.1
      });
      
      observer.observe(trigger);
    }
  };
  
  // Setup observer when modal is shown
  const peopleModalEl = document.getElementById('peopleModal');
  if (peopleModalEl) {
    peopleModalEl.addEventListener('shown.bs.modal', setupIntersectionObserver);
  }
});
</script>
