{% extends 'base.html' %}

{% block content %}
<style>
  :root {
    --brand: #2563eb;
    --brand-light: #dbeafe;
    --brand-mid: #bfdbfe;
    --page-bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
  }

  [data-theme="dark"] {
    --brand: #6366f1;
    --brand-light: #312e81;
    --brand-mid: #4338ca;
    --page-bg: #18191f;
    --card-bg: #242526;
    --border: #3a3b3c;
    --text-primary: #e4e6eb;
    --text-secondary: #b0b3b8;
    --text-muted: #e4e6eb;
  }

  body { background: var(--page-bg); }

  .page-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
  }

  .page-header {
    margin-bottom: 2rem;
  }

  .page-eyebrow {
    font-size: 0.62rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-title {
    font-size: 1.75rem;
    font-weight: 900;
    color: var(--text-primary);
    letter-spacing: -1px;
    margin: 0 0 0.5rem;
  }

  .page-subtitle {
    color: var(--text-secondary);
    font-size: 0.95rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--brand);
    text-decoration: none;
    font-weight: 600;
    margin-bottom: 1.5rem;
    transition: color 0.2s ease;
  }

  .back-link:hover {
    color: #1d4ed8;
  }

  .chat-container {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 600px;
  }

  .chat-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .chat-header-info {
    flex: 1;
  }

  .chat-header-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }

  .chat-header-subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
  }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .chat-footer {
    padding: 1.25rem 1.5rem;
    border-top: 1px solid var(--border);
  }

  .message-input-container {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
  }

  .message-input {
    flex: 1;
    padding: 0.75rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-primary);
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.18s, box-shadow 0.18s;
    resize: none;
    line-height: 1.5;
  }

  .message-input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .send-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem 1.25rem;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: var(--radius-pill);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .send-button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-secondary);
  }

  .empty-state i {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.5;
    color: var(--text-muted);
  }

  .empty-state h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
  }

  .empty-state p {
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  @media (max-width: 768px) {
    .page-wrap {
      padding: 1.5rem 1rem 4rem;
    }

    .chat-container {
      height: 500px;
    }

    .chat-body {
      padding: 1rem;
    }

    .chat-footer {
      padding: 1rem;
    }
  }
</style>

<div class="page-wrap">
  <div class="page-header">
    <a href="{% url 'groups:groups_detail' group.id %}" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to Group
    </a>
    <h1 class="page-title">Group Chat</h1>
    <p class="page-subtitle">Chat with group members in real-time</p>
  </div>

  <!-- ── Chat Container ── -->
  <div class="chat-container">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="chat-header-info">
        <h2 class="chat-header-title">{{ group.name }}</h2>
        <p class="chat-header-subtitle">{{ group.member_count }} members</p>
      </div>
    </div>

    <!-- Chat Body -->
    <div class="chat-body" id="chatMessages">
      <div class="empty-state">
        <i class="bi bi-chat-dots"></i>
        <h3>Group Chat Coming Soon</h3>
        <p>Real-time messaging will be available here.</p>
      </div>
    </div>

    <!-- Chat Footer -->
    <div class="chat-footer">
      <div class="message-input-container">
        <textarea 
          class="message-input" 
          id="messageInput" 
          rows="1" 
          placeholder="Type a message..."
          style="min-height: 44px; max-height: 120px;"></textarea>
        <button class="send-button" id="sendButton">
          <i class="bi bi-send-fill"></i> Send
        </button>
      </div>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const messageInput = document.getElementById('messageInput');
  const sendButton = document.getElementById('sendButton');
  
  if (messageInput) {
    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (sendButton) sendButton.click();
      }
    });
  }

  if (sendButton) {
    sendButton.addEventListener('click', function() {
      // Placeholder for message sending logic
      alert('Group chat coming soon!');
      if (messageInput) {
        messageInput.value = '';
        messageInput.style.height = '44px';
      }
    });
  }
});
</script>

{% endblock %}
