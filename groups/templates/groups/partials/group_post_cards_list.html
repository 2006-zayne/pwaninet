{% for post in posts %}
    {% include "posts/partials/post_card.html" with post=post %}
{% endfor %}

{% if has_more_posts and is_member %}
<div id="load-more-trigger" class="text-center py-4" hx-get="{% url 'groups:groups_detail' group.id %}?page={{ next_page }}" hx-trigger="revealed" hx-target="#posts-container" hx-swap="beforeend" hx-on::before-request="this.remove()">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
{% endif %}
