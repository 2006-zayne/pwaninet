{% load static %}
<div class="text-center py-5">
    <div class="mb-3">
        <i class="bi bi-megaphone-fill" style="font-size: 64px; color: var(--text-secondary);"></i>
    </div>
    <h4 class="text-muted mb-2">No Announcements Yet</h4>
    <p class="text-muted">
        {% if is_admin %}
            Create the first announcement for this group.
        {% else %}
            Announcements will appear here when group admins create them.
        {% endif %}
    </p>
    {% if is_admin %}
        <button class="btn btn-primary rounded-pill mt-2" data-bs-toggle="modal" data-bs-target="#createAnnouncementModal">
            <i class="bi bi-plus-circle-fill me-1"></i>Create Announcement
        </button>
    {% endif %}
</div>
