{% for actor in payload.actors|slice:":5" %}
  <a href="{% url 'users:profile' actor.username %}"
     hx-get="{% url 'users:profile' actor.username %}"
     hx-target="#page-content-target"
     hx-swap="innerHTML"
     hx-push-url="true"
     hx-history="true"
     class="d-flex align-items-center gap-2 p-2 rounded"
     style="text-decoration: none; color: var(--text-primary); background-color: var(--bg-secondary);"
     onclick="event.stopPropagation()">
    <div class="rounded-circle d-flex align-items-center justify-content-center"
         style="width: 32px; height: 32px; background-color: var(--bg-tertiary); overflow: hidden;">
      {% if actor.avatar %}
        <img src="{{ actor.avatar }}" alt="{{ actor.name }}" class="rounded-circle" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
      {% else %}
        <i class="bi bi-person" style="font-size: 1rem; color: var(--text-secondary);"></i>
      {% endif %}
    </div>
    <div class="d-flex flex-column">
      <span style="font-size: 0.85rem;">{{ actor.name }}</span>
      {% if actor.timestamp %}
        <small class="text-muted" style="font-size: 0.75rem;">{{ actor.timestamp|timesince }}</small>
      {% endif %}
    </div>
  </a>
{% endfor %}

{% if payload.actors|length > 5 %}
  <div class="d-flex align-items-center justify-content-center p-2 rounded"
       style="color: var(--text-secondary); background-color: var(--bg-tertiary);">
    <span style="font-size: 0.85rem;">and {{ payload.actors|length|add:-5 }} more</span>
  </div>
{% endif %}
