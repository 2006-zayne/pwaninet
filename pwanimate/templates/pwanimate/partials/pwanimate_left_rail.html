{% load i18n %}
{% load static %}
<div class="p-3 d-flex flex-column" style="height: 100%; overflow: hidden;">
    <!-- Moved Header Tools -->
    <div class="d-flex flex-column gap-2 mb-4 pb-3 border-bottom flex-shrink-0">
        <a href="{% url 'posts:home' %}"
           class="btn btn-outline-secondary btn-sm rounded-pill d-flex align-items-center justify-content-center"
           data-bypass-htmx="true"
           hx-boost="false">
            <i class="bi bi-box-arrow-left me-1"></i> Back to PwaniNet
        </a>
        <div class="d-flex gap-2 w-100 justify-content-between mt-1">
            <div class="btn-group w-100" role="group" aria-label="Theme toggle">
                <button class="btn btn-outline-secondary btn-sm" onclick="setTheme('light')" title="Light Mode"><i class="bi bi-sun-fill text-warning"></i></button>
                <button class="btn btn-outline-secondary btn-sm" onclick="setTheme('dark')" title="Dark Mode"><i class="bi bi-moon-stars-fill text-primary"></i></button>
                <button class="btn btn-outline-secondary btn-sm" onclick="setTheme('system')" title="System Theme"><i class="bi bi-laptop text-secondary"></i></button>
            </div>
            
            {% if request.user.is_authenticated %}
            <div class="dropdown">
                <button class="btn btn-outline-secondary btn-sm text-decoration-none dropdown-toggle d-flex align-items-center justify-content-center px-3 h-100"
                        id="leftRailProfile" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                </button>
                <ul class="dropdown-menu shadow-sm border-0 mt-1" aria-labelledby="leftRailProfile">
                    <li><a class="dropdown-item" href="{% url 'users:profile' request.user.username %}" data-bypass-htmx="true" hx-boost="false"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li>
                        <button type="button"
                                class="dropdown-item d-flex align-items-center"
                                data-bs-toggle="modal"
                                data-bs-target="#pwanimateSettingsModal"
                                onclick="if (document.getElementById('pwanimateSettingsModal')) { if (typeof window.switchPwanimateSettingsTab === 'function') window.switchPwanimateSettingsTab('modal', 'personalization'); } else if (typeof window.switchPwanimateSettingsTab === 'function') { window.switchPwanimateSettingsTab('mobile', 'personalization'); }">
                            <i class="bi bi-gear me-2"></i>{% trans "Settings" %}
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form method="post" action="{% url 'logout' %}" class="m-0 p-0">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
            {% endif %}
        </div>
    </div>

    <a href="{% url 'pwanimate:index' %}"
       class="btn btn-primary w-100 btn-sm d-flex align-items-center justify-content-center gap-2 mb-3 flex-shrink-0"
       hx-get="{% url 'pwanimate:index' %}"
       hx-target="#page-content-target"
       hx-swap="innerHTML"
       hx-push-url="true">
        <i class="bi bi-plus-lg"></i>
        <span class="fw-semibold">{% trans "New Chat" %}</span>
    </a>
    <h6 class="fw-bold mb-2 text-muted small text-uppercase flex-shrink-0">{% trans "Chat History" %}</h6>
    <div id="pwanimate-sidebar-list" class="flex-grow-1 pwanimate-left-rail-list" style="min-height: 0; overflow-y: auto;">
        {% include 'pwanimate/partials/conversation_list.html' %}
    </div>
</div>
