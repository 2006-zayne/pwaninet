{% load static %}

        <!-- Pwanimate Brand -->
        <a class="nav-brand-tactical d-flex align-items-center text-decoration-none" href="{% url 'pwanimate:index' %}" data-bypass-htmx="true" hx-boost="false">
            <img src="{% static 'images/pwanimate/pwanimate-transparent.png' %}" alt="Pwanimate" style="width: 32px; height: 32px; object-fit: contain; margin-right: 8px;">
            <span>PWANI<span class="brand-net">MATE</span></span>

    <!-- Mobile Header Content (Aligned to d-xl-none to match left rail d-none d-xl-block) -->

        <button type="button" class="btn btn-link p-0 text-decoration-none" style="color: var(--pwanimate-asst-text);" data-bs-toggle="offcanvas" data-bs-target="#pwanimateMobileMenu" aria-label="Menu">
            <i class="bi bi-list" style="font-size: 1.5rem;"></i>
        </button>
    </div>
</div>
