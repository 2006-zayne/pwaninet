{% load static %}
{% load i18n %}
<div class="container d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <!-- Pwanimate Brand -->
        <a class="nav-brand-tactical d-flex align-items-center text-decoration-none" href="{% url 'pwanimate:index' %}" data-bypass-htmx="true" hx-boost="false">
            <img src="{% static 'images/pwanimate/pwanimate-transparent.png' %}" alt="Pwanimate" style="width: 32px; height: 32px; object-fit: contain; margin-right: 8px;">
            <span>PWANI<span class="brand-net">MATE</span></span>
        </a>
    </div>
    
    <!-- Mobile Header Content (Aligned to d-xl-none to match left rail d-none d-xl-block) -->
    <div class="d-flex d-xl-none align-items-center">
        <button type="button"
                class="btn btn-link p-0 text-decoration-none me-3 pwanimate-mobile-context-trigger"
                id="pwanimateMobileContextSheetBtn"
                style="color: var(--pwanimate-asst-text); position: relative;"
                title="{% trans 'Open working context' %}"
                aria-label="{% trans 'Open working context' %}">
            <i class="bi bi-collection" style="font-size: 1.1rem;"></i>
            <span class="badge rounded-pill bg-primary d-none" id="pwanimateMobileContextSheetCount" style="position:absolute; top:-7px; right:-10px; font-size:.55rem; padding:2px 4px;">0</span>
        </button>
        <button type="button" class="btn btn-link p-0 text-decoration-none" style="color: var(--pwanimate-asst-text);" data-bs-toggle="offcanvas" data-bs-target="#pwanimateMobileMenu" aria-label="Menu">
            <i class="bi bi-list" style="font-size: 1.5rem;"></i>
        </button>
    </div>
</div>
