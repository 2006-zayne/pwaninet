name: Build & Release Android APK

on:
  push:
    branches:
      - main          # auto-release when Android native code changes
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:  # manual trigger
    inputs:
      tag_name:
        description: 'Tag name to build APK for (e.g. v1.0.0). Leave empty to calculate next version automatically.'
        required: false
        default: ''

permissions:
  contents: write     # needed to push tags and create releases

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Step 1: Determine next semantic version from conventional commit messages
  #   fix: …           →  patch   1.0.0 → 1.0.1
  #   feat: …          →  minor   1.0.1 → 1.1.0
  #   feat!: … or
  #   BREAKING CHANGE  →  major   1.1.0 → 2.0.0
  # If there are no releasable commits, new_release_published = 'false'
  # and the build job is skipped automatically.
  # ─────────────────────────────────────────────────────────────────────────
  version:
    name: Determine Next Version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.tag_name == ''
    outputs:
      new_release_published: ${{ steps.semver.outputs.new_release_published }}
      new_release_version:   ${{ steps.semver.outputs.new_release_version }}
      new_release_git_tag:   ${{ steps.semver.outputs.new_release_git_tag }}

    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic-release
        id: semver
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github

  # ─────────────────────────────────────────────────────────────────────────
  # Step 2: Build & sign APK — runs when a new version is published or manual tag specified
  # ─────────────────────────────────────────────────────────────────────────
  build-and-release:
    name: Build & Upload Android APK
    needs: version
    if: always() && (needs.version.outputs.new_release_published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != ''))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version and Checkout Target
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            RAW="${TAG#v}"
          else
            TAG="${{ needs.version.outputs.new_release_git_tag }}"
            RAW="${{ needs.version.outputs.new_release_version }}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${RAW}" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "Building APK for Tag: ${TAG}, Version: ${RAW}"
          git checkout "${TAG}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies & sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Decode Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks
            echo "Keystore decoded successfully."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 not set, Gradle will build unsigned APK."
          fi

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
            echo "google-services.json restored from secrets."
          elif [ -f android/app/google-services.json ]; then
            echo "google-services.json already present."
          else
            echo "Notice: GOOGLE_SERVICES_JSON not provided, building without FCM config."
          fi

      - name: Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PATH:     ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE:      ${{ env.VERSION_CODE }}
          VERSION_NAME:      ${{ env.VERSION_NAME }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/pwaninet.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/pwaninet.apk
          else
            echo "Error: No release APK found in build outputs!"
            find android/app/build/outputs/ -name "*.apk"
            exit 1
          fi

      - name: Clean Up Keystore
        if: always()
        run: rm -f android/release.jks

      - name: Upload APK to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: output/pwaninet.apk

      - name: Notify Web / PWA Server of New Release
        run: |
          echo "Notifying web server of release ${{ env.TAG_NAME }}..."
          curl -s -X POST https://pwaninet.app/api/releases/webhook/github/ \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -d "{
              \"action\": \"published\",
              \"release\": {
                \"tag_name\": \"${{ env.TAG_NAME }}\",
                \"name\": \"Release ${{ env.VERSION_NAME }}\",
                \"body\": \"Automated release via GitHub Actions build ${{ env.VERSION_CODE }}\",
                \"prerelease\": false
              }
            }" || true

