name: Build & Release Android APK

on:
  push:
    branches:
      - main          # auto-release on every push to main
  workflow_dispatch:  # keep manual trigger for emergencies

permissions:
  contents: write     # needed to push tags and create releases

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Step 1: Determine next semantic version from conventional commit messages
  #   fix: …           →  patch   1.0.0 → 1.0.1
  #   feat: …          →  minor   1.0.1 → 1.1.0
  #   feat!: … or
  #   BREAKING CHANGE  →  major   1.1.0 → 2.0.0
  # If there are no releasable commits, new_release_published = 'false'
  # and the build job is skipped automatically.
  # ─────────────────────────────────────────────────────────────────────────
  version:
    name: Determine Next Version
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semver.outputs.new_release_published }}
      new_release_version:   ${{ steps.semver.outputs.new_release_version }}
      new_release_git_tag:   ${{ steps.semver.outputs.new_release_git_tag }}

    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run semantic-release
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes semantic-release

  # ─────────────────────────────────────────────────────────────────────────
  # Step 2: Build & sign APK — only runs when a new version was published
  # ─────────────────────────────────────────────────────────────────────────
  build-and-release:
    name: Build & Upload Android APK
    needs: version
    if: needs.version.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: ${{ needs.version.outputs.new_release_version }}
      TAG_NAME:     ${{ needs.version.outputs.new_release_git_tag }}

    steps:
      - name: Checkout repository at new tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.new_release_git_tag }}
          fetch-depth: 0

      - name: Set VERSION_CODE from run number
        run: echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies & sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks

      - name: Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PATH:     ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/pwaninet.apk

      - name: Clean Up Keystore
        if: always()
        run: rm -f android/release.jks

      - name: Upload APK to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: output/pwaninet.apk
