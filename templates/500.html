{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PwaniNet - Server Error (500)</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    
    <script>
        // Set theme immediately to prevent flash - matching base.html logic
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'system';
            let resolvedTheme = 'light';
            if (savedTheme === 'dark') {
                resolvedTheme = 'dark';
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (savedTheme === 'light') {
                resolvedTheme = 'light';
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                resolvedTheme = prefersDark ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', resolvedTheme);
            }
            if (window.AndroidBridge && typeof window.AndroidBridge.setSystemBarTheme === 'function') {
                window.AndroidBridge.setSystemBarTheme(resolvedTheme);
            }
        })();
    </script>
    
    <style>
        :root, [data-theme="light"] {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --text-dark: #0f172a;
            --text-secondary: #64748b;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --danger-light: #fee2e2;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: #312e81;
            --text-dark: #e4e6eb;
            --text-secondary: #94a3b8;
            --background: #18191f;
            --card-bg: #242526;
            --border: #3a3b3c;
            --danger-light: #450a0a;
            --danger: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 460px;
            width: 100%;
            padding: 40px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--danger-light);
            color: var(--danger);
            font-size: 32px;
            margin-bottom: 24px;
        }

        .error-code {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--danger);
            margin-bottom: 8px;
        }

        .error-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        .error-message {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-main {
            background: var(--primary);
            color: #ffffff;
            padding: 13px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-main:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-dark);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-badge">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <div class="error-code">Error 500</div>
        <h1 class="error-title">Something went wrong</h1>
        <p class="error-message">
            We experienced an unexpected server error while processing your request. Our system logs have recorded this event and our team will investigate.
        </p>
        <div class="action-buttons">
            <button onclick="window.location.reload()" class="btn-main" type="button">
                <i class="bi bi-arrow-clockwise"></i>
                Reload Page
            </button>
            <a href="/" class="btn-outline">
                <i class="bi bi-house-door"></i>
                Return to Home
            </a>
        </div>
    </div>
</body>
</html>
