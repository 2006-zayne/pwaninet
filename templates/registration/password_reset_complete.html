{% extends 'base.html' %}

{% block content %}
<style>
  [data-theme="dark"] .card {
    background-color: var(--card-bg);
    border-color: var(--border);
  }
  [data-theme="dark"] .text-dark,
  [data-theme="dark"] h2 {
    color: #e4e6eb !important;
  }
  [data-theme="dark"] .text-muted,
  [data-theme="dark"] p {
    color: #9ca3af !important;
  }
</style>
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 75vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="bi bi-check-circle-fill text-success display-4"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Password Reset Complete</h2>
                        <p class="text-muted">Your password has been successfully reset. You can now log in with your new password.</p>
                    </div>

                    <div class="alert alert-success">
                        <i class="bi bi-shield-check me-2"></i>
                        <strong>Success:</strong> Your password has been changed successfully.
                    </div>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg shadow-sm" style="border-radius: 10px;">
                            Login with New Password
                        </a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{% url 'posts:home' %}" class="text-secondary small text-decoration-none">← Back to Public View</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
