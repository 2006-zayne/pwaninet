{% load static %}
<!-- Push Notification Soft-Prompt Bottom Sheet (Web / PWA) -->
<div id="push-notification-sheet-root" style="display: none;">
  <!-- Backdrop Overlay -->
  <div id="push-sheet-backdrop" class="push-sheet-backdrop" aria-hidden="true"></div>

  <!-- Bottom Sheet Container -->
  <div id="push-sheet-container" class="push-sheet-container" role="dialog" aria-modal="true" aria-labelledby="push-sheet-title" aria-describedby="push-sheet-desc">
    <div class="push-sheet-handle-bar">
      <span class="push-sheet-handle"></span>
    </div>

    <!-- Close button -->
    <button type="button" id="push-sheet-close-btn" class="push-sheet-close-btn" aria-label="Close notification prompt">
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="push-sheet-content">
      <div class="push-sheet-icon-wrapper">
        <div class="push-sheet-icon-pulse"></div>
        <div class="push-sheet-icon">
          <i class="bi bi-bell-fill"></i>
        </div>
      </div>

      <div class="push-sheet-text">
        <h3 id="push-sheet-title" class="push-sheet-title">Never miss an update</h3>
        <p id="push-sheet-desc" class="push-sheet-desc">
          Get real-time alerts when classmates like your posts, comment on your thoughts, or send you messages.
        </p>
      </div>

      <div class="push-sheet-actions">
        <button type="button" id="btn-push-sheet-enable" class="btn btn-primary push-sheet-btn-primary">
          <span class="btn-text">
            <i class="bi bi-bell me-1"></i> Turn on notifications
          </span>
          <span class="btn-spinner d-none">
            <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            Enabling...
          </span>
        </button>
        <button type="button" id="btn-push-sheet-dismiss" class="btn btn-link push-sheet-btn-secondary">
          Not now
        </button>
      </div>
    </div>
  </div>
</div>

<style>
/* Push Notification Sheet Styles */
.push-sheet-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 10040;
  opacity: 0;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

.push-sheet-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

.push-sheet-container {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--card-bg, #ffffff);
  color: var(--text-primary, #0f172a);
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);
  z-index: 10050;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 0.75rem 1.5rem calc(1.5rem + var(--pwaninet-safe-area-bottom, env(safe-area-inset-bottom, 0px)));
  max-width: 100%;
}

[data-theme="dark"] .push-sheet-container {
  background: var(--card-bg, #1e293b);
  color: #f8fafc;
  box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.5);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.push-sheet-container.visible {
  transform: translateY(0);
}

.push-sheet-handle-bar {
  display: flex;
  justify-content: center;
  padding: 0.25rem 0 0.75rem;
}

.push-sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 4px;
  background-color: rgba(100, 116, 139, 0.4);
}

.push-sheet-close-btn {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  color: #64748b;
  font-size: 1.1rem;
  padding: 0.5rem;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: background-color 0.2s, color 0.2s;
}

.push-sheet-close-btn:hover {
  background-color: rgba(100, 116, 139, 0.15);
  color: var(--text-primary, #0f172a);
}

.push-sheet-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 0.5rem;
}

.push-sheet-icon-wrapper {
  position: relative;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1rem;
}

.push-sheet-icon {
  position: relative;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  z-index: 2;
}

.push-sheet-icon-pulse {
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  border-radius: 20px;
  background: rgba(37, 99, 235, 0.25);
  animation: pushPulse 2.5s infinite ease-out;
  z-index: 1;
}

@keyframes pushPulse {
  0% {
    transform: scale(0.95);
    opacity: 0.8;
  }
  70% {
    transform: scale(1.2);
    opacity: 0;
  }
  100% {
    transform: scale(1.2);
    opacity: 0;
  }
}

.push-sheet-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 0.4rem;
  color: inherit;
}

.push-sheet-desc {
  font-size: 0.92rem;
  color: #64748b;
  margin-bottom: 1.25rem;
  line-height: 1.45;
  max-width: 340px;
}

[data-theme="dark"] .push-sheet-desc {
  color: #94a3b8;
}

.push-sheet-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.push-sheet-btn-primary {
  padding: 0.75rem 1.25rem;
  font-weight: 600;
  border-radius: 12px;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.push-sheet-btn-primary:active {
  transform: scale(0.98);
}

.push-sheet-btn-secondary {
  color: #64748b;
  text-decoration: none;
  font-weight: 500;
  font-size: 0.9rem;
  padding: 0.4rem;
}

.push-sheet-btn-secondary:hover {
  color: inherit;
  text-decoration: none;
}

/* Desktop layout: floating notification card docked bottom-right */
@media (min-width: 768px) {
  .push-sheet-backdrop {
    background-color: transparent;
    pointer-events: none !important;
  }

  .push-sheet-container {
    left: auto;
    right: 24px;
    bottom: 24px;
    max-width: 380px;
    border-radius: 20px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    transform: translateY(120%);
    padding: 1.25rem 1.5rem;
  }

  .push-sheet-handle-bar {
    display: none;
  }

  .push-sheet-container.visible {
    transform: translateY(0);
  }
}
</style>
