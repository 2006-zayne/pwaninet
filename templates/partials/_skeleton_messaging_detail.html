<!-- Messaging Detail Skeleton - Desktop + Mobile with Container Queries -->
<style>
  :root{
    --brand:#2f63eb;
    --brand-light:#eef3ff;
    --brand-mid:#4f7df0;
    --ink-accent:#1a1410;
    --ink:#1a1a1a;
    --muted:#6b7280;
    --border:#e8e9ec;
    --bg:#f7f8fa;
    --card:#ffffff;
    --sk-base:#e9eaee;
    --sk-shine:#f6f7f9;
    --danger:#dc2626;
    --radius:14px;
  }
  [data-theme="dark"]{
    --brand:#5b8dff;
    --brand-light:#1b2540;
    --brand-mid:#3f5fb0;
    --ink-accent:#f2f3f5;
    --ink:#f2f3f5;
    --muted:#9aa0ab;
    --border:#2a2d34;
    --bg:#15161a;
    --card:#1e2025;
    --sk-base:#2a2d34;
    --sk-shine:#363a42;
    --danger:#f87171;
  }

  .messaging-detail-skeleton-container{
    container-type: inline-size;
    container-name: messaging-detail;
    width:100%;
    padding:24px;
  }

  .sk{
    background:linear-gradient(100deg, var(--sk-base) 30%, var(--sk-shine) 45%, var(--sk-base) 60%);
    background-size:250% 100%;
    animation:shimmer 1.5s ease-in-out infinite;
    border-radius:6px;
  }
  @keyframes shimmer{
    0%{background-position:120% 0;}
    100%{background-position:-20% 0;}
  }
  @media (prefers-reduced-motion: reduce){
    .sk{animation:none; background:var(--sk-base);}
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(16,24,40,.04);
    transition:background .2s ease, border-color .2s ease;
  }

  .msg-bubble-row{display:flex; gap:12px; margin-bottom:16px;}
  .msg-bubble-row.sent{justify-content:flex-end;}
  .msg-avatar{width:32px; height:32px; border-radius:50%; flex-shrink:0;}
  .msg-bubble{height:40px; border-radius:12px;}
  .msg-bubble.w70{width:70%;}
  .msg-bubble.w60{width:60%;}
  .msg-bubble.w75{width:75%;}
  .msg-bubble.w50{width:50%;}
  .msg-bubble.w65{width:65%;}

  .msg-input-area{display:flex; gap:12px; padding:18px; border-top:1px solid var(--border); margin-top:18px;}
  .msg-input-avatar{width:32px; height:32px; border-radius:50%; flex-shrink:0;}
  .msg-input{flex:1; height:40px; border-radius:999px;}
  .msg-send{width:32px; height:32px; border-radius:50%; flex-shrink:0;}
</style>

<div class="messaging-detail-skeleton-container">
  <div class="msg-bubble-row">
    <div class="msg-avatar sk"></div>
    <div class="msg-bubble w70 sk"></div>
  </div>
  <div class="msg-bubble-row sent">
    <div class="msg-bubble w60 sk"></div>
  </div>
  <div class="msg-bubble-row">
    <div class="msg-avatar sk"></div>
    <div class="msg-bubble w75 sk"></div>
  </div>
  <div class="msg-bubble-row sent">
    <div class="msg-bubble w50 sk"></div>
  </div>
  <div class="msg-bubble-row">
    <div class="msg-avatar sk"></div>
    <div class="msg-bubble w65 sk"></div>
  </div>

  <div class="msg-input-area">
    <div class="msg-input-avatar sk"></div>
    <div class="msg-input sk"></div>
    <div class="msg-send sk"></div>
  </div>
</div>
