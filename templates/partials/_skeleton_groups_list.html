<!-- Groups List/Dashboard Skeleton -->
<div class="skeleton-container">
    <!-- Groups Header -->
    <div style="padding: 12px 16px; background: var(--card-bg, #ffffff); border-bottom: 1px solid var(--border, #e2e8f0);">
        <div class="skeleton-line" style="width: 100px; height: 16px; margin-bottom: 12px;"></div>
        <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;">
            <div class="skeleton-group-item">
                <div class="skeleton-avatar" style="width: 60px; height: 60px;"></div>
                <div class="skeleton-group-label"></div>
            </div>
            <div class="skeleton-group-item">
                <div class="skeleton-avatar" style="width: 60px; height: 60px;"></div>
                <div class="skeleton-group-label"></div>
            </div>
            <div class="skeleton-group-item">
                <div class="skeleton-avatar" style="width: 60px; height: 60px;"></div>
                <div class="skeleton-group-label"></div>
            </div>
            <div class="skeleton-group-item">
                <div class="skeleton-avatar" style="width: 60px; height: 60px;"></div>
                <div class="skeleton-group-label"></div>
            </div>
        </div>
    </div>

    <!-- Groups Grid Items -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 12px;">
        <!-- Group Card 1 -->
        <div class="skeleton-post-card" style="padding: 0; height: 180px;">
            <div style="width: 100%; height: 120px;"></div>
            <div style="padding: 8px;">
                <div class="skeleton-line" style="width: 80%; height: 12px; margin-bottom: 4px;"></div>
                <div class="skeleton-line" style="width: 60%; height: 10px;"></div>
            </div>
        </div>

        <!-- Group Card 2 -->
        <div class="skeleton-post-card" style="padding: 0; height: 180px;">
            <div style="width: 100%; height: 120px;"></div>
            <div style="padding: 8px;">
                <div class="skeleton-line" style="width: 85%; height: 12px; margin-bottom: 4px;"></div>
                <div class="skeleton-line" style="width: 65%; height: 10px;"></div>
            </div>
        </div>

        <!-- Group Card 3 -->
        <div class="skeleton-post-card" style="padding: 0; height: 180px;">
            <div style="width: 100%; height: 120px;"></div>
            <div style="padding: 8px;">
                <div class="skeleton-line" style="width: 75%; height: 12px; margin-bottom: 4px;"></div>
                <div class="skeleton-line" style="width: 60%; height: 10px;"></div>
            </div>
        </div>

        <!-- Group Card 4 -->
        <div class="skeleton-post-card" style="padding: 0; height: 180px;">
            <div style="width: 100%; height: 120px;"></div>
            <div style="padding: 8px;">
                <div class="skeleton-line" style="width: 80%; height: 12px; margin-bottom: 4px;"></div>
                <div class="skeleton-line" style="width: 62%; height: 10px;"></div>
            </div>
        </div>
    </div>
</div>
