<!-- Messaging List Skeleton - Desktop + Mobile with Container Queries -->
<style>
  :root{
    --brand:#2f63eb;
    --brand-light:#eef3ff;
    --brand-mid:#4f7df0;
    --ink-accent:#1a1410;
    --ink:#1a1a1a;
    --muted:#6b7280;
    --border:#e8e9ec;
    --bg:#f7f8fa;
    --card:#ffffff;
    --sk-base:#e9eaee;
    --sk-shine:#f6f7f9;
    --danger:#dc2626;
    --radius:14px;
  }
  [data-theme="dark"]{
    --brand:#5b8dff;
    --brand-light:#1b2540;
    --brand-mid:#3f5fb0;
    --ink-accent:#f2f3f5;
    --ink:#f2f3f5;
    --muted:#9aa0ab;
    --border:#2a2d34;
    --bg:#15161a;
    --card:#1e2025;
    --sk-base:#2a2d34;
    --sk-shine:#363a42;
    --danger:#f87171;
  }

  .messaging-list-skeleton-container{
    container-type: inline-size;
    container-name: messaging-list;
    width:100%;
    padding:24px;
  }

  .sk{
    background:linear-gradient(100deg, var(--sk-base) 30%, var(--sk-shine) 45%, var(--sk-base) 60%);
    background-size:250% 100%;
    animation:shimmer 1.5s ease-in-out infinite;
    border-radius:6px;
  }
  @keyframes shimmer{
    0%{background-position:120% 0;}
    100%{background-position:-20% 0;}
  }
  @media (prefers-reduced-motion: reduce){
    .sk{animation:none; background:var(--sk-base);}
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(16,24,40,.04);
    transition:background .2s ease, border-color .2s ease;
  }

  .msg-list .msg-row{
    display:flex; align-items:flex-start; gap:14px;
    padding:18px; border-bottom:1px solid var(--border);
  }
  .msg-list .msg-row:last-child{border-bottom:none;}
  .msg-avatar{width:38px; height:38px; border-radius:50%; flex-shrink:0;}
  .msg-text{flex:1;}
  .msg-line1{width:120px; height:11px; margin-bottom:8px;}
  .msg-line2{width:80%; height:11px;}
  .msg-time{width:70px; height:10px; flex-shrink:0;}
</style>

<div class="messaging-list-skeleton-container">
  <div class="card msg-list">
    <div class="msg-row">
      <div class="msg-avatar sk"></div>
      <div class="msg-text"><div class="msg-line1 sk"></div><div class="msg-line2 sk"></div></div>
      <div class="msg-time sk"></div>
    </div>
    <div class="msg-row">
      <div class="msg-avatar sk"></div>
      <div class="msg-text"><div class="msg-line1 sk"></div><div class="msg-line2 sk"></div></div>
      <div class="msg-time sk"></div>
    </div>
    <div class="msg-row">
      <div class="msg-avatar sk"></div>
      <div class="msg-text"><div class="msg-line1 sk"></div><div class="msg-line2 sk"></div></div>
      <div class="msg-time sk"></div>
    </div>
    <div class="msg-row">
      <div class="msg-avatar sk"></div>
      <div class="msg-text"><div class="msg-line1 sk"></div><div class="msg-line2 sk"></div></div>
      <div class="msg-time sk"></div>
    </div>
    <div class="msg-row">
      <div class="msg-avatar sk"></div>
      <div class="msg-text"><div class="msg-line1 sk"></div><div class="msg-line2 sk"></div></div>
      <div class="msg-time sk"></div>
    </div>
  </div>
</div>
