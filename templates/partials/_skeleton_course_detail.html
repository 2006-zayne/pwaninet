<!-- Course Unit Detail Skeleton -->
<div class="skeleton-container">
    <!-- Course Header -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px; border-bottom: 1px solid var(--border, #e2e8f0); margin-bottom: 8px;">
        <div class="skeleton-line" style="width: 200px; height: 16px; margin-bottom: 12px;"></div>
        <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
        <div class="skeleton-line" style="width: 80%; height: 12px;"></div>
    </div>

    <!-- Course Content -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px; margin-bottom: 8px; border-bottom: 1px solid var(--border, #e2e8f0);">
        <div class="skeleton-line" style="width: 120px; height: 14px; margin-bottom: 12px;"></div>
        
        <!-- Content Block 1 -->
        <div style="margin-bottom: 16px;">
            <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
            <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
            <div class="skeleton-line" style="width: 90%; height: 12px;"></div>
        </div>

        <!-- Content Block 2 -->
        <div style="margin-bottom: 16px;">
            <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
            <div class="skeleton-line" style="width: 95%; height: 12px;"></div>
        </div>

        <!-- Content Block 3 -->
        <div>
            <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
            <div class="skeleton-line" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
            <div class="skeleton-line" style="width: 85%; height: 12px;"></div>
        </div>
    </div>

    <!-- Resources/Materials Section -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px; margin-bottom: 8px; border-bottom: 1px solid var(--border, #e2e8f0);">
        <div class="skeleton-line" style="width: 140px; height: 14px; margin-bottom: 12px;"></div>
        
        <!-- Resource Item 1 -->
        <div style="display: flex; gap: 12px; margin-bottom: 12px; padding: 12px; background: var(--background, #f8fafc); border-radius: 8px;">
            <div class="skeleton-avatar-sm"></div>
            <div style="flex: 1;">
                <div class="skeleton-line" style="width: 100%; height: 12px;"></div>
            </div>
        </div>

        <!-- Resource Item 2 -->
        <div style="display: flex; gap: 12px; padding: 12px; background: var(--background, #f8fafc); border-radius: 8px;">
            <div class="skeleton-avatar-sm"></div>
            <div style="flex: 1;">
                <div class="skeleton-line" style="width: 100%; height: 12px;"></div>
            </div>
        </div>
    </div>

    <!-- Progress Section -->
    <div style="background: var(--card-bg, #ffffff); padding: 16px;">
        <div class="skeleton-line" style="width: 100px; height: 14px; margin-bottom: 12px;"></div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="flex: 1; height: 8px; background: var(--border, #e2e8f0); border-radius: 4px;"></div>
            <div class="skeleton-line" style="width: 40px; height: 12px;"></div>
        </div>
    </div>
</div>
