{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PwaniNet - Offline</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    
    <script>
        // Set theme immediately to prevent flash - matching base.html logic
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'system';
            
            let resolvedTheme = 'light';
            if (savedTheme === 'dark') {
                resolvedTheme = 'dark';
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (savedTheme === 'light') {
                resolvedTheme = 'light';
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                // System preference
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                resolvedTheme = prefersDark ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', resolvedTheme);
            }
            if (window.AndroidBridge && typeof window.AndroidBridge.setSystemBarTheme === 'function') {
                window.AndroidBridge.setSystemBarTheme(resolvedTheme);
            }
        })();
    </script>
    
    <style>
        /* Theme variables matching base.html exactly */
        :root, [data-theme="light"] {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --text-dark: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #64748b;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --mobile-nav-bg: #fff;
        }

        /* Dark theme variables matching base.html exactly */
        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: #312e81;
            --text-dark: #e4e6eb;
            --background: #18191f;
            --card-bg: #242526;
            --border: #3a3b3c;
            --nav-bg: rgba(24, 25, 31, 0.9);
            --mobile-nav-bg: #242526;
            --text-secondary: #e4e6eb;
            --text-muted: #e4e6eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .offline-container {
            max-width: 400px;
            width: 100%;
            animation: fadeInUp 0.8s ease;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-icon img {
            width: 120px;
            height: 120px;
        }

        .offline-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        .offline-message {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .action-button {
            background: transparent;
            color: var(--text-secondary);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--border);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            width: 100%;
            max-width: 280px;
            justify-content: center;
        }

        .action-button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-button.primary {
            background: #2563eb;
            color: white;
            border: 2px solid #2563eb;
        }

        .action-button.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .offline-container {
                padding: 0 16px;
            }
            
            .offline-title {
                font-size: 24px;
            }
            
            .offline-message {
                font-size: 15px;
            }
            
            .offline-icon {
                width: 100px;
                height: 100px;
            }
            
            .offline-icon img {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .offline-title {
                font-size: 20px;
            }
            
            .offline-icon {
                width: 80px;
                height: 80px;
            }
            
            .offline-icon img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <img src="{% static 'images/web-app-manifest-192x192.png' %}" alt="PwaniNet">
        </div>
        
        <h1 class="offline-title">YOU ARE OFFLINE</h1>
        
        <p class="offline-message">
            WE WILL RECONNECT WHEN YOU HAVE INTERNET ACCESS
        </p>
        
        <div class="action-buttons">
            <a href="/" class="action-button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 19v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"></path>
                    <polyline points="7 9 12 4 17 9"></polyline>
                    <line x1="12" y1="4" x2="12" y2="17"></line>
                </svg>
                <span>VIEW CACHED PAGES</span>
            </a>
            <a href="/offline-media/" class="action-button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>VIEW DOWNLOADED MEDIA</span>
            </a>
        </div>
    </div>

    <script>
        // Auto-reconnect when server is reachable
        let isReconnecting = false;
        function attemptReconnect() {
            if (isReconnecting) return;
            isReconnecting = true;
            fetch('/api/health/', { mode: 'no-cors', cache: 'no-store' })
                .then(() => {
                    if (checkInterval) {
                        clearInterval(checkInterval);
                        checkInterval = null;
                    }
                    window.location.href = '/';
                })
                .catch(() => {
                    isReconnecting = false;
                });
        }

        window.addEventListener('online', attemptReconnect);

        // Listen for theme changes
        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') {
                applyTheme(e.newValue || 'system');
            }
        });

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            const savedTheme = localStorage.getItem('theme') || 'system';
            if (savedTheme === 'system') {
                applyTheme('system');
            }
        });

        function applyTheme(theme) {
            let resolvedTheme = 'light';
            if (theme === 'dark') {
                resolvedTheme = 'dark';
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (theme === 'light') {
                resolvedTheme = 'light';
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                // System preference
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                resolvedTheme = prefersDark ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', resolvedTheme);
            }
            if (window.AndroidBridge && typeof window.AndroidBridge.setSystemBarTheme === 'function') {
                window.AndroidBridge.setSystemBarTheme(resolvedTheme);
            }
        }

        // Periodic connection check - verify reachability, avoid blind loop
        let checkInterval = setInterval(() => {
            if (navigator.onLine) {
                attemptReconnect();
            }
        }, 5000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
        });
    </script>
</body>
</html>
