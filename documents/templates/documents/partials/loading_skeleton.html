{% load static %}
<div class="doc-skeleton-card" 
     style="background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 16px; overflow: hidden; height: 100%;">
    
    <!-- Skeleton Preview -->
    <div class="doc-skeleton-preview"
         style="aspect-ratio: 16/10; background: linear-gradient(90deg, 
                var(--border) 25%, var(--primary-light) 50%, var(--border) 75%);
                background-size: 200% 100%; animation: shimmer 1.5s infinite;">
    </div>
    
    <!-- Skeleton Content -->
    <div style="padding: 16px;">
        <div class="doc-skeleton-badge"
             style="width: 80px; height: 24px; background: var(--border); 
                    border-radius: 20px; margin-bottom: 12px;"></div>
        
        <div class="doc-skeleton-title"
             style="width: 100%; height: 20px; background: var(--border); 
                    border-radius: 4px; margin-bottom: 8px;"></div>
        
        <div class="doc-skeleton-title"
             style="width: 70%; height: 20px; background: var(--border); 
                    border-radius: 4px; margin-bottom: 12px;"></div>
        
        <div class="doc-skeleton-unit"
             style="width: 40%; height: 16px; background: var(--border); 
                    border-radius: 4px; margin-bottom: 16px;"></div>
        
        <div class="doc-skeleton-stats"
             style="display: flex; gap: 16px; padding-top: 12px; 
                    border-top: 1px solid var(--border);">
            <div style="width: 50px; height: 16px; background: var(--border); 
                    border-radius: 4px;"></div>
            <div style="width: 50px; height: 16px; background: var(--border); 
                    border-radius: 4px;"></div>
        </div>
    </div>
</div>

<style>
@keyframes shimmer {
    0% {
        background-position: -200% 0;
    }
    100% {
        background-position: 200% 0;
    }
}

@media (max-width: 768px) {
    .doc-skeleton-card {
        min-height: 280px;
    }
}
</style>
