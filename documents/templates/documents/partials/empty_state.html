{% load static %}
<div class="doc-empty-state" 
     style="text-align: center; padding: 60px 20px;">
    <div class="doc-empty-icon" 
         style="width: 120px; height: 120px; margin: 0 auto 24px auto;
                background: var(--primary-light); border-radius: 50%;
                display: flex; align-items: center; justify-content: center;">
        <i class="bi bi-folder-plus" 
           style="font-size: 3rem; color: var(--primary);"></i>
    </div>
    
    <h3 class="doc-empty-title" 
        style="font-size: 1.25rem; font-weight: 600; margin: 0 0 8px 0; 
               color: var(--text-dark);">
        {{ title|default:"No documents yet" }}
    </h3>
    
    <p class="doc-empty-message" 
       style="font-size: 1rem; color: var(--text-secondary); margin: 0 0 24px 0;">
        {{ message|default:"Be the first to contribute to this collection." }}
    </p>
    
    {% if action_url|default:'' %}
    <a href="{{ action_url }}" 
       class="btn btn-primary"
       style="padding: 12px 24px; border-radius: 12px; font-weight: 600;">
        {{ action_text|default:"Upload your first document" }}
    </a>
    {% endif %}
</div>

<style>
@media (max-width: 768px) {
    .doc-empty-icon {
        width: 100px;
        height: 100px;
    }
    
    .doc-empty-icon i {
        font-size: 2.5rem;
    }
    
    .doc-empty-title {
        font-size: 1.1rem;
    }
    
    .doc-empty-message {
        font-size: 0.9rem;
    }
}
</style>
