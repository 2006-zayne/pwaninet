{% load static %}
<div class="modal fade" id="deleteDocumentModal-{{ document.share_id }}" tabindex="-1" aria-labelledby="deleteDocumentModalLabel-{{ document.share_id }}" aria-hidden="true" style="z-index: 1060;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: 1px solid var(--border); background: var(--card-bg);">
            <div class="modal-header" style="border-bottom: 1px solid var(--border); padding: 16px 20px;">
                <h5 class="modal-title" id="deleteDocumentModalLabel-{{ document.share_id }}" style="font-weight: 600; font-size: 1.1rem; color: #dc3545; margin: 0; display: flex; align-items: center; gap: 8px;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Delete Document
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'documents:delete_document' document.share_id %}" 
                  method="post"
                  hx-post="{% url 'documents:delete_document' document.share_id %}"
                  hx-target="#doc-card-wrapper-{{ document.share_id }}"
                  hx-swap="outerHTML"
                  onsubmit="const m = bootstrap.Modal.getInstance(document.getElementById('deleteDocumentModal-{{ document.share_id }}')); if (m) m.hide();">
                {% csrf_token %}
                <div class="modal-body" style="padding: 24px; text-align: center;">
                    <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(220, 53, 69, 0.1); color: #dc3545; display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; margin-bottom: 16px;">
                        <i class="bi bi-trash3"></i>
                    </div>
                    <h4 style="font-size: 1.15rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px;">
                        Are you sure you want to delete this document?
                    </h4>
                    <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0; line-height: 1.5;">
                        <strong style="color: var(--text-dark);">"{{ document.title }}"</strong> will be archived and removed from the repository, search indexes, and student downloads.
                    </p>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--border); padding: 16px 20px; justify-content: center; gap: 12px;">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" style="border-radius: 10px; font-weight: 500; min-width: 100px;">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-danger" style="border-radius: 10px; font-weight: 600; min-width: 130px;">
                        <i class="bi bi-trash me-1"></i> Delete Document
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const modalEl = document.getElementById('deleteDocumentModal-{{ document.share_id }}');
    if (modalEl) {
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.show();
    }
})();
</script>
