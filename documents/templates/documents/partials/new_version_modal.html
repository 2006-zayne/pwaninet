{% load static %}
<div class="modal fade" id="newVersionModal-{{ document.share_id }}" tabindex="-1" aria-labelledby="newVersionModalLabel-{{ document.share_id }}" aria-hidden="true" style="z-index: 1060;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: 1px solid var(--border); background: var(--card-bg);">
            <div class="modal-header" style="border-bottom: 1px solid var(--border); padding: 16px 20px;">
                <h5 class="modal-title" id="newVersionModalLabel-{{ document.share_id }}" style="font-weight: 600; font-size: 1.1rem; color: var(--text-dark); margin: 0; display: flex; align-items: center; gap: 8px;">
                    <i class="bi bi-cloud-arrow-up" style="color: var(--primary);"></i>
                    Upload New Version
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="newVersionForm-{{ document.share_id }}" 
                  enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body" style="padding: 20px;">
                    <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 16px;">
                        Uploading a new file will increment the document version, replace the active preview with the new version, and preserve historical versions in the version history log.
                    </p>

                    <!-- File Input -->
                    <div class="mb-3">
                        <label for="version-file-{{ document.share_id }}" class="form-label" style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);">
                            Select Document File <span class="text-danger">*</span>
                        </label>
                        <input type="file" 
                               class="form-control" 
                               id="version-file-{{ document.share_id }}" 
                               name="file" 
                               accept=".pdf,.docx,.doc,.pptx,.ppt,.zip,.rar" 
                               required
                               style="border-radius: 10px; border-color: var(--border); background: var(--input-bg); color: var(--text-dark);">
                        <small class="text-muted" style="font-size: 0.8rem; margin-top: 4px; display: block;">
                            Supported: PDF, DOCX, DOC, PPTX, PPT, ZIP, RAR (Max 50MB)
                        </small>
                    </div>

                    <!-- Changelog / Notes -->
                    <div class="mb-3">
                        <label for="version-notes-{{ document.share_id }}" class="form-label" style="font-weight: 600; font-size: 0.9rem; color: var(--text-dark);">
                            Version Change Notes
                        </label>
                        <textarea class="form-control" 
                                  id="version-notes-{{ document.share_id }}" 
                                  name="change_notes" 
                                  rows="3" 
                                  placeholder="e.g. Added chapter 5 questions, corrected lecture 3 formulas..."
                                  style="border-radius: 10px; border-color: var(--border); background: var(--input-bg); color: var(--text-dark); resize: vertical;"></textarea>
                    </div>

                    <div id="newVersionError-{{ document.share_id }}" class="alert alert-danger d-none" style="border-radius: 10px; font-size: 0.875rem; padding: 10px 14px;"></div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--border); padding: 16px 20px;">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" style="border-radius: 10px; font-weight: 500;">
                        Cancel
                    </button>
                    <button type="button" 
                            id="submitNewVersionBtn-{{ document.share_id }}" 
                            class="btn btn-primary" 
                            onclick="handleNewVersionUpload('{{ document.share_id }}')"
                            style="border-radius: 10px; font-weight: 600; padding: 8px 20px;">
                        <i class="bi bi-cloud-arrow-up me-1"></i> Upload Version
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const modalEl = document.getElementById('newVersionModal-{{ document.share_id }}');
    if (modalEl) {
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.show();
    }
})();

function handleNewVersionUpload(docId) {
    const fileInput = document.getElementById('version-file-' + docId);
    const errorAlert = document.getElementById('newVersionError-' + docId);
    const submitBtn = document.getElementById('submitNewVersionBtn-' + docId);
    const notesInput = document.getElementById('version-notes-' + docId);

    errorAlert.classList.add('d-none');
    errorAlert.textContent = '';

    if (!fileInput.files || fileInput.files.length === 0) {
        errorAlert.textContent = 'Please select a document file to upload.';
        errorAlert.classList.remove('d-none');
        return;
    }

    if (!window.resumableUpload || typeof window.resumableUpload.start !== 'function') {
        errorAlert.textContent = 'The upload engine is not ready yet. Please refresh and try again.';
        errorAlert.classList.remove('d-none');
        return;
    }

    const file = fileInput.files[0];
    const allowed = ['pdf', 'docx', 'doc', 'pptx', 'ppt', 'zip', 'rar'];
    const ext = (file.name || '').split('.').pop().toLowerCase();
    if (allowed.indexOf(ext) === -1) {
        errorAlert.textContent = `File type '${ext}' is not allowed. Supported formats: ${allowed.join(', ').toUpperCase()}`;
        errorAlert.classList.remove('d-none');
        return;
    }
    if (file.size > 50 * 1024 * 1024) {
        errorAlert.textContent = 'File size exceeds maximum of 50MB';
        errorAlert.classList.remove('d-none');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Uploading...';

    // Banner: the donut follows the transfer.
    if (window.uploadUI && typeof window.uploadUI.show === 'function') {
        window.uploadUI.show();
        window.uploadUI.setHeaderTitle('NEW VERSION UPLOAD', 'phase-upload');
        window.uploadUI.setTitle(file.name);
        window.uploadUI.setSubtitle('Sending straight to storage…');
        window.uploadUI.setProgressFillClass('phase-upload');
        window.uploadUI.setAggregateProgress(0, 'Uploading 0%');
    }

    const onProgress = (ev) => {
        const detail = ev.detail || {};
        const pct = detail.total ? Math.round((detail.loaded / detail.total) * 100) : 0;
        if (window.uploadUI) window.uploadUI.setAggregateProgress(pct, `Uploading ${pct}%`);
    };
    window.addEventListener('resumable-upload-progress', onProgress);

    // Direct to the bucket through the shared engine; the server adds the
    // version and keeps processing it in the background.
    window.resumableUpload.start(file, {
        kind: 'document',
        document: {
            target: 'version',
            document_share_id: docId,
            change_notes: notesInput ? notesInput.value.trim() : '',
        },
    }).then(function(response) {
        window.removeEventListener('resumable-upload-progress', onProgress);

        const modalEl = document.getElementById('newVersionModal-' + docId);
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();

        if (window.uploadUI) {
            window.uploadUI.setHeaderTitle('VERSION UPLOADED', 'phase-published');
            window.uploadUI.setTitle('New version uploaded!');
            window.uploadUI.setSubtitle('Processing in the background — carry on, we will keep working');
            window.uploadUI.setProgressFillClass('phase-published');
            window.uploadUI.setAggregateProgress(100, 'Uploaded ✓');
            window.uploadUI.clearAggregateProgress();
            setTimeout(function() {
                if (window.uploadUI) window.uploadUI.hide();
            }, 4000);
        }

        // Refresh current view using HTMX or location reload
        if (window.htmx) {
            htmx.ajax('GET', window.location.pathname, '#page-content-target');
        } else {
            window.location.reload();
        }
        return response;
    }).catch(function(err) {
        window.removeEventListener('resumable-upload-progress', onProgress);
        console.error('[NewVersion] transfer failed:', err);
        const message = (err && err.message) ? err.message : 'Upload failed';
        errorAlert.textContent = message;
        errorAlert.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-cloud-arrow-up me-1"></i> Upload Version';
        if (window.uploadUI) {
            window.uploadUI.clearAggregateProgress();
            window.uploadUI.showError(message, false);
        }
    });
}
</script>
