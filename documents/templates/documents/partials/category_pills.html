{% load static %}
<div class="doc-categories-container" style="margin-bottom: 40px;">
    <div class="doc-categories-scroll" 
         style="display: flex; gap: 12px; overflow-x: auto; 
                padding: 8px 4px; scroll-behavior: smooth;">
        
        {% if categories %}
            {% for category in categories %}
                <a href="{% url 'documents:search' %}?category={{ category.code }}"
                   hx-get="{% url 'documents:search' %}?category={{ category.code }}"
                   hx-target="#page-content-target"
                   hx-swap="innerHTML"
                   hx-push-url="true"
                   hx-history="true"
                   class="doc-category-pill {% if active_category == category.code %}active{% endif %}"
                   style="flex-shrink: 0; padding: 10px 20px; 
                          border-radius: 24px; border: 2px solid var(--border);
                          background: var(--card-bg); color: var(--text-secondary);
                          font-weight: 600; font-size: 0.9rem; text-decoration: none;
                          transition: all 0.2s ease; white-space: nowrap;">
                    {{ category.name }}
                </a>
            {% endfor %}
        {% else %}
            <!-- Fallback hardcoded categories if no data -->
            <a href="{% url 'documents:search' %}?category=past_paper"
               hx-get="{% url 'documents:search' %}?category=past_paper"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="doc-category-pill {% if active_category == 'past_paper' %}active{% endif %}"
               style="flex-shrink: 0; padding: 10px 20px; 
                      border-radius: 24px; border: 2px solid var(--border);
                      background: var(--card-bg); color: var(--text-secondary);
                      font-weight: 600; font-size: 0.9rem; text-decoration: none;
                      transition: all 0.2s ease; white-space: nowrap;">
                Past Papers
            </a>
            
            <a href="{% url 'documents:search' %}?category=lecture_notes"
               hx-get="{% url 'documents:search' %}?category=lecture_notes"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="doc-category-pill {% if active_category == 'lecture_notes' %}active{% endif %}"
               style="flex-shrink: 0; padding: 10px 20px; 
                      border-radius: 24px; border: 2px solid var(--border);
                      background: var(--card-bg); color: var(--text-secondary);
                      font-weight: 600; font-size: 0.9rem; text-decoration: none;
                      transition: all 0.2s ease; white-space: nowrap;">
                Lecture Notes
            </a>
            
            <a href="{% url 'documents:search' %}?category=cat"
               hx-get="{% url 'documents:search' %}?category=cat"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="doc-category-pill {% if active_category == 'cat' %}active{% endif %}"
               style="flex-shrink: 0; padding: 10px 20px; 
                      border-radius: 24px; border: 2px solid var(--border);
                      background: var(--card-bg); color: var(--text-secondary);
                      font-weight: 600; font-size: 0.9rem; text-decoration: none;
                      transition: all 0.2s ease; white-space: nowrap;">
                CATs
            </a>
            
            <a href="{% url 'documents:search' %}?category=assignment"
               hx-get="{% url 'documents:search' %}?category=assignment"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="doc-category-pill {% if active_category == 'assignment' %}active{% endif %}"
               style="flex-shrink: 0; padding: 10px 20px; 
                      border-radius: 24px; border: 2px solid var(--border);
                      background: var(--card-bg); color: var(--text-secondary);
                      font-weight: 600; font-size: 0.9rem; text-decoration: none;
                      transition: all 0.2s ease; white-space: nowrap;">
                Assignments
            </a>
            
            <a href="{% url 'documents:search' %}?category=slides"
               hx-get="{% url 'documents:search' %}?category=slides"
               hx-target="#page-content-target"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-history="true"
               class="doc-category-pill {% if active_category == 'slides' %}active{% endif %}"
               style="flex-shrink: 0; padding: 10px 20px; 
                      border-radius: 24px; border: 2px solid var(--border);
                      background: var(--card-bg); color: var(--text-secondary);
                      font-weight: 600; font-size: 0.9rem; text-decoration: none;
                      transition: all 0.2s ease; white-space: nowrap;">
                Slides
            </a>
        {% endif %}
    </div>
</div>

<style>
.doc-categories-scroll::-webkit-scrollbar {
    display: none;
}

.doc-categories-scroll {
    -ms-overflow-style: none;
    scrollbar-width: none;
}

.doc-category-pill:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-2px);
}

.doc-category-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

@media (max-width: 768px) {
    .doc-category-pill {
        padding: 8px 16px;
        font-size: 0.85rem;
    }
}
</style>
