services:
  db:
    image: pgvector/pgvector:pg15
    container_name: pwaninet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pwaninet_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /srv/prod-app/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pwaninet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pwaninet_net
  redis:
    image: redis:7-alpine
    container_name: pwaninet_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - /srv/prod-app/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pwaninet_net
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwaninet_web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-pwaninet.settings.production}
      REDIS_HOST: ${REDIS_HOST:-redis}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /srv/prod-app/src:/app
      - /srv/prod-app/data/media:/app/media
      - /srv/prod-app/src/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    command: >
      sh -c "mkdir -p /app/media/temp &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 --ping-interval 20 --ping-timeout 60 pwaninet.asgi:application"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pwaninet_net
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwaninet_celery
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-pwaninet.settings.production}
      REDIS_HOST: ${REDIS_HOST:-redis}
    volumes:
      - /srv/prod-app/src:/app
      - /srv/prod-app/data/media:/app/media
      - /srv/prod-app/src/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    command: celery -A pwaninet worker -l info --concurrency=2 -Q default,media_queue,docs_queue,search_queue
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pwaninet_net

  # spark-vector: self-hosted embedding worker (docs/local-models-design.md §4).
  # Weights baked at build (pinned revision + checksum); internal only, no
  # host ports. Cut over by setting PWANIMATE_EMBEDDING_PROVIDER=selfhosted.
  spark_vector:
    build:
      context: spark_vector
      dockerfile: Dockerfile
    container_name: pwaninet_spark_vector
    restart: unless-stopped
    env_file: .env
    environment:
      SPARK_VECTOR_MODEL_NAME: ${SPARK_VECTOR_MODEL_NAME:-multilingual-e5-base}
      SPARK_VECTOR_EXPECTED_DIMENSIONS: ${SPARK_VECTOR_EXPECTED_DIMENSIONS:-768}
      SPARK_VECTOR_TOKEN: ${SPARK_VECTOR_TOKEN:-}
      # One inference slot; interactive queries are admitted ahead of bulk
      # ingestion batches, and a backlog above the cap is refused (503) so
      # callers back off instead of piling onto a busy 2-vCPU box.
      SPARK_VECTOR_INFER_CONCURRENCY: ${SPARK_VECTOR_INFER_CONCURRENCY:-1}
      SPARK_VECTOR_MAX_TOKENS_PER_REQUEST: ${SPARK_VECTOR_MAX_TOKENS_PER_REQUEST:-4096}
      SPARK_VECTOR_MAX_WAITERS: ${SPARK_VECTOR_MAX_WAITERS:-32}
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - pwaninet_net

networks:
  pwaninet_net:
    driver: bridge
